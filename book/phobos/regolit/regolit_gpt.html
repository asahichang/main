<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phobos Regolith Fabricator</title>
<style>
:root{color-scheme:dark;--bg:#080a0c;--p:#101419;--l:#303840;--t:#e9edf0;--m:#87919a;--a:#ef8734}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui}#app{min-height:100vh;background:linear-gradient(135deg,#07090b,#11100d)}header{height:72px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l);background:#090c0f}h1{font-size:16px;letter-spacing:.16em}h1 b{color:var(--a)}.mission{font:10px monospace;color:#68737d}.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 72px)}aside{padding:20px 15px;border-right:1px solid var(--l);background:#0c1014}.k{font:10px monospace;color:#69747d;letter-spacing:.15em;margin:0 9px 12px}.levels{display:grid;gap:7px}.level{border:1px solid #283038;background:#11161b;color:#aeb7be;border-radius:7px;text-align:left;padding:11px;cursor:pointer}.level.active{border-color:#985628;background:#21150f;color:#fff;box-shadow:inset 3px 0 var(--a)}.num{font:10px monospace;color:#77818a}.lname{font-size:12px;font-weight:650;margin-top:4px}.small{font-size:10px;color:#707a83;margin-top:3px}.spec{margin:22px 9px 0;border-top:1px solid var(--l);padding-top:13px}.row{display:flex;justify-content:space-between;padding:6px 0;font:10px monospace;color:#77828b}.row b{color:#d9dde0}.legend{margin:18px 9px;font-size:10px;line-height:1.7;color:#657078}main{padding:22px 24px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}h2{font-size:23px;margin:0 0 4px}.desc{font-size:12px;color:#818c95}.status{font:10px monospace;color:#7e8992}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#62d38b;box-shadow:0 0 9px #62d38b;margin-right:6px}.box{border:1px solid #303840;border-radius:9px;overflow:hidden;background:#050709}.scene{width:100%;aspect-ratio:16/8.7;display:block}.caption{display:flex;justify-content:space-between;padding:11px 14px;background:#0d1216;border-top:1px solid #252c33;font:10px monospace;color:#74808a}.caption strong{color:#bfc6ca}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}.metric{border:1px solid #272e35;background:#0e1317;border-radius:7px;padding:10px 12px}.mh{font:9px monospace;color:#66717b;text-transform:uppercase}.val{font:17px monospace;margin-top:5px}.unit{font-size:9px;color:#707a83;margin-left:3px}.bar{height:3px;background:#222930;margin-top:8px}.bar i{display:block;height:100%;background:var(--a);width:var(--w)}.flow{display:flex;gap:8px;align-items:center;overflow:auto;white-space:nowrap;margin-top:12px;padding:9px 11px;border:1px solid #242b32;border-radius:7px}.node{font:9px monospace;color:#929da6;border:1px solid #2b3239;border-radius:4px;padding:5px 7px}.node.on{color:#f0c49c;border-color:#79431f;background:#1d130d}.arrow{color:#59636c}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--l)}.levels{grid-template-columns:repeat(3,1fr)}.spec,.legend,.mission{display:none}main{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style><body><div id="app"><header><h1>PHOBOS <b>//</b> REGOLITH FABRICATOR</h1><div class="mission">AUTONOMOUS INDUSTRIAL SYSTEM · LOW-G · VACUUM · 2048</div></header><div class="layout"><aside><p class="k">TECHNOLOGICAL LEVELS</p><div class="levels" id="levels"></div><div class="spec" id="spec"></div><div class="legend">Условная инженерная визуализация. SVG-сцены показывают технологический процесс, масштаб и характер среды Фобоса.</div></aside><main><div class="top"><div><h2 id="title"></h2><div class="desc" id="desc"></div></div><div class="status"><i class="dot"></i>SYSTEM NOMINAL</div></div><div class="box"><svg id="scene" class="scene" viewBox="0 0 1200 653" role="img" aria-label="Фабрика реголита на Фобосе"><rect width="1200" height="653" fill="#050709"/><circle cx="980" cy="140" r="230" fill="#68483d"/><path d="M0 430L90 230 170 285 260 170 350 275 450 190 540 290 650 200 750 300 860 175 970 280 1080 210 1200 290V653H0Z" fill="#252a2d"/><path d="M480 350L600 255 720 350V653H480Z" fill="#06080a" stroke="#697279" stroke-width="6"/><text x="40" y="625" fill="#7c8790" font-size="11" font-family="monospace">PHOBOS / AUTONOMOUS INDUSTRIAL SECTION</text></svg><div class="caption"><strong id="cap"></strong><span id="det"></span></div></div><div class="metrics" id="metrics"></div><div class="flow" id="flow"></div></main></div></div>
<script>
const D=[
['Поверхностный бункер и приёмная шахта','Приём сырого реголита с поверхности Фобоса','Низкий ракурс из шахты · баллистический поток реголита','MARS BACKLIGHT / HARD SHADOWS',['−63 °C','0.0006 g','18.4 t/h','−42 m'],[['Глубина','−42','m'],['Вакуум','<10⁻⁶','bar'],['Подача','18.4','t/h'],['Сигнал','AMBER','']],['ПОВЕРХНОСТЬ','РОВЕРЫ','ПРИЁМНИК','ШАХТА']],
['Вибро-сепарация и дегазация','Фракционирование сухого реголита и извлечение летучих','Каскад подвесных сит · вакуумная дегазация · ловушки','LOCAL WHITE WORKLIGHT / HEATER GLOW',['−35 °C','0.8 mm/s','420 °C','94.7%'],[['Фракция','0.2–80','mm'],['Дегазация','94.7','%'],['Нагрев','420','°C'],['Вибрация','0.7','mm/s']],['СЫРОЙ РЕГОЛИТ','СИТА','ПЕСОК','ДЕГАЗАТОР','ЛЕТУЧИЕ']],
['Ядерно-индукционный плавильный цех','Плавление базальтовой фракции в защищённом реакторном бункере','Индукционный тигель · молибденовые шнеки · реактор','1250 °C MELT / CHERENKOV BLUE',['1250 °C','4.8 MW','6.2 t/h','Nb alloy'],[['Расплав','1250','°C'],['Мощность','4.8','MW'],['Подача','6.2','t/h'],['Давление','10⁻⁷','bar']],['ПЕСОК','МОЛИБДЕН. ШНЕК','ТИГЕЛЬ','РАСПЛАВ','ЛИТЬЁ']],
['Центробежно-литейная карусель','Высокоскоростное формование Hex-Interlock блоков','Магнитный ротор Ø 11 м · радиальное литьё · роботы','MAGLEV BEARING / SYNCHRO STROBE',['11 m','148 rpm','1120 °C','6 robots'],[['Диаметр','11','m'],['Обороты','148','rpm'],['Темп.','1120','°C'],['Роботы','06','units']],['РАСПЛАВ','РАСПРЕДЕЛИТЕЛЬ','ФОРМЫ','БЛОКИ','ВЫГРУЗКА']],
['Термотуннель раскристаллизации','Контролируемое охлаждение и стабилизация структуры блоков','Магнитный конвейер · шесть термозон · пирометры','1100 °C → AMBIENT / PASSIVE COOLING',['86 m','1100→−40 °C','6 zones','maglev'],[['Длина','86','m'],['Старт','1100','°C'],['Финиш','−40','°C'],['Зоны','06','cells']],['ОТЛИВКА','1100°C','700°C','350°C','ЧЁРНЫЙ БЛОК']],
['Автоматизированный сотовый склад','Фиксация готовых Hex-Interlock блоков в микрогравитации','Трёхэтажный массив · базальтовые направляющие · краны','5000 K WORKLIGHT / LASER GRID',['28,640 blk','11.8 m','73.2%','4 cranes'],[['Ёмкость','28,640','blocks'],['Высота','11.8','m'],['Заполнено','73.2','%'],['Кранов','04','units']],['ОХЛАЖДЕНИЕ','ИНСПЕКЦИЯ','HEX-ARRAY','СКЛАД','ОТГРУЗКА']]];
const scene=(n)=>{let defs='<defs><radialGradient id="g"><stop stop-color="#ffb52e" stop-opacity=".7"/><stop offset="1" stop-color="#ff5b15" stop-opacity="0"/></radialGradient><linearGradient id="r" x2="0" y2="1"><stop stop-color="#44484a"/><stop offset="1" stop-color="#171a1c"/></linearGradient></defs>';let s='<rect width="1200" height="653" fill="#050709"/>'+defs;const label=`<g><rect x="32" y="28" width="225" height="29" rx="4" fill="#080b0d" stroke="#39424a"/><text x="46" y="48" fill="#aab3b8" font-size="10" font-family="monospace" letter-spacing="2">LEVEL 0${n+1} / PHOBOS FAB</text></g>`;
if(n===0)s+=`<circle cx="980" cy="140" r="230" fill="#68483d"/><path d="M0 430L90 230 170 285 260 170 350 275 450 190 540 290 650 200 750 300 860 175 970 280 1080 210 1200 290V653H0Z" fill="url(#r)"/><path d="M480 350L600 255 720 350V653H480Z" fill="#06080a" stroke="#697279" stroke-width="6"/><g stroke="#8d5d34" stroke-width="4"><path d="M500 350L360 250M700 350L850 245M535 335L450 210M665 335L755 210"/></g><g fill="#667077" stroke="#252b2f" stroke-width="4"><rect x="340" y="320" width="110" height="40" rx="10"/><circle cx="365" cy="370" r="15"/><circle cx="425" cy="370" r="15"/><rect x="750" y="320" width="110" height="40" rx="10"/><circle cx="775" cy="370" r="15"/><circle cx="835" cy="370" r="15"/></g><g fill="#d99a4a">${[520,555,610,660].map((x,i)=>`<circle cx="${x}" cy="${390+i*48}" r="${3+i%2*2}"/>`).join('')}</g>`;
if(n===1)s+=`<path d="M0 0H1200V653H0Z" fill="#20262a"/><path d="M110 70Q600 15 1090 70L1050 590Q600 640 150 590Z" fill="#090b0d" stroke="#4d575e" stroke-width="24"/><g stroke="#9aa4aa" stroke-width="9" fill="none"><path d="M150 180L530 245 450 325 115 260"/><path d="M320 315L760 370 670 450 265 390"/><path d="M560 460L1040 505 940 570 500 535"/></g><g fill="#333b40" stroke="#818b91" stroke-width="4"><ellipse cx="610" cy="180" rx="110" ry="42"/><rect x="500" y="180" width="220" height="180"/><ellipse cx="610" cy="360" rx="110" ry="42"/><ellipse cx="900" cy="220" rx="95" ry="40"/><rect x="805" y="220" width="190" height="135"/><ellipse cx="900" cy="355" rx="95" ry="40"/></g><g stroke="#ed4f2b" stroke-width="8">${[220,265,310].map(y=>`<path d="M525 ${y}Q610 ${y+25} 695 ${y}"/>`).join('')}</g><g stroke="#9fe9ff" stroke-width="5"><path d="M610 138V75H900V180M900 180V110H1040" fill="none"/></g>`;
if(n===2)s+=`<path d="M0 0Q130 80 150 260T110 653H1090Q1050 420 1080 260T1200 0Z" fill="#1c2226"/><ellipse cx="590" cy="390" rx="420" ry="260" fill="url(#g)"/><ellipse cx="590" cy="270" rx="290" ry="90" fill="#541b15" stroke="#7b858b" stroke-width="7"/><ellipse cx="590" cy="300" rx="250" ry="82" fill="#ff6d1b"/><ellipse cx="590" cy="295" rx="210" ry="55" fill="#ffd35b" opacity=".7"/><path d="M300 240Q590 110 880 240M290 295Q590 155 890 295M310 355Q590 200 870 355" fill="none" stroke="#5b9cad" stroke-width="13"/><rect x="910" y="140" width="190" height="260" fill="#20272c" stroke="#717b82" stroke-width="5"/><rect x="940" y="170" width="130" height="190" fill="#0c1930"/><path d="M960 335Q1005 220 1050 335Q1005 280 960 335Z" fill="#69c9ff" opacity=".8"/>`;
if(n===3)s+=`<g transform="translate(600 330) rotate(-13)"><circle r="275" fill="#11171b" stroke="#707a81" stroke-width="12"/><circle r="225" fill="none" stroke="#30383d" stroke-width="58"/><circle r="115" fill="#22292e" stroke="#899298" stroke-width="9"/>${Array.from({length:12},(_,i)=>{let a=i*Math.PI/6,x=Math.cos(a)*205,y=Math.sin(a)*205;return `<rect x="${x-46}" y="${y-19}" width="92" height="38" fill="#41494e" stroke="#9ea5aa" transform="rotate(${i*30} ${x} ${y})"/>`}).join('')}</g><g stroke="#ff6d23" stroke-width="3"><path d="M730 180L1030 95M740 205L1040 120M730 455L1030 540"/></g><g fill="#ff9c32"><circle cx="850" cy="150" r="5"/><circle cx="930" cy="130" r="4"/><circle cx="980" cy="110" r="3"/></g>`;
if(n===4)s+=`<path d="M80 90H1120V560H80Z" fill="#11171b" stroke="#465058" stroke-width="6"/><path d="M120 125H1080V530H120Z" fill="#07090b"/>${[0,1,2,3,4,5,6,7,8].map(i=>{let x=180+i*105,c=i<2?'#ff741e':i<4?'#c93729':i<6?'#701d25':i<8?'#32131b':'#09090a';return `<rect x="${x}" y="286" width="70" height="88" rx="4" fill="${c}" stroke="#68727a" stroke-width="3"/>`}).join('')}<path d="M120 205H1080M120 455H1080" stroke="#465058" stroke-width="9"/>${[250,390,530,670,810,950].map(x=>`<circle cx="${x}" cy="205" r="24" fill="#e4ebed" stroke="#58636a" stroke-width="3"/>`).join('')}`;
if(n===5){let hs='';for(let row=0;row<9;row++)for(let col=0;col<10;col++){let x=150+col*95+(row%2)*47,y=135+row*48;let p=[];for(let i=0;i<6;i++){let a=Math.PI/6+i*Math.PI/3;p.push(`${x+Math.cos(a)*42},${y+Math.sin(a)*42}`)}hs+=`<polygon points="${p.join(' ')}" fill="#1c2428" stroke="#69747b" stroke-width="2"/>`}s+=`<rect x="50" y="85" width="1100" height="495" fill="#10161a" stroke="#465058" stroke-width="7"/>${hs}<path d="M115 100H1085M115 575H1085" stroke="#8a959b" stroke-width="5"/><path d="M160 78V590M1040 78V590" stroke="#59656d" stroke-width="7"/><path d="M100 245H1100M100 390H1100" stroke="#70dfff" stroke-width="2" opacity=".45"/>`}
return '<svg id="scene" class="scene" viewBox="0 0 1200 653">'+s+label+'<text x="40" y="625" fill="#7c8790" font-size="11" font-family="monospace">PHOBOS / AUTONOMOUS INDUSTRIAL SECTION</text></svg>'};
let i=0;const el=id=>document.getElementById(id);function render(){let d=D[i];el('title').textContent=d[0];el('desc').textContent=d[1];el('cap').textContent=d[2];el('det').textContent=d[3];el('scene').outerHTML=scene(i);el('spec').innerHTML=d[4].map((x,j)=>`<div class="row"><span>${['TEMP','GRAVITY','SYSTEM','STATE'][j]}</span><b>${x}</b></div>`).join('');el('metrics').innerHTML=d[5].map((m,j)=>`<div class="metric"><div class="mh">${m[0]}</div><div class="val">${m[1]}<span class="unit">${m[2]}</span></div><div class="bar" style="--w:${[74,95,88,61][j]}%"><i></i></div></div>`).join('');el('flow').innerHTML=d[6].map((x,j)=>`<span class="node ${j===i%4?'on':''}">${x}</span>${j<d[6].length-1?'<span class="arrow">→</span>':''}`).join('');document.querySelectorAll('.level').forEach((b,j)=>b.classList.toggle('active',j===i));}
el('levels').innerHTML=D.map((d,j)=>`<button class="level" data-level="${j}"><div class="num">0${j+1}</div><div class="lname">${d[0]}</div><div class="small">${['INTAKE','SEPARATION','MELT','CASTING','ANNEALING','STORAGE'][j]}</div></button>`).join('');el('levels').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(b){i=Number(b.dataset.level);render();}});render();
</script></body></html>
