<style>
/* Layout: full-bleed WebGL stage with a HUD on top: title + layers at the top, guided tour panel at the bottom-left. */
:root{
  --ink:#070a10;
  --panel:rgba(9,13,21,.78);
  --line:rgba(150,185,220,.2);
  --fg:#e6edf5;
  --body:#c9d4e2;
  --muted:#8b9bb0;
  --ice:#5cc8ff;
  --gov:#ffb454;
  --com:#5ff0b5;
  --bak:#b3a1ff;
  --sun:#ffd36a;
  --cargo:#dfe8f2;
  --tower:#ffe3b0;
  --f-display:'Unbounded',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:500 11px/1 var(--f-mono);padding:4px 7px;background:rgba(7,10,16,.8);border:1px solid var(--c);color:var(--fg);border-radius:3px;display:none}
.tag i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px}
.tag small{color:var(--muted);margin-left:6px;font-size:10px}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;position:relative;min-height:36px}
.top>*{pointer-events:auto}
.brand h1{margin:0;font:700 15px/1.2 var(--f-display);letter-spacing:.06em;text-wrap:balance}
.brand p{margin:6px 0 0;font:400 11px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.layers{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:min(250px,62vw);flex:none;position:absolute;right:0;top:0;z-index:6}
.layers summary{list-style:none;cursor:pointer;padding:10px 12px;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--body)}
.layers summary::-webkit-details-marker{display:none}
.layers summary:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.lbody{padding:2px 12px 12px;display:grid;gap:4px;max-height:min(72vh,600px);overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:2px}
.seg button{background:none;border:0;color:var(--muted);font:500 12px var(--f-mono);padding:8px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(92,200,255,.16);color:var(--ice)}
#target{width:100%;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 6px;font:400 12px var(--f-body)}
.act{width:100%;border:1px solid var(--line);background:none;color:var(--fg);padding:8px;font:500 12px var(--f-mono);border-radius:4px;cursor:pointer;margin-top:2px}
.act:hover{border-color:var(--ice)}
.act[aria-pressed="true"]{border-color:var(--ice);color:var(--ice)}
.bottom{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.bottom>*{pointer-events:auto}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tmin{border:1px solid var(--line);background:none;color:var(--body);font:500 11px var(--f-mono);padding:6px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tmin:hover{border-color:var(--ice)}
.tbody{display:grid;gap:8px}
.tour.min{padding:8px 10px;max-height:none}
.tour.min .tbody{display:none}
.hud{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px;width:min(310px,100%);display:grid;gap:8px;flex:none}
.hrow{display:flex;gap:14px;align-items:center}
#ball{width:116px;height:116px;border-radius:50%;flex:none;cursor:grab;touch-action:none;box-shadow:0 0 0 1px var(--line)}
.read{margin:0;display:grid;gap:5px;min-width:0}
.read div{display:grid;gap:1px}
.read dt{font:400 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.read dd{margin:0;font:400 11px/1.2 var(--f-mono);color:var(--muted)}
.read b{font:500 14px/1.2 var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.pos{font:400 10.5px/1.3 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.note2{font:500 11px/1.3 var(--f-mono);color:var(--ice);min-height:14px}
.note2.warn{color:var(--gov)}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hbtns button{border:1px solid var(--line);background:none;color:var(--fg);padding:9px 8px;font:500 12px var(--f-mono);border-radius:4px;cursor:pointer}
.hbtns button:hover{border-color:var(--ice)}
.hbtns .lockb{grid-column:1/-1}

.hbtns .go[aria-pressed="true"]{background:rgba(95,240,181,.16)}
.hbtns button[aria-pressed="true"]:not(.go){border-color:var(--ice);color:var(--ice)}
.keys{font:400 10px/1.5 var(--f-mono);color:var(--muted)}
.layer,.toggle{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--fg);padding:6px 0;text-align:left;font:400 13px/1.2 var(--f-body);cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.layer[aria-pressed="false"]{color:var(--muted)}
.layer[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.sep{height:1px;background:var(--line);margin:6px 0}
.rng{display:grid;gap:6px;font:400 11px/1.3 var(--f-mono);color:var(--muted)}
.rng input{width:100%;accent-color:var(--ice)}
.toggle{font:400 12px/1.2 var(--f-mono);color:var(--body)}
.toggle .sw{width:22px;height:12px;border-radius:7px;background:rgba(150,185,220,.2);position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.toggle[aria-pressed="true"] .sw{background:rgba(92,200,255,.35)}
.toggle[aria-pressed="true"] .sw::after{left:12px;background:var(--ice)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font:400 10.5px/1.3 var(--f-mono);color:var(--muted);margin-top:2px}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;background:var(--c);margin-right:5px;vertical-align:middle}
.tour{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 16px 12px;width:min(470px,100%);max-height:52vh;overflow:auto;display:grid;gap:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{width:28px;height:28px;border-radius:4px;border:1px solid var(--line);background:none;color:var(--muted);font:500 12px var(--f-mono);cursor:pointer;padding:0}
.steps button[aria-current="step"]{border-color:var(--ice);color:var(--ice);background:rgba(92,200,255,.12)}
.kicker{font:500 10.5px/1.3 var(--f-mono);color:var(--ice);letter-spacing:.12em;text-transform:uppercase}
.tour h2{margin:0;font:700 17px/1.25 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.tour p{margin:0;font-size:13.5px;line-height:1.55;color:var(--body);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:400 11px/1.2 var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:4px 7px;color:var(--body)}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line);background:none;color:var(--fg);padding:8px 12px;font:500 12px var(--f-mono);border-radius:4px;cursor:pointer}
.nav button:hover{border-color:var(--ice)}
.nav button:disabled{opacity:.35;cursor:default}
.note{margin-left:auto;font:400 10px/1.3 var(--f-mono);color:var(--muted);text-align:right;max-width:20ch}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--body)}
@media (max-width:640px){
  .bottom{flex-direction:column;align-items:stretch;gap:8px}
  .keys{display:none}
  #ball{width:96px;height:96px}
  .brand h1{font-size:13px}
  .tour{padding:10px 12px 8px;max-height:34vh}
  .tour{width:100%}
  .tour h2{font-size:15px}
  .tour p{font-size:13px}
  .note{display:none}
  .layers{width:min(230px,64vw)}
}
.layers:not([open]){width:auto}
.clock{font:400 11px/1.4 var(--f-mono);color:var(--muted)}
#tspd{width:100%;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 6px;font:400 12px var(--f-body)}
.ecl{display:none;font:500 10px/1.3 var(--f-mono);color:#05070b;background:var(--gov);border-radius:3px;padding:2px 6px;white-space:nowrap}
.tline{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 600px));background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 12px 6px;z-index:2;pointer-events:none}
.tl-btn{pointer-events:auto;background:none;border:1px solid var(--line);color:var(--fg);font:500 10px/1 var(--f-mono);padding:5px 8px;border-radius:4px;cursor:pointer;white-space:nowrap;letter-spacing:.04em}
.tl-btn:hover{border-color:var(--ice)}.tl-btn[aria-pressed="true"]{border-color:var(--gov);color:var(--gov)}
.kb{font:400 9.5px/1 var(--f-mono);border:1px solid currentColor;border-radius:3px;padding:1px 4px;opacity:.65;margin-left:5px;letter-spacing:0}
.tl-h{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--body)}
.tl-h b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.tl-bar{position:relative;height:10px;margin:8px 0 4px;border-radius:5px;background:linear-gradient(90deg,#1a2230,#3a4a63 25%,#c9a24a 50%,#3a4a63 75%,#1a2230);overflow:visible}
.tl-ecl{position:absolute;top:-2px;bottom:-2px;background:#05070b;border:1px solid var(--gov);border-radius:3px}
.tl-mark{position:absolute;top:-5px;width:2px;height:20px;background:var(--ice);box-shadow:0 0 6px var(--ice);border-radius:1px}
.tl-t{position:relative;height:12px;font:400 9.5px/1 var(--f-mono);color:var(--muted)}
.tl-t span{position:absolute;transform:translateX(-50%);white-space:nowrap}

.eh{position:absolute;left:0;top:0;pointer-events:none;z-index:1;display:none}

.eh .ehr{display:none;position:absolute;left:-17px;top:-17px;width:34px;height:34px;border:1.5px solid #6fb7ff;border-radius:50%;box-shadow:0 0 8px rgba(111,183,255,.6)}
.eh.on .eha{display:none}.eh.on .ehr{display:block}
.ehl{position:absolute;left:0;top:22px;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 var(--f-mono);color:#6fb7ff;background:rgba(7,10,16,.75);padding:3px 6px;border-radius:3px}
@media (hover:none){.kb{display:none}}
