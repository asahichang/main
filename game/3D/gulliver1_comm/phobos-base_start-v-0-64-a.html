  --line:rgba(150,185,220,.2);
  --fg:#e6edf5;
  --body:#c9d4e2;
  --muted:#8b9bb0;
  --ice:#5cc8ff;
  --gov:#ffb454;
  --com:#5ff0b5;
  --bak:#b3a1ff;
  --sun:#ffd36a;
  --cargo:#dfe8f2;
  --tower:#ffe3b0;
  --f-display:'Unbounded',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:500 11px/1 var(--f-mono);padding:4px 7px;background:rgba(7,10,16,.8);border:1px solid var(--c);color:var(--fg);border-radius:3px;display:none}
.tag i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px}
.tag small{color:var(--muted);margin-left:6px;font-size:10px}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;position:relative;min-height:36px}
.top>*{pointer-events:auto}
.brand h1{margin:0;font:700 15px/1.2 var(--f-display);letter-spacing:.06em;text-wrap:balance}
.brand p{margin:6px 0 0;font:400 11px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.layers{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:min(250px,62vw);flex:none;position:absolute;right:0;top:0;z-index:6}
.layers summary{list-style:none;cursor:pointer;padding:10px 12px;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--body)}
.layers summary::-webkit-details-marker{display:none}
.layers summary:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.lbody{padding:2px 12px 12px;display:grid;gap:4px;max-height:min(72vh,600px);overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:2px}
.seg button{background:none;border:0;color:var(--muted);font:500 12px var(--f-mono);padding:8px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(92,200,255,.16);color:var(--ice)}
#target{width:100%;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 6px;font:400 12px var(--f-body)}
.act{width:100%;border:1px solid var(--line);background:none;color:var(--fg);padding:8px;font:500 12px var(--f-mono);border-radius:4px;cursor:pointer;margin-top:2px}
.act:hover{border-color:var(--ice)}
.act[aria-pressed="true"]{border-color:var(--ice);color:var(--ice)}
.bottom{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.bottom>*{pointer-events:auto}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tmin{border:1px solid var(--line);background:none;color:var(--body);font:500 11px var(--f-mono);padding:6px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tmin:hover{border-color:var(--ice)}
.tbody{display:grid;gap:8px}
.tour.min{padding:8px 10px;max-height:none}
.tour.min .tbody{display:none}
.hud{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px;width:min(310px,100%);display:grid;gap:8px;flex:none}
.hrow{display:flex;gap:14px;align-items:center}
#ball{width:116px;height:116px;border-radius:50%;flex:none;cursor:grab;touch-action:none;box-shadow:0 0 0 1px var(--line)}
.read{margin:0;display:grid;gap:5px;min-width:0}
.read div{display:grid;gap:1px}
.read dt{font:400 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.read dd{margin:0;font:400 11px/1.2 var(--f-mono);color:var(--muted)}
.read b{font:500 14px/1.2 var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.pos{font:400 10.5px/1.3 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.note2{font:500 11px/1.3 var(--f-mono);color:var(--ice);min-height:14px}
.note2.warn{color:var(--gov)}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hbtns button{border:1px solid var(--line);background:none;color:var(--fg);padding:6px 4px;font:500 11px var(--f-mono);border-radius:4px;cursor:pointer}
.hbtns:not(.h3):not(.hb3){grid-template-columns:1.2fr .6fr .6fr 1.2fr;gap:4px}
.hud .hbtns.hb3{display:flex;gap:4px;align-items:stretch}.hud .hbtns.hb3 button{flex:1 1 auto;white-space:nowrap}.hud .hbtns.hb3 .hq{flex:0 0 26px;width:26px;height:auto;padding:0}.hud .hbtns.hb3 .hq svg{width:14px;height:14px}
.hbtns button:hover{border-color:var(--ice)}
.hbtns .lockb{grid-column:1/-1}
.hbtns .go{grid-column:auto;border-color:var(--com);color:var(--com);font-size:12px;padding:6px}
.hbtns .go[aria-pressed="true"]{background:rgba(95,240,181,.16)}
.hbtns button[aria-pressed="true"]:not(.go){border-color:var(--ice);color:var(--ice)}
.keys{font:400 10px/1.5 var(--f-mono);color:var(--muted)}
.layer,.toggle{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--fg);padding:6px 0;text-align:left;font:400 13px/1.2 var(--f-body);cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.layer[aria-pressed="false"]{color:var(--muted)}
.layer[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.sep{height:1px;background:var(--line);margin:6px 0}
.rng{display:grid;gap:6px;font:400 11px/1.3 var(--f-mono);color:var(--muted)}
.rng input{width:100%;accent-color:var(--ice)}
.toggle{font:400 12px/1.2 var(--f-mono);color:var(--body)}
.toggle .sw{width:22px;height:12px;border-radius:7px;background:rgba(150,185,220,.2);position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.toggle[aria-pressed="true"] .sw{background:rgba(92,200,255,.35)}
.toggle[aria-pressed="true"] .sw::after{left:12px;background:var(--ice)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font:400 10.5px/1.3 var(--f-mono);color:var(--muted);margin-top:2px}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;background:var(--c);margin-right:5px;vertical-align:middle}
.tour{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 16px 12px;width:min(470px,100%);max-height:52vh;overflow:auto;display:grid;gap:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{width:28px;height:28px;border-radius:4px;border:1px solid var(--line);background:none;color:var(--muted);font:500 12px var(--f-mono);cursor:pointer;padding:0}
.steps button[aria-current="step"]{border-color:var(--ice);color:var(--ice);background:rgba(92,200,255,.12)}
.kicker{font:500 10.5px/1.3 var(--f-mono);color:var(--ice);letter-spacing:.12em;text-transform:uppercase}
.tour h2{margin:0;font:700 17px/1.25 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.tour p{margin:0;font-size:13.5px;line-height:1.55;color:var(--body);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:400 11px/1.2 var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:4px 7px;color:var(--body)}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line);background:none;color:var(--fg);padding:8px 12px;font:500 12px var(--f-mono);border-radius:4px;cursor:pointer}
.nav button:hover{border-color:var(--ice)}
.nav button:disabled{opacity:.35;cursor:default}
.note{margin-left:auto;font:400 10px/1.3 var(--f-mono);color:var(--muted);text-align:right;max-width:20ch}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--body)}
@media (max-width:640px){
  .bottom{flex-direction:column;align-items:stretch;gap:8px}
  .keys{display:none}
  #ball{width:96px;height:96px}
  .brand h1{font-size:13px}
  .tour{padding:10px 12px 8px;max-height:34vh}
  .tour{width:100%}
  .tour h2{font-size:15px}
  .tour p{font-size:13px}
  .note{display:none}
  .layers{width:min(230px,64vw)}
}
.layers:not([open]){width:auto}
.clock{font:400 11px/1.4 var(--f-mono);color:var(--muted)}
#tspd{width:100%;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 6px;font:400 12px var(--f-body)}
.ecl{display:none;font:500 10px/1.3 var(--f-mono);color:#05070b;background:var(--gov);border-radius:3px;padding:2px 6px;white-space:nowrap}
.tline{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 600px));background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 12px 6px;z-index:2;pointer-events:none}
.tl-btn{pointer-events:auto;background:none;border:1px solid var(--line);color:var(--fg);font:500 10px/1 var(--f-mono);padding:5px 8px;border-radius:4px;cursor:pointer;white-space:nowrap;letter-spacing:.04em}
.tl-btn:hover{border-color:var(--ice)}.tl-btn[aria-pressed="true"]{border-color:var(--gov);color:var(--gov)}
.kb{font:400 9.5px/1 var(--f-mono);border:1px solid currentColor;border-radius:3px;padding:1px 4px;opacity:.65;margin-left:5px;letter-spacing:0}
.tl-h{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--body)}
.tl-h b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.tl-bar{position:relative;height:10px;margin:8px 0 4px;border-radius:5px;background:linear-gradient(90deg,#1a2230,#3a4a63 25%,#c9a24a 50%,#3a4a63 75%,#1a2230);overflow:visible}
.tl-ecl{position:absolute;top:-2px;bottom:-2px;background:#05070b;border:1px solid var(--gov);border-radius:3px}
.tl-mark{position:absolute;top:-5px;width:2px;height:20px;background:var(--ice);box-shadow:0 0 6px var(--ice);border-radius:1px}
.tl-t{position:relative;height:12px;font:400 9.5px/1 var(--f-mono);color:var(--muted)}
.tl-t span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-t span:first-child{transform:none}.tl-t span:last-child{transform:translateX(-100%)}
.eh{position:absolute;left:0;top:0;pointer-events:none;z-index:1;display:none}
.eh .eha{position:absolute;left:-19px;top:-19px;width:38px;height:38px;color:#6fb7ff;filter:drop-shadow(0 0 5px rgba(111,183,255,.7))}
.eh .ehr{display:none;position:absolute;left:-17px;top:-17px;width:34px;height:34px;border:1.5px solid #6fb7ff;border-radius:50%;box-shadow:0 0 8px rgba(111,183,255,.6)}
.eh.on .eha{display:none}.eh.on .ehr{display:block}
.ehl{position:absolute;left:0;top:22px;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 var(--f-mono);color:#6fb7ff;background:rgba(7,10,16,.75);padding:3px 6px;border-radius:3px}
@media (hover:none){.kb{display:none}}
@media (max-width:900px){.tline{top:50px;left:16px;right:16px;width:auto;transform:none}}

.dring{position:absolute;display:none;border:1.5px solid var(--ice);border-radius:9px;box-shadow:0 0 0 1px rgba(92,200,255,.22),0 0 24px rgba(92,200,255,.45);animation:dpulse 1.8s ease-in-out infinite;pointer-events:none}
.dring::before,.dring::after{content:"";position:absolute;width:9px;height:9px;border:2px solid #dff4ff;border-radius:2px}

   LZ.request(key,'astro'|'fly',cb) starts the build once (tasks run one after another): spinner (astronaut mode: top-left corner, flight mode: next to the page title),
   at least 1 s on screen; cb runs when the task is done (at once if it already is). Keys: tunnels, baseA, baseB (small base elements), towers, cryo (layers).
   slow:false — задача не замораживает время сцены (см. LZ.freeze()); LZ.label(key,text) — живая подпись во время сборки (v62: id кратеров). */

  renderer.setSize(W,H,false);camera.aspect=W/H;camera.fov=camera.aspect<1?62:42;camera.updateProjectionMatrix();

var last=performance.now();
function frame(now){
  /* v63: следующий кадр планируется ДО работы. Раньше вызов requestAnimationFrame(frame) стоял в конце:
     любая ошибка в кадре (например, в boostJump) обрывала цикл и приложение замирало насмерть. */
  requestAnimationFrame(frame);
  var frT0=performance.now();
  var dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  Tm.value+=dt;simDt=(sim.on&&!reduce)?dt*sim.scale:0;sim.t+=simDt;
  var wasTw=!!tw;stepTween(dt);
  if(mode==='fly'&&wasTw)camera.lookAt(controls.target);
  var pdt=(sim.on&&!reduce)?dt:0;
  if(!reduce){updateCars(pdt);updateTowers();pulsers.forEach(function(p){p.update(dt);});}
  updateBackup(reduce?0:dt);
  if(L.cryo.visible!==layerVis.cryo)L.cryo.visible=layerVis.cryo;
  stationUpdate(0,pdt);
  skyUpdate();
  if(astro.picking)astro.pickTick(dt);
  /* v63: ошибка в логике скафандра больше не роняет кадр целиком: пишем один раз в консоль и продолжаем */
  if(astro.on){try{astro.update(dt);}catch(e){if(!window.__asErr){window.__asErr=e;console.error(e);}}}
  if(GUIDE&&GUIDE.camActive()){try{GUIDE.camTick(dt);}catch(e){if(!window.__gcErr){window.__gcErr=e;console.error(e);}}}
  else if(!astro.on){
    if(mode==='fly'){
      if(tw){}else if(circ){circUpdate(dt);camera.lookAt(controls.target);}else if(spin){spinUpdate(dt);}else flyUpdate(dt);
    }else{circUpdate(dt);controls.update();}
  }
  updateHud(dt);
  if(astro.laserTick){try{astro.laserTick();}catch(e){if(!window.__ltErr){window.__ltErr=e;console.error(e);}}}
  renderer.render(scene,camera);
  /* v63: указатель «К Земле» / подписи не должны ронять кадр: ошибка пишется один раз и кадр живёт дальше */
  try{updateLabels();updateExtra();}catch(e){if(!window.__exErr){window.__exErr=e;console.error(e);}}
  if(GUIDE){try{GUIDE.uiTick(dt);}catch(e){if(!window.__guErr){window.__guErr=e;console.error(e);}}}
  /* v63: сторож кадра — если кадр занял больше 0,8 с, пишем в консоль (не чаще раза в 3 с), чтобы было видно,
     что именно подвешивает: расчёт, сборку, запекание или отрисовку */
  var fms=performance.now()-frT0;
  if(fms>800&&performance.now()-(window.__frWarn||0)>3000){window.__frWarn=performance.now();console.warn('[phobos] долгий кадр: '+Math.round(fms)+' мс');}
}

  document.querySelectorAll('.trow details').forEach(function(d){d.addEventListener('toggle',function(){place(d);});});

 {v:'v64',d:'07.11.2026',add:['Режим «Без интерфейса»: скрывает кнопки и меню, оставляя название приложения и настройки.','«Введение»: космическая презентация из четырёх слайдов — Фобос и Марс, космический лифт, связь, поверхность и базы. Запускается при загрузке.','«Демо»: семь шагов по интерфейсу с подсветкой кнопок — полёт, объекты, посадка, база, сутки, слои, настройки.','Оба режима запускаются из настроек; после введения автоматически включается демо.'],fix:['Трос у Марса заканчивается в 4 км над поверхностью — раньше он заходил внутрь планеты.']},
 {v:'v63',d:'07.11.2026',add:['Реактивный подскок: когда маршрут не строится или космонавт застревает в яме, ненадолго включаются двигатели ранца, он поднимается над грунтом и перелетает в доступную точку (вперёд к цели, иначе веером вокруг), после чего идёт дальше.','Подскоки по возрастающей: 1-я попытка — 12–20 м и подъём ~0,45 м/с, 2-я — 20–30 м и ~0,8 м/с, 3-я — 30–44 м и ~1,15 м/с; перед перелётом скафандр ~1 с набирает высоту двигателями. Всего 3 попытки на цель, после третьей космонавт останавливается с сообщением «Пройти не удается».','Цель без маршрута больше не отменяется: если планировщик не нашёл путь, цель всё равно принимается — скафандр идёт напрямую и на препятствии включает подскок (раньше был отказ «пути к этой точке нет»).','На базе малые кратеры не загружаются: на площадке, крыше, в галереях и залах ленивый патч не строится, а готовый убирается.'],fix:['Указатель «К Земле» и подписи больше не могут уронить кадр: updateExtra/updateLabels обёрнуты в try/catch (ошибка пишется в консоль один раз). Добавлен сторож кадра: если кадр занял больше 0,8 с, в консоль пишется «долгий кадр: N мс» (не чаще раза в 3 с).','Карта высот базы теперь запекается сразу при высадке (во время фазы «приближение»), а не в середине прогулки; на базе это была самая тяжёлая синхронная операция.','Расчёт маршрута ограничен 0,35 с (было 1,6 с): не успели — скафандр идёт прямо и включает подскок.','Зависание в прыжке: в ветке реактивного полёта осталась ссылка на переменную hAbove, которую я убрал при переделке вертикальной тяги — каждый кадр полёта над грунтом бросала ReferenceError, и космонавт замирал в воздухе (кнопки не помогали). Ссылка убрана, высота считается заново.','«Остановись» не прерывала подскок: кнопка очищала цель, а ранец продолжал лететь к старой площадке. Теперь «Остановись» сбрасывает подскок, и скафандр садится.','Подскок мог выбрать площадку за стеной или куполом: добавлена проверка прямой линии по блокерам (7 точек) — в стену больше не прыгает.','Подскок «не долетал»: если за 8 с сцены он не приблизился к площадке на 1,5 м, цель подскока сбрасывается и он садится на ближайшую доступную точку, а не висит.','Перелёт в подскоке вдвое быстрее (2,2 м/с вместо 0,9) и выше: подъём 1,0 / 1,6 / 2,2 м/с за 1,6 / 2,1 / 2,6 с — примерно 1,6 / 3,4 / 5,7 м над грунтом.','Зависание «намертво» и «не взлетает»: в boostJump стояло A.landN.copy(...), а поле landN не было создано в состоянии (только landing) — TypeError вылетал из astro.update, а requestAnimationFrame(frame) стоял в конце кадра, поэтому цикл кадров останавливался и приложение замирало. Теперь landN инициализирован, копирование защищено, следующий кадр планируется до работы, а ошибка в логике скафандра ловится try/catch (пишется в консоль один раз, приложение работает дальше).','Подскок не срабатывал на склонах: проверка площадки отбраковывала любую точку, если в 12 м от неё грунт ниже на 1,2 м (на склоне 50° это всегда), поэтому космонавт «не взлетал», а просто останавливался. Для подскока проверка обрыва отключена — допускается приземление на склоне до 57°.','Подскок не мог забраться на площадку базы: первая рассматриваемая площадка — сама цель, а вертикальная тяга в реактивном полёте считается по знаку превышения (раньше контроллер всегда тянул вниз, и цель выше космонавта была недостижима).','Зависания при обычной ходьбе: убраны повторные перепланирования «на ходу» (каждое до 1,6 с), обычная цель теперь считается через проверку прямой видимости за единицы миллисекунд (A* включается только если прямо пройти нельзя), план ограничен 0,9 с и не повторяется чаще раза в 0,5 с после тяжёлого расчёта.','Патч малых кратеров больше не перестраивается на бегу: на ×20/×50 космонавт идёт 6–16 м/с, и сборка с загрузкой 6,5 МБ в GPU стоила кадров; перестройка откладывается до снижения скорости.','Порог «застревания» теперь пропорционален окну (22 % времени + 1,2 м): постоянные 2,5 м давали ложные срабатывания на обычной ходьбе.','В консоль (F12) пишется предупреждение, если расчёт маршрута, сборка патча или запекание карты высот заняли больше 0,4/0,7/0,15 с — по нему видно, что именно подвешивает приложение.','Ноги: таз был выше предела досягаемости ноги, поэтому колено выпрямлялось в упор (8°) и стопа висела над грунтом. Высота таза приведена к длине ноги (шаг 0,968→0,940, стойка 0,955→0,930), колено держит 22–25° и стопа достаёт поверхность.','Переносимая нога поднималась на 10–19 см с коленом 60° — шаг выглядел «строевым» («кривые ноги»). Теперь подъём 2,5–5 см, колено ~33°.','Ботинок больше не заваливается вместе с ногой на склоне: угол бедра по крену компенсируется в стопе.','Задняя нога в полёте меньше вытянута (0,84/-0,30 → 0,82/-0,24), колено не уходит в предел.']},
 {v:'v62',d:'07.11.2026',add:['Малые кратеры при посадке больше не исчезают: контур (тёмная чаша и светлый вал) остаётся и внутри ленивого патча — он ложится поверх настоящего рельефа, тени и свет работают как в обычном режиме.','Ленивая загрузка показывает номера (id) малых кратеров, которые строятся: «Загружаю малые кратеры · id К5-312, К18-315, … (N шт.) · 45 %». Префикс — слой (К5 — ячейка 1/5 км, К18 — 1/18 км), номер продолжает список крупных кратеров и не меняется при повторной загрузке того же места.','Список загруженных малых кратеров (id, слой, ячейка, широта/долгота) доступен для отладки: window.__phobos.smallCraters и __astro.dbg.smallCraters.'],fix:['Скафандр уходил в сторону от цели вместо прямой: highPoint() принудительно переносил любую точку с |x|>11,4 на ось базы, поэтому вся сетка A* у полюсов смещалась на ~100 м, а маршрут шёл параллельно цели. Теперь перенос включается только для точек над площадкой базы (выше платформы и внутри квадрата карты высот).','Зависания при посадке и ходьбе: загрузка малых кратеров больше не замедляет время сцены в 1000 раз (так делают только тяжёлые задачи баз), шаг сборки ограничен ~12 мс на кадр, а сглаживание маршрута ограничено общим бюджетом времени.','Зона без малых кратеров у баз сужена до диска базы (1,0–1,3 км вместо 1,6–2,4 км): у самой базы настоящий рельеф кратеров теперь такой же глубины, как рисунок шейдера в полёте, — у места посадки сугробы стали глубже и ближе к картинке из полёта.','Цель для прогулки больше не «не ставится» на склонах: предел уклона поднят с 46° до 57° (standable и slopeBad). Раньше на валах кратеров и на склонах круче 46° стрелка становилась прозрачной примерно в трети видимых мест, а маршрут туда не строился; теперь такие места доступны (на Фобосе g≈0,55 см/с², 57° — нормальный склон).','Космонавт «буксовал» и уходил в сторону на крутом склоне: точка маршрута считалась достигнутой по проекции на плоскость, а на склоне 50° эта проекция короче в cos(50°), поэтому маршрут проскакивал 2–3 точки сразу и космонавт срезал поворот в вал кратера. Теперь достижение считается по расстоянию в пространстве.','Приложение зависало на крутых склонах: «сторож застревания» считал окно по времени сцены, и на ×50 проверка шла каждые 0,3 с, а каждый переплан — до 1,6 с (цикл «план → заморозка → план»). Теперь окно считается и в реальном времени (8 с сцены и 3 с реальных), переплан один и с бюджетом 0,7 с, во время ленивой загрузки не запускается, попыток три вместо двух.','Над крутым кратером ранец уносил космонавта в сторону: автопосадка искала ровное место (≤17°) в радиусе до 300 м. Теперь посадка рядом (до 30 м) и допускает склон до 57°.']},
 {v:'v61',d:'07.11.2026',add:['Настройки → «Скафандр»: «Простой» (как раньше) или «Продвинутый» — корпус и шлем покачиваются в такт шагу, таз наклоняется, ранец пружинит при прыжках, на грунте остаются следы ботинок. Выбор запоминается.','Малые кратеры (слои с ячейкой 1/5 км и 1/18 км), которые раньше были просто кругами без глубины, теперь настоящий рельеф: квадрат 600×600 м вокруг космонавта подгружается лениво, с колесом загрузки «Загружаю малые кратеры». Глубина у всех одинаковая (≈2 м, вал ≈0,5 м). Ноги, лазер, пыль, выбор цели и построение маршрута видят тот же рельеф. Крупные и именованные кратеры не тронуты, у баз малых кратеров нет.'],fix:['Космопорт на Гулливере-1 пропадал при взгляде с высоты: сдвиг глубины крыши перекрывал платформу и стоянку. Сдвиг убран.','Стрелка компаса привязана к центру циферблата (раньше была косой).','Цель за висячей галереей: если луч попадает в галерею, цель ставится на грунт под ней.','Лазер в режиме полёта, наведённый на небоскрёб базы, больше не пишет «невозможно рассчитать»: для загруженных баз строится карта высот стен.']},
 {v:'v60',d:'06.11.2026',add:['Панель навигации компактнее: кнопка «Пуск» уже, «Отдал.» превращается в «Стоп», пока включена; вместо одной кнопки «Фобос» три: Фобос, Гулливер-1, Терминал; кнопки «Информация» и «Сообщить об ошибке» перенесены туда же.','Лазер называет цели точнее: башенный кран, контейнеры, стройматериалы, трубы, посадочная площадка, ракета, корабль, ангар, солнечная ферма, груда реголита, антенна-тарелка, гравитационная праща, обломки груза, столб, строящийся жилой модуль; рядом показывается область (Таможня, Пром сектор и т.д.) вместо общего «цистерна».','На карте базы добавлены крупные объекты: строящийся жилой модуль, краны, груды реголита, антенны, ангары, солнечные фермы, пращи, площадки, место аварии.'],fix:['Цель для прогулки можно ставить на землю под и за висячей галереей (луч указки выбора проходит сквозь крышу галереи).','Карта высот базы больше не запекается до окончания загрузки базы: раньше ангары и другие здания Терминала были невидимы для лазера и столкновений (если база загружалась по переходу к координате).','Компас: диск неподвижен (С сверху), стрелка показывает, куда смотрит скафандр; на мобильном меньше; показывается только в режиме космонавта.']},
 {v:'v59',d:'06.11.2026',add:[],fix:['Выбор цели в режиме космонавта зависал: подпись расстояния над точкой (v57) вызывала функцию из другого модуля, ошибка шла в каждом кадре. Исправлено.']},

 {v:'v57',d:'05.11.2026',add:['Компас в режиме скафандра: кнопка рядом с лазером показывает круглый компас с севером, югом, западом и востоком Фобоса.','Над точкой цели для прогулки показывается расстояние по прямой.','Номера версий в разделе версий выводятся как 0.57-alpha.'],fix:['Луч лазера выходил на 0,9 м выше шлема (точка отсчёта была тазом): теперь начинается из шлема.','Лазер считается не каждый кадр, а раз в ~130 мс и на дальность до 1,5 км: приложение не зависает.','Канатные дороги, подвесные кабины, стрелы кранов и карусель Терминала не создают невидимых стен по земле (опоры остались препятствиями).','Ноги скафандра при ходьбе меньше согнуты в коленях.','Подписи другой базы и подписи за горизонтом больше не залипают у верхнего края экрана.']},
 {v:'v56',d:'05.11.2026',add:['Лазер в режиме скафандра выходит из шлема; цистерны, баки, опоры и мачты получили свои подписи','Меню «Слои» и «Объекты» на телефоне прижаты к краям экрана','Соты крыши ночью и в затмение слабо подсвечены и не чернеют'],fix:['Рельеф Фобоса: шум на плоских волнах вместо решётчатого, плоские «плиты» и острые углы пропали; высота баз на полюсах прежняя','Невидимые стены на крыше базы: световые конусы прожекторов больше не попадают в карту высот','Купол 4, 14 и др.: выход к куполу не пересекает главный туннель и коридоры соседних залов (перегородка в туннеле и стена у входа)']},
 {v:'v55',d:'04.11.2026',add:['Лазер космонавта бьёт по взгляду космонавта (параллельно поверхности, с высоты шлема), подпись «до <объект> · расстояние»; учитываются грунт, строения, вышки, стены галерей и залов','Все вышки показаны жёлтыми точками на карте «Фобос · карта»','Отдельный артефакт «Каталог объектов, поверхностей, деталей»'],fix:['Сглажены борозды: острые угловые поверхности около ш 29,12° С д 39,92° В исчезли','Купол 14 и ещё четыре зала: дверь выхода к куполу больше не перекрывает дверь туннеля (дуги не пересекаются, нет прохода сквозь стены)','Луч лазера и точка не раздуваются при большой дальности']},

(function(){
  var b=document.getElementById('verBtn');if(!b)return;
  var box=document.createElement('div');box.className='vbox';box.id='vbox';
  var h='<div class="vin"><button class="vc" type="button" id="vclose">Закрыть</button>';
  VERS.forEach(function(x){h+='<h3>'+vfmt(x.v)+'</h3><div class="vd">'+x.d+(x===VERS[0]?' · текущая версия':'')+'</div>';
    if(x.add.length)h+='<b>Добавлено</b><ul>'+x.add.map(function(t){return'<li>'+t+'</li>';}).join('')+'</ul>';
    if(x.fix.length)h+='<b>Исправлено</b><ul>'+x.fix.map(function(t){return'<li>'+t+'</li>';}).join('')+'</ul>';});
  box.innerHTML=h+'</div>';document.body.appendChild(box);
  function close(){box.classList.remove('on');}
  b.addEventListener('click',function(){box.classList.add('on');});
  box.addEventListener('click',function(e){if(e.target===box)close();});
  document.getElementById('vclose').addEventListener('click',close);

})();
