<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Резонанс — карточная игра</title>
<style>
:root{--bg:#0b0d26;--panel:#141847;--panel2:#1b2060;--gold:#d9b45a;--ink:#eef0ff;--mut:#9fa6ff;--red:#ff6b5e;--green:#5fd18a;--yel:#f3bd3c;--grey:#8a8fb5}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 520px at 15% -10%,#2a3190aa,transparent),radial-gradient(900px 500px at 100% 0,#0f4a5a66,transparent),var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1180px;margin:0 auto;padding:10px 12px 28px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:2px;color:var(--gold)}
header .sp{flex:1}
.chip{background:var(--panel);border:1px solid #fff2;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut)}
.btn{background:var(--panel2);border:1px solid #fff3;border-radius:10px;padding:7px 12px;font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(#e6c46d,#c9a044);color:#14163f;font-weight:700;border:0}
.btn:disabled{opacity:.4;cursor:default}
#scores{display:flex;gap:8px;flex-wrap:wrap}
.pl-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid transparent;border-radius:12px;padding:6px 12px}
.pl-chip.act{border-color:var(--gold);box-shadow:0 0 16px #d9b45a55}
.pl-chip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.pl-chip b{font-size:18px;color:#fff;min-width:22px;text-align:right}
.pl-chip small{color:var(--mut)}
.board{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px}
.board>.box{min-width:0}
@media(max-width:820px){.board{grid-template-columns:minmax(0,1fr)}}
.box{background:linear-gradient(#12164a,#0d1038);border:1px solid #fff2;border-radius:14px;padding:10px}
.box h3{margin:0 0 6px;font-size:12px;letter-spacing:1.5px;color:var(--mut);font-weight:600;text-transform:uppercase}
#sysScroll{overflow-x:auto;padding:6px 2px 10px}
#system{display:flex;align-items:center;min-height:190px;width:max-content;margin:0 auto}
.link{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;position:relative;align-self:stretch}
.link::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:#fff3;z-index:0}
.link.chain::before{background:var(--yel);box-shadow:0 0 8px var(--yel)}
.link .pill{position:relative;z-index:1;border-radius:10px;padding:2px 7px;background:#242a7c;border:1.5px solid #fff4;font-weight:700;white-space:nowrap}
.link.d0 .pill{border-color:var(--red);color:#ffb0a8}
.link.d2 .pill{border-color:var(--green);color:#a8f0c4}
.link.dn .pill{border-color:var(--yel);color:#ffe29a}
.link.dis .pill{border-color:#fff2;color:var(--grey);font-weight:500}
.link .loads{position:relative;z-index:1;letter-spacing:2px;color:var(--red);font-size:10px;min-height:12px}
.link .ct{position:relative;z-index:1;color:var(--yel);font-size:10px;font-weight:700;min-height:12px}
.card{width:112px;height:158px;border-radius:12px;position:relative;flex:none;padding:5px;display:flex;flex-direction:column;align-items:center;border:2px solid var(--gold);background:linear-gradient(#1c2060,#0d1033);user-select:none;transition:transform .15s,box-shadow .15s}
.card.earth{background:linear-gradient(#14646c,#0a2d33);border-color:#e0b36a}
.card.pert{background:linear-gradient(#4a1f6e,#1f0d38);border-color:#c79bf2}
.card.hat{background:linear-gradient(#6e1f2b,#2d0a12);border-color:#ff9a8a}
.card .per{position:absolute;left:5px;top:5px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#14163f;font-weight:800;font-size:16px;display:grid;place-items:center}
.card .per.mod{background:#fff;outline:2px solid var(--red)}
.card .dial{position:absolute;right:4px;top:4px;width:30px;height:30px;color:var(--gold)}
.card .art{margin-top:24px;flex:1;display:grid;place-items:center;width:100%}
.card .nm{font-weight:700;font-size:12px;text-align:center;line-height:1.1;min-height:26px;display:flex;align-items:center}
.card .nt{font-size:10px;color:var(--mut);margin-bottom:3px}
.card .tx{font-size:10px;text-align:center;color:#ddd;line-height:1.15;margin-bottom:3px}
.card .own{position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:0 0 9px 9px;background:var(--oc,transparent)}
.card.threat{outline:3px solid var(--red);outline-offset:1px;animation:pulse 1s infinite}
.card .badge{position:absolute;left:5px;bottom:12px;font-size:14px}
.card.pop{animation:pop .5s}
.card.target{cursor:pointer;outline:3px dashed #fff;outline-offset:2px}
.card.target:hover,.card.picked{transform:translateY(-4px);outline-color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 18px var(--red)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.emo{font-size:38px;filter:drop-shadow(0 2px 4px #0008)}
.pl{width:52px;height:52px;border-radius:50%;position:relative;background:radial-gradient(circle at 32% 28%,#fffa 0,#fff0 38%),var(--pc);box-shadow:inset -9px -9px 16px #0008,0 0 16px color-mix(in srgb,var(--pc) 45%,transparent)}
.pl.rock{border-radius:46% 54% 42% 58%/56% 44% 58% 42%;width:48px;height:44px}
.pl.ring i{position:absolute;left:-16px;right:-16px;top:50%;height:18px;margin-top:-9px;border:3px solid #e8d9b5bb;border-radius:50%;transform:rotate(-18deg)}
.pl.bands{background:radial-gradient(circle at 32% 28%,#fff8 0,#fff0 38%),repeating-linear-gradient(0deg,#0000 0 6px,#7a4a2a77 6px 10px),var(--pc);width:58px;height:58px}
.pl.star{box-shadow:inset -9px -9px 16px #0008,0 0 22px var(--pc)}
.pl.star::after{content:'★';position:absolute;right:-14px;top:-12px;color:#ffe9a0;font-size:14px}
#hand{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px}
#hand .card{width:122px;height:172px;cursor:pointer}
#hand .card:hover{transform:translateY(-6px)}
#hand .card.sel{transform:translateY(-12px);box-shadow:0 0 22px var(--gold)}
#hand.off .card{opacity:.75;cursor:default}
#hand.off .card:hover{transform:none}
.zone{display:flex;flex-direction:column;gap:6px}
.zc{background:#2d0a12;border:1px solid #ff9a8a88;border-radius:10px;padding:6px 8px;font-size:12px}
.zc b{display:block;color:#ffb0a8}
.zc.hil{background:#0e2f26;border-color:#5fd18a88}.zc.hil b{color:#a8f0c4}
.mut{color:var(--mut);font-size:12px}
#info{min-height:40px;font-size:14px;color:#dfe2ff;display:flex;align-items:center;gap:8px;padding:8px 12px}
#panel{display:none}
#panel.on{display:block}
.pgrid{display:grid;grid-template-columns:62px repeat(4,1fr);gap:6px;align-items:stretch}
.pgrid .lb{align-self:center;font-size:12px;color:var(--mut)}
.pbtn{background:var(--panel2);border:1.5px solid #fff3;border-radius:10px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px}
.pbtn svg{width:26px;height:26px;color:var(--gold)}
.pbtn b{font-size:15px}
.pbtn small{font-size:10px;color:var(--mut);text-align:center;line-height:1.1}
.pbtn.d0{border-color:var(--red)}.pbtn.d0 b{color:#ffb0a8}
.pbtn.d2{border-color:var(--green)}.pbtn.d2 b{color:#a8f0c4}
.pbtn.dn{border-color:var(--yel)}
.pbtn.dis{border-color:#fff2}.pbtn.dis b{color:var(--grey)}
.pbtn:hover{background:#2a3190}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.legend{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5}
#log{max-height:150px;overflow:auto;font-size:12px;color:#c8ccff;display:flex;flex-direction:column;gap:3px}
#log div{padding:2px 0;border-bottom:1px solid #fff1}
#log .rd{color:var(--yel)}#log .ej{color:#ffb0a8}
#hint{display:none;border-color:#f3bd3c99;background:linear-gradient(#2c2a12,#18170a)}
#hint.on{display:block}
#hint h3{color:var(--yel)}
#hint .tip{margin-top:6px;font-size:12px;color:#e9dfae}
#hint b{color:#fff}
.card.hint{outline:3px solid var(--yel);outline-offset:2px;animation:hglow 1.4s infinite}
.card.htarget{outline:3px solid var(--yel);outline-offset:2px;box-shadow:0 0 18px var(--yel)}
@keyframes hglow{50%{box-shadow:0 0 22px var(--yel)}}
.pbtn.rec{box-shadow:0 0 0 2px var(--yel),0 0 16px var(--yel);position:relative}
.pbtn.rec::after{content:'★ совет';position:absolute;top:-9px;right:6px;background:var(--yel);color:#14163f;font-size:10px;font-weight:700;border-radius:8px;padding:0 6px}
.modal.wide{max-width:800px}
.demo-row{display:flex;align-items:center;justify-content:flex-start;padding:10px 0;overflow-x:auto}
.demo-row>:first-child{margin-left:auto}
.demo-row>:last-child{margin-right:auto}
.demo-row.gap{gap:14px}
.demo-note{margin:8px 0;padding:9px 12px;background:#ffffff10;border-left:3px solid var(--gold);border-radius:8px;font-size:13.5px;line-height:1.5}
.demo-note.red{border-color:var(--red)}.demo-note.green{border-color:var(--green)}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}
.dots i{width:9px;height:9px;border-radius:50%;background:#ffffff33}
.dots i.on{background:var(--gold)}
.ghost{width:112px;height:158px;border:2px dashed #ff6b5e99;border-radius:12px;display:grid;place-items:center;color:#ffb0a8;font-size:13px;text-align:center;padding:8px;flex:none}
.demo-cap{font-size:11px;color:var(--mut);text-align:center;margin-top:4px;max-width:130px}
.demo-col{display:flex;flex-direction:column;align-items:center}
@media(max-width:560px){.demo-row{zoom:.64}.demo-row.gap{gap:8px}}
#ov{position:fixed;inset:0;background:#05061ccc;display:none;align-items:center;justify-content:center;z-index:20;padding:14px;overflow:auto}
#ov.on{display:flex}
.modal{background:linear-gradient(#171c58,#0d1038);border:2px solid var(--gold);border-radius:18px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 8px;color:var(--gold);letter-spacing:2px}
.modal p,.modal li{font-size:14px;line-height:1.5;color:#dfe2ff}
.modal ul{padding-left:20px;margin:6px 0}
.seg{display:flex;gap:6px;margin:6px 0 12px}
.seg button{flex:1;background:var(--panel2);border:1.5px solid #fff3;border-radius:10px;padding:8px}
.seg button.on{border-color:var(--gold);background:#3a3f9a}
table.res{width:100%;border-collapse:collapse;margin:10px 0}
table.res td{padding:6px 4px;border-bottom:1px solid #fff2}
table.res tr.win td{color:var(--gold);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>РЕЗОНАНС</h1>
    <span class="chip" id="hRound"></span>
    <span class="chip" id="hDeck"></span>
    <span class="sp"></span>
    <button class="btn" id="bHint" style="display:none">💡 Подсказки: вкл</button>
    <button class="btn" id="bSound">🔊 Звук</button>
    <button class="btn" id="bRules">Правила</button>
    <button class="btn" id="bNew">Новая игра</button>
  </header>
  <section id="scores"></section>
  <section class="board">
    <div class="box">
      <h3>Система (карты кладутся к левому или правому краю)</h3>
      <div id="sysScroll"><div id="system"></div></div>
    </div>
    <div class="box">
      <h3>Зона Кирквуда (Юпитер = 12)</h3>
      <div class="zone" id="zone"></div>
    </div>
  </section>
  <section class="box" id="info"></section>
  <section class="box" id="panel"></section>
  <section class="box" id="hint"></section>
  <section class="box">
    <h3 id="handTitle">Ваша рука</h3>
    <div id="hand"></div>
  </section>
  <section class="box">
    <h3>Журнал</h3>
    <div id="log"></div>
  </section>
</div>
<div id="ov"></div>

<script>
/*ENGINE_START*/
'use strict';
function clamp(v){return Math.max(1,Math.min(12,v));}
function gcd(a,b){return b?gcd(b,a%b):a;}
const BASE={'1:1':1,'2:1':2,'3:1':2,'3:2':3,'4:3':3};
const NOTE_NAMES=['до','до♯','ре','ре♯','ми','фа','фа♯','соль','соль♯','ля','ля♯','си'];

const BODIES=[
 // космос
 {n:'Ио',p:1,k:'space',s:'round',c:'#f0b43c',f:'Разогрета приливами Юпитера. Резонанс 1:2:4 с Европой и Ганимедом'},
 {n:'Европа',p:2,k:'space',s:'round',c:'#e8dccb',f:'Делает один оборот, пока Ио делает два'},
 {n:'Ганимед',p:4,k:'space',s:'round',c:'#9b8a7a',f:'Крупнейший спутник Солнечной системы, замыкает цепочку 1:2:4'},
 {n:'Янус',p:1,k:'space',s:'rock',c:'#b7a89a',f:'Делит орбиту с Эпиметеем, они меняются местами'},
 {n:'Эпиметей',p:1,k:'space',s:'rock',c:'#a89a8d',f:'Партнёр Януса по общей орбите'},
 {n:'Луна (вращение)',p:1,k:'space',s:'round',c:'#cfcfcf',f:'Всегда повёрнута к Земле одной стороной'},
 {n:'Луна (обращение)',p:1,k:'space',s:'round',c:'#bdbdbd',f:'Период обращения равен периоду собственного вращения'},
 {n:'Меркурий (вращение)',p:2,k:'space',s:'round',c:'#9a9189',f:'Три оборота вокруг оси за два оборота по орбите'},
 {n:'Меркурий (орбита)',p:3,k:'space',s:'round',c:'#8a8279',f:'Резонанс 3:2 между вращением и орбитой'},
 {n:'Нептун',p:2,k:'space',s:'round',c:'#3f6fe0',f:'Не даёт Плутону приблизиться'},
 {n:'Плутон',p:3,k:'space',s:'round',c:'#d8b79a',f:'Орбиты пересекаются, но сближения не бывает: резонанс 3:2'},
 {n:'Титан',p:3,k:'space',s:'round',c:'#e3a244',f:'Резонанс 4:3 с Гиперионом'},
 {n:'Гиперион',p:4,k:'space',s:'rock',c:'#8c7b6b',f:'Кувыркается хаотично'},
 {n:'Мимас',p:2,k:'space',s:'round',c:'#cfd6e0',f:'Его толчки расчистили щель Кассини в кольцах Сатурна'},
 {n:'Частица кольца Сатурна',p:1,k:'space',s:'ring',c:'#e8d9b5',f:'Сходится с Мимасом 2:1 и покидает щель Кассини'},
 {n:'Юпитер',p:12,k:'space',s:'bands',c:'#d4a373',f:'Эталон для карт Люк'},
 {n:'Троян Юпитера',p:12,k:'space',s:'rock',c:'#6b5b4e',f:'Живёт в точке Лагранжа, резонанс 1:1'},
 {n:'Гильда',p:8,k:'space',s:'rock',c:'#7a6a5e',f:'Резонанс 3:2 с Юпитером, устойчивое скопление'},
 {n:'Астероид Туле',p:9,k:'space',s:'rock',c:'#7d7068',f:'Резонанс 4:3 с Юпитером'},
 {n:'Астероид 3:1',p:4,k:'space',s:'rock',c:'#8e7f74',f:'Из щели Кирквуда'},
 {n:'Астероид 2:1',p:6,k:'space',s:'rock',c:'#8a7b70',f:'Из щели Гекубы'},
 {n:'Астероид 4:1',p:3,k:'space',s:'rock',c:'#95857a',f:'Из щели Кирквуда'},
 {n:'Земля',p:8,k:'space',s:'round',c:'#3f8fe0',f:'Против Венеры 13:8: почти, но не точно'},
 {n:'Венера',p:5,k:'space',s:'round',c:'#e8c36a',f:'Слабая связь с Землёй: диссонанс'},
 {n:'Kepler-223 b',p:3,k:'space',s:'star',c:'#7fb4ff',f:'Первая планета цепочки 3:4:6:8'},
 {n:'Kepler-223 c',p:4,k:'space',s:'star',c:'#8fd0b0',f:'Вторая планета цепочки 3:4:6:8'},
 {n:'Kepler-223 d',p:6,k:'space',s:'star',c:'#d09fe8',f:'Третья планета цепочки 3:4:6:8'},
 {n:'Kepler-223 e',p:8,k:'space',s:'star',c:'#ff9f7a',f:'Замыкает цепочку 3:4:6:8'},
 // не космос
 {n:'Камертон A',p:1,k:'earth',s:'🔱',c:'#fff',f:'Ударили один камертон, второй зазвучал сам'},
 {n:'Камертон A',p:1,k:'earth',s:'🔱',c:'#fff',f:'Ударили один камертон, второй зазвучал сам'},
 {n:'Маятник',p:2,k:'earth',s:'🕰️',c:'#fff',f:'Часы Гюйгенса на одной стене подстраивались друг под друга'},
 {n:'Метроном',p:3,k:'earth',s:'⏱️',c:'#fff',f:'На общей подвижной доске метрономы синхронизируются'},
 {n:'Струна: основной тон',p:12,k:'earth',s:'🎻',c:'#fff',f:'Колеблется целиком одной дугой'},
 {n:'Струна: 2-я гармоника',p:6,k:'earth',s:'🎻',c:'#fff',f:'Октава над основным тоном'},
 {n:'Струна: 3-я гармоника',p:4,k:'earth',s:'🎻',c:'#fff',f:'Октава плюс квинта над основным тоном'},
 {n:'Струна: 4-я гармоника',p:3,k:'earth',s:'🎻',c:'#fff',f:'Две октавы над основным тоном'},
 {n:'Качели',p:4,k:'earth',s:'🎡',c:'#fff',f:'Раскачка слабыми толчками в такт'},
 {n:'Бокал',p:5,k:'earth',s:'🍷',c:'#fff',f:'Лопается на собственной частоте'},
 {n:'Голос',p:5,k:'earth',s:'🎤',c:'#fff',f:'1:1 с бокалом: опасное соседство'},
 {n:'Мост',p:7,k:'earth',s:'🌉',c:'#fff',f:'Мост Миллениум в 2000 г. раскачали шаги пешеходов'},
 {n:'Шаг толпы',p:7,k:'earth',s:'👣',c:'#fff',f:'Синхронный шаг усиливает колебания моста'}
];
const PERTURBS=[
 {fx:'tide',n:'Приливная сила',icon:'🌊',t:'Период тела ±1',c:4},
 {fx:'shift',n:'Сдвиг фазы',icon:'🌀',t:'Поворот фазы тела на ±90°',c:3},
 {fx:'wind',n:'Солнечный ветер',icon:'☀️',t:'Убирает тело из системы',c:2},
 {fx:'swap',n:'Гравитационный толчок',icon:'🔄',t:'Меняет соседние тела местами',c:2}
];
const HATCHES=[
 {hx:'kirkwood',hit:6,n:'Щель 2:1',icon:'🕳️',c:2},
 {hx:'kirkwood',hit:4,n:'Щель 3:1',icon:'🕳️',c:2},
 {hx:'kirkwood',hit:3,n:'Щель 4:1',icon:'🕳️',c:2},
 {hx:'hilda',hit:8,n:'Гильды 3:2',icon:'🛡️',c:2}
];

function freqOf(p){return 660/p;}
function noteOf(p){
  const f=freqOf(p),m=69+12*Math.log2(f/440),r=Math.round(m),cents=Math.round((m-r)*100);
  return {f,name:NOTE_NAMES[((r%12)+12)%12],oct:Math.floor(r/12)-1,cents,approx:Math.abs(cents)>12};
}
function noteText(p){const n=noteOf(p);return (n.approx?'≈ ':'')+n.name+n.oct+' · '+Math.round(n.f)+' Гц';}

function buildDeck(){
  let id=0;const d=[];
  BODIES.forEach(b=>d.push({id:'c'+(id++),kind:'body',name:b.n,period:b.p,theme:b.k,shape:b.s,color:b.c,fact:b.f}));
  PERTURBS.forEach(x=>{for(let i=0;i<x.c;i++)d.push({id:'c'+(id++),kind:'perturb',fx:x.fx,name:x.n,icon:x.icon,text:x.t});});
  HATCHES.forEach(x=>{for(let i=0;i<x.c;i++)d.push({id:'c'+(id++),kind:'hatch',hx:x.hx,hit:x.hit,name:x.n,icon:x.icon,
    text:x.hx==='hilda'?'Тела с периодом 8 защищены от Люков и дают +1 очко при выкладывании':'Выбрасывает тела с периодом '+x.hit+' (кроме тел в фазе 2)'});});
  return d;
}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function effP(b){return clamp(b.card.period+b.mod);}
function baseScore(pa,pb){const g=gcd(pa,pb),hi=Math.max(pa,pb)/g,lo=Math.min(pa,pb)/g;return BASE[hi+':'+lo]||0;}
function ratioText(pa,pb){const g=gcd(pa,pb);return (Math.max(pa,pb)/g)+':'+(Math.min(pa,pb)/g);}
function phaseDelta(x,y){return (((x.phase-y.phase)%4)+4)%4;}
function linkInfo(x,y){
  const base=baseScore(effP(x),effP(y)),d=phaseDelta(x,y);
  const score=!base?0:d===0?base*2:d===2?base+1:base;
  return {base,d,score,ratio:ratioText(effP(x),effP(y))};
}
function linkScore(x,y){return linkInfo(x,y).score;}
function chainBonus(x,y,z){
  const a=linkScore(x,y),b=linkScore(y,z);
  if(!a||!b)return 0;
  if(x.phase===y.phase&&y.phase===z.phase)return 0;
  return a+b;
}
function totalScore(sys){
  let t=0;
  for(let i=0;i<sys.length-1;i++)t+=linkScore(sys[i],sys[i+1]);
  for(let i=0;i<sys.length-2;i++)t+=chainBonus(sys[i],sys[i+1],sys[i+2]);
  return t;
}
function loadKey(a,b){return a.uid+'|'+b.uid;}
function hasHilda(st){return st.zone.some(c=>c.hx==='hilda');}
function isProtected(st,b){return b.phase===2||(effP(b)===8&&hasHilda(st));}
function hatchHits(st,b){return !isProtected(st,b)&&st.zone.some(c=>c.hx==='kirkwood'&&c.hit===effP(b));}
function pruneLoads(st){
  const nl={};
  for(let i=0;i<st.system.length-1;i++){
    const a=st.system[i],b=st.system[i+1],k=loadKey(a,b),inf=linkInfo(a,b);
    if(inf.base&&inf.d===0&&st.loads[k]>0)nl[k]=st.loads[k];
  }
  st.loads=nl;
}
function pname(st,id){const p=st.players[id];return p?p.name:'Система';}
function ejectAt(st,i,reason,ev){
  const b=st.system.splice(i,1)[0];
  st.discard.push(b.card);
  const nm='«'+b.card.name+'» (период '+effP(b)+')';
  const text=reason==='hatch'?'Щель Кирквуда выбрасывает '+nm
    :reason==='load'?'Орбита раскачана: '+nm+' выбрасывается из системы'
    :'Солнечный ветер уносит '+nm;
  ev.push({kind:'eject',reason,owner:b.owner,text});
  pruneLoads(st);
}
function applyHatches(st,ev){
  for(;;){
    const i=st.system.findIndex(b=>hatchHits(st,b));
    if(i<0)break;
    ejectAt(st,i,'hatch',ev);
  }
}
function endRound(st,ev){
  ev.push({kind:'round',text:'Конец раунда '+st.round});
  applyHatches(st,ev);
  const nl={};
  for(let i=0;i<st.system.length-1;i++){
    const a=st.system[i],b=st.system[i+1],k=loadKey(a,b),inf=linkInfo(a,b);
    if(inf.base&&inf.d===0)nl[k]=(st.loads[k]||0)+1;
  }
  st.loads=nl;
  for(;;){
    let hit=-1;
    for(let i=0;i<st.system.length-1;i++){if((st.loads[loadKey(st.system[i],st.system[i+1])]||0)>=3){hit=i;break;}}
    if(hit<0)break;
    const a=st.system[hit],b=st.system[hit+1];
    ejectAt(st,effP(a)>effP(b)?hit:hit+1,'load',ev);
  }
}

function newGame(opts){
  opts=opts||{};
  const rng=opts.rng||Math.random;
  const nb=Math.max(1,Math.min(3,opts.bots||1));
  const deck=shuffle(buildDeck(),rng);
  const names=['Бот Европа','Бот Ганимед','Бот Каллисто'],cols=['#6ec6ff','#ff8a7a','#9be58f'];
  const players=[{id:0,name:'Вы',isBot:false,color:'#f3bd3c',hand:[],score:0}];
  for(let i=0;i<nb;i++)players.push({id:i+1,name:names[i],isBot:true,color:cols[i],hand:[],score:0});
  const st={deck,discard:[],players,system:[],loads:{},zone:[],cur:0,round:1,turnsInRound:0,endLeft:null,over:false,uidN:0,diff:opts.diff||'normal'};
  const si=st.deck.findIndex(c=>c.kind==='body');
  const seed=st.deck.splice(si,1)[0];
  st.system.push({uid:'u'+(st.uidN++),card:seed,owner:null,phase:0,mod:0});
  for(const p of players)for(let i=0;i<4;i++)p.hand.push(st.deck.pop());
  return st;
}

function fail(msg){return {ok:false,msg,events:[],gained:0};}
function applyAction(st,a){
  const p=st.players[st.cur],ci=p.hand.findIndex(c=>c.id===a.cardId);
  if(ci<0)return fail('Нет такой карты');
  const card=p.hand[ci],ev=[],sys=st.system,before=totalScore(sys);
  let gained=0;
  if(a.type==='discard'){
    p.hand.splice(ci,1);st.discard.push(card);
    ev.push({kind:'discard',text:p.name+' сбрасывает «'+card.name+'» и пропускает ход'});
    return {ok:true,events:ev,gained:0};
  }
  if(a.type==='body'){
    if(card.kind!=='body')return fail('Это не тело');
    p.hand.splice(ci,1);
    const b={uid:'u'+(st.uidN++),card,owner:p.id,phase:((a.phase%4)+4)%4,mod:0};
    if(a.side==='L')sys.unshift(b);else sys.push(b);
    gained=totalScore(sys)-before;
    let extra='';
    if(effP(b)===8&&hasHilda(st)){gained+=1;extra=' (+1 за Гильды)';}
    ev.push({kind:'place',uid:b.uid,text:p.name+' кладёт «'+card.name+'» (период '+effP(b)+', фаза '+b.phase+') '+(a.side==='L'?'слева':'справа')+': +'+gained+extra});
  }else if(a.type==='tide'||a.type==='shift'||a.type==='wind'||a.type==='swap'){
    if(card.kind!=='perturb'||card.fx!==a.type)return fail('Карта не подходит');
    const b=sys[a.idx];
    if(!b)return fail('Нет цели');
    if(a.type==='tide'){
      const e=effP(b),ne=clamp(e+a.dir);
      if(ne===e)return fail('Период на границе');
      p.hand.splice(ci,1);st.discard.push(card);
      b.mod=ne-b.card.period;
      gained=Math.max(0,totalScore(sys)-before);
      ev.push({kind:'perturb',text:p.name+': «'+b.card.name+'» период '+e+' → '+ne+': +'+gained});
    }else if(a.type==='shift'){
      p.hand.splice(ci,1);st.discard.push(card);
      const o=b.phase;b.phase=(((o+a.dir)%4)+4)%4;
      gained=Math.max(0,totalScore(sys)-before);
      ev.push({kind:'perturb',text:p.name+': «'+b.card.name+'» фаза '+o+' → '+b.phase+': +'+gained});
    }else if(a.type==='wind'){
      if(sys.length<2)return fail('Нельзя убрать единственное тело');
      p.hand.splice(ci,1);st.discard.push(card);
      ejectAt(st,a.idx,'wind',ev);
    }else{
      if(a.idx<0||a.idx>=sys.length-1)return fail('Нет пары');
      p.hand.splice(ci,1);st.discard.push(card);
      const t=sys[a.idx];sys[a.idx]=sys[a.idx+1];sys[a.idx+1]=t;
      gained=Math.max(0,totalScore(sys)-before);
      ev.push({kind:'perturb',text:p.name+' меняет местами «'+sys[a.idx].card.name+'» и «'+sys[a.idx+1].card.name+'»: +'+gained});
    }
  }else if(a.type==='hatch'){
    if(card.kind!=='hatch')return fail('Это не Люк');
    p.hand.splice(ci,1);
    st.zone.push(card);
    if(st.zone.length>2)st.discard.push(st.zone.shift());
    ev.push({kind:'hatch',text:p.name+' кладёт в зону Кирквуда «'+card.name+'»'});
    applyHatches(st,ev);
  }else return fail('Неизвестное действие');
  pruneLoads(st);
  p.score+=gained;
  return {ok:true,events:ev,gained};
}
function finishTurn(st){
  const ev=[],p=st.players[st.cur];
  while(p.hand.length<4&&st.deck.length)p.hand.push(st.deck.pop());
  pruneLoads(st);
  if(st.endLeft!==null)st.endLeft--;
  else if(!st.deck.length)st.endLeft=st.players.length;
  st.turnsInRound++;
  st.cur=(st.cur+1)%st.players.length;
  if(st.turnsInRound>=st.players.length){endRound(st,ev);st.round++;st.turnsInRound=0;}
  if(st.endLeft!==null&&st.endLeft<=0)st.over=true;
  if(st.players.every(q=>!q.hand.length))st.over=true;
  return ev;
}
function cloneState(st){return JSON.parse(JSON.stringify(st));}

function legalActions(st){
  const p=st.players[st.cur],acts=[],seen=new Set(),n=st.system.length;
  for(const c of p.hand){
    const key=c.kind+c.name;
    if(seen.has(key))continue;seen.add(key);
    if(c.kind==='body'){
      for(const side of ['L','R'])for(let ph=0;ph<4;ph++)acts.push({type:'body',cardId:c.id,side,phase:ph});
    }else if(c.kind==='perturb'){
      if(c.fx==='tide'){for(let i=0;i<n;i++)for(const dir of [-1,1]){const e=effP(st.system[i]);if(clamp(e+dir)!==e)acts.push({type:'tide',cardId:c.id,idx:i,dir});}}
      else if(c.fx==='shift'){for(let i=0;i<n;i++)for(const dir of [-1,1])acts.push({type:'shift',cardId:c.id,idx:i,dir});}
      else if(c.fx==='wind'){if(n>=2)for(let i=0;i<n;i++)acts.push({type:'wind',cardId:c.id,idx:i});}
      else if(c.fx==='swap'){for(let i=0;i<n-1;i++)acts.push({type:'swap',cardId:c.id,idx:i});}
    }else acts.push({type:'hatch',cardId:c.id});
  }
  return acts;
}
function botChoose(st,rng){
  rng=rng||Math.random;
  const me=st.cur,acts=legalActions(st),scored=[];
  for(const a of acts){
    const sim=cloneState(st),r=applyAction(sim,a);
    if(!r.ok)continue;
    let v=r.gained,risk=0;
    for(const e of r.events){
      if(e.kind==='eject'&&(e.reason==='hatch'||e.reason==='load')&&e.owner!==null){v+=e.owner===me?-2:1.5;}
    }
    const s=sim.system;
    for(let i=0;i<s.length-1;i++){
      const inf=linkInfo(s[i],s[i+1]);
      if(inf.base&&inf.d===0)risk+=0.8+1.2*(sim.loads[loadKey(s[i],s[i+1])]||0);
    }
    for(const b of s)if(b.owner===me&&hatchHits(sim,b))risk+=2;
    v-=risk;
    v+=rng()*(st.diff==='easy'?3:0.25);
    scored.push({a,v});
  }
  scored.sort((x,y)=>y.v-x.v);
  return scored.length?scored[0].a:{type:'discard',cardId:st.players[me].hand[0].id};
}

let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,t,d,vol,type){
  if(!ui.sound)return;const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+(t||0);
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(d||0.7));
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+(d||0.7)+0.05);
}
function soundPlace(a){
  const s=G.system,n=s.length;if(!n)return;
  const nb=a.side==='L'?s[0]:s[n-1],nei=a.side==='L'?s[1]:s[n-2];
  tone(freqOf(effP(nb))*2,0,0.8,0.14);
  if(nei){
    const f2=freqOf(effP(nei))*2,ok=baseScore(effP(nb),effP(nei))>0;
    tone(ok?f2:f2*1.04,0,0.8,0.1);
  }
}

function dialSVG(ph,cls){
  const a=ph*Math.PI/2,x=15+9*Math.sin(a),y=15-9*Math.cos(a);
  return '<svg class="'+(cls||'dial')+'" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#0d1033" stroke="currentColor" stroke-width="1.5"/><path d="M15 0.5 l-3.2 4.4 h6.4z" fill="currentColor"/><circle cx="15" cy="15" r="2.4" fill="#f3bd3c"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="#fff"/></svg>';
}
function artHTML(c){
  if(c.kind!=='body')return '<div class="emo">'+c.icon+'</div>';
  if(c.theme==='earth')return '<div class="emo">'+c.shape+'</div>';
  return '<div class="pl '+c.shape+'" style="--pc:'+c.color+'"><i></i></div>';
}
function infoOf(c){
  if(c.kind==='body')return '«'+c.name+'»: '+c.fact+'. Период '+c.period+', нота '+noteText(c.period)+'.';

function cardHTML(c,o){

function sameCardName(id){const c=G.players[G.cur].hand.find(x=>x.id===id);return c?c.name:'';}
function isRec(a){
  const hn=getHint();if(!hn)return false;const h=hn.a;
  return sameCardName(a.cardId)===hn.name&&a.type===h.type&&a.side===h.side&&a.phase===h.phase&&a.idx===h.idx&&a.dir===h.dir;
}
function hintKey(){
  return [G.cur,G.round,G.system.map(b=>b.uid+':'+b.phase+':'+b.mod).join(','),G.players[0].hand.map(c=>c.id).join(','),G.zone.map(c=>c.id).join(',')].join('|');
}
function hintText(a,pv,c){
  const g=pv.r.gained,sim=pv.sim;
  if(a.type==='body'){
    const nl=newLinkInfo(sim,a.side);
    let why=!nl?'это первое звено системы'
      :!nl.base?'простого отношения нет, очков не будет, но и нагрузки тоже'
      :nl.d===2?'отношение '+nl.ratio+' в противофазе: +1 очко и защита от Люков'
      :nl.d===0?'отношение '+nl.ratio+' в сближении: очки ×2, но копится нагрузка, следите за жетонами'
      :'простое отношение '+nl.ratio+' даёт очки';
    if(nl&&nl.base&&g>nl.score)why+='; плюс бонус цепочки';
    return 'Сыграйте <b>«'+c.name+'»</b> <b>'+(a.side==='L'?'слева':'справа')+'</b> с <b>фазой '+a.phase+'</b>: <b>+'+g+'</b>. Почему: '+why+'.';
  }
  if(a.type==='hatch'){
    const lost=G.system.filter(b=>!sim.system.some(x=>x.uid===b.uid));
    return 'Положите Люк <b>«'+c.name+'»</b> в зону: '+(lost.length?'он выбросит '+lost.map(b=>'«'+b.card.name+'»').join(', '):'пока никого не заденет, но создаст угрозу для периода '+(c.hx==='hilda'?8:c.hit))+'.';
  }
  const b=G.system[a.idx],nm='«'+b.card.name+'»';
  if(a.type==='tide')return 'Сыграйте <b>«Приливная сила»</b> на '+nm+': период '+effP(b)+' → '+clamp(effP(b)+a.dir)+', <b>+'+g+'</b>.';
  if(a.type==='shift')return 'Сыграйте <b>«Сдвиг фазы»</b> на '+nm+': фаза '+b.phase+' → '+((b.phase+a.dir+4)%4)+', <b>+'+g+'</b>.';
  if(a.type==='swap')return 'Сыграйте <b>«Гравитационный толчок»</b>: поменять «'+b.card.name+'» и «'+G.system[a.idx+1].card.name+'», <b>+'+g+'</b>.';
  return 'Сыграйте <b>«Солнечный ветер»</b> на '+nm+': убрать тело из системы.';
}
function getHint(){
  if(ui.diff!=='easy'||!ui.hints||!G||!humanTurn())return null;
  const k=hintKey();
  if(ui.hint&&ui.hint.key===k)return ui.hint;
  const a=botChoose(G,()=>0),c=G.players[G.cur].hand.find(x=>x.id===a.cardId);
  if(a.type==='discard'||!c){ui.hint=null;return null;}
  const pv=preview(a);
  const none=pv.r.gained===0&&['body','tide','shift','swap'].includes(a.type)
    ?' Очков этот ход не принесёт: выгодных вариантов в руке нет, можно и сбросить карту.':'';
  ui.hint={key:k,a,name:c.name,text:hintText(a,pv,c)+none};
  return ui.hint;
}
function renderHint(){
  const H=$('#hint'),B=$('#bHint');
  B.style.display=ui.diff==='easy'?'':'none';
  B.textContent=ui.hints?'💡 Подсказки: вкл':'💡 Подсказки: выкл';
  const hn=getHint();
  if(!hn){H.className='box';H.innerHTML='';return;}
  H.className='box on';
  H.innerHTML='<h3>💡 Подсказка (лёгкий режим)</h3><div>'+hn.text+'</div><div class="tip">Совет: '+TIPS[(G.round-1)%TIPS.length]+'</div><div class="row"><button class="btn" id="bShowHint">Выбрать эту карту</button></div>';
}
function renderPanel(){

      for(let ph=0;ph<4;ph++){

        const cls=!nl?'dn':!nl.base?'dis':nl.d===0?'d0':nl.d===2?'d2':'dn';
        const sub=!nl?'первое звено':!nl.base?'диссонанс':nl.ratio+(nl.d===0?' ⚠ сближ.':nl.d===2?' противоф.':'');

  }else if(c.kind==='perturb'){
    if(ui.tgt===null||!G.system[ui.tgt])h+='<div class="mut">Выберите тело в системе (подсвечено пунктиром).</div>';
    else{
      const b=G.system[ui.tgt];
      h+='<div class="mut" style="margin-bottom:6px">Цель: «'+b.card.name+'» (период '+effP(b)+', фаза '+b.phase+')</div><div class="row">';
      if(c.fx==='tide')for(const dir of [-1,1]){
        const a={type:'tide',cardId:c.id,idx:ui.tgt,dir},{r}=preview(a),e=effP(b);
        h+=btnHTML(n++,a,'<b>'+(dir<0?'−1':'+1')+'</b><small>период '+e+' → '+clamp(e+dir)+(r.ok?'<br>+'+r.gained:'')+'</small>','dn',!r.ok);
      }
      else if(c.fx==='shift')for(const dir of [-1,1]){
        const a={type:'shift',cardId:c.id,idx:ui.tgt,dir},{r}=preview(a);
        h+=btnHTML(n++,a,dialSVG((b.phase+dir+4)%4,'')+'<b>'+(dir<0?'↺ −90°':'↻ +90°')+'</b><small>+'+r.gained+'</small>','dn');
      }
      else if(c.fx==='wind'){
        const a={type:'wind',cardId:c.id,idx:ui.tgt},{r}=preview(a);
        h+=btnHTML(n++,a,'<b>Убрать</b><small>«'+b.card.name+'»</small>','d0',!r.ok);
      }
      else if(c.fx==='swap'){
        for(const [lbl,idx] of [['← с левым',ui.tgt-1],['с правым →',ui.tgt]]){
          const a={type:'swap',cardId:c.id,idx},ok=idx>=0&&idx<G.system.length-1,{r}=ok?preview(a):{r:{gained:0}};
          h+=btnHTML(n++,a,'<b>'+lbl+'</b><small>'+(ok?'+'+r.gained:'нет соседа')+'</small>','dn',!ok);
        }
      }
      h+='</div>';
    }
  }else{
    const {sim}=preview({type:'hatch',cardId:c.id});

    h+='<div class="mut">'+c.text+'.</div>';
    h+='<div style="margin:6px 0">'+(lost.length?'Сразу будут выброшены: <b style="color:#ffb0a8">'+lost.join(', ')+'</b>':'Сейчас ни одно тело не пострадает.')+(G.zone.length>=2?' Самая старая карта зоны уйдёт в сброс.':'')+'</div><div class="row">';
    h+=btnHTML(n++,{type:'hatch',cardId:c.id},'<b>Положить в зону</b>','d0')+'</div>';
  }
  h+='<div class="row"><button class="btn" id="bDiscard">Сбросить карту и пропустить ход</button><button class="btn" id="bCancel">Отмена</button></div>';
  P.className='box on';P.innerHTML=h;
}

/* ---------- ход человека и ботов ---------- */
function logLines(ev){
  const L=$('#log');
  ev.forEach(e=>{
    const d=document.createElement('div');
    d.textContent=e.text;
    if(e.kind==='round')d.className='rd';
    if(e.kind==='eject')d.className='ej';
    L.insertBefore(d,L.firstChild);
  });
  while(L.childNodes.length>60)L.removeChild(L.lastChild);
}
function afterAction(a,r){
  logLines(r.events);
  if(a.type==='body'){soundPlace(a);const nb=a.side==='L'?G.system[0]:G.system[G.system.length-1];ui.last=nb.uid;}
  else if(r.gained>0)tone(660,0,0.4,0.1);
  if(r.events.some(e=>e.kind==='eject'))soundEject();
  const ev2=finishTurn(G);
  logLines(ev2);
  if(ev2.some(e=>e.kind==='eject'))soundEject();
}
async function advance(){
  const gid=ui.gid;
  ui.busy=true;render();
  while(!G.over){
    const p=G.players[G.cur];
    if(!p.hand.length){logLines([{text:p.name+': карт нет, ход пропущен'}]);logLines(finishTurn(G));render();await sleep(300);if(gid!==ui.gid)return;continue;}
    if(!p.isBot)break;
    await sleep(900);
    if(gid!==ui.gid)return;
    const a=botChoose(G);
    const r=applyAction(G,a);
    if(!r.ok){applyAction(G,{type:'discard',cardId:p.hand[0].id});}
    afterAction(a,r.ok?r:{events:[],gained:0});
    render();
  }
  ui.busy=false;render();
  if(G.over)showEnd();
}
function humanAct(a){
  if(!humanTurn())return;
  const r=applyAction(G,a);
  if(!r.ok){alert(r.msg);return;}
  ui.sel=null;ui.tgt=null;
  afterAction(a,r);
  advance();
}

      '<div class="legend">Нажимайте кнопку и смотрите, как меняются цвет связи и очки: красный — сближение, зелёный — противофаза, жёлтый — сдвиг.</div>'};
  },
  ()=>{
    const a=dBody('Европа',1),b=dBody('Ганимед',demo.phB),inf=linkInfo(a,b),lo=demo.loads;
    let h='<p>На связи с <b>сближением</b> каждый раунд копится жетон нагрузки. На третьем жетоне раскачанная орбита выбрасывает тело с <b>большим периодом</b>. Это обратная сторона резонанса: накопление может разрушать.</p>';
    if(demo.ejected){
      h+=demoRow([a])+demoNote('<b>Выброшен «Ганимед» (период 4).</b> Нагрузка дошла до трёх. Система осталась без него.','red');
    }else{
      h+=demoRow([a,b],{loads:lo});
      h+=inf.d===0?demoNote('Жетонов нагрузки: <b>'+lo+' из 3</b>. Закончите раунд и посмотрите, что произойдёт.','red')
        :demoNote('Фаза изменилась (Δ='+inf.d+'): жетоны сняты, связь снова безопасна.','green');
    }
    h+='<div class="row" style="justify-content:center">'+
      '<button class="btn pri" data-d="round"'+(demo.ejected||inf.d!==0?' disabled':'')+'>Конец раунда</button>'+
      '<button class="btn" data-d="rotB"'+(demo.ejected?' disabled':'')+'>↻ Повернуть Ганимед (фаза '+demo.phB+')</button>'+
      '<button class="btn" data-d="resetLoad">Сначала</button></div>';
    return {title:'Нагрузка и выброс',html:h};
  },
  ()=>{
    const ph=demo.chain==='diff'?[0,1,2]:[1,1,1];
    const a=dBody('Ио',ph[0]),b=dBody('Европа',ph[1]),c=dBody('Ганимед',ph[2]);
    const l1=linkScore(a,b),l2=linkScore(b,c),cb=chainBonus(a,b,c),tot=totalScore([a,b,c]);
    return {title:'Цепочки и правило Лапласа',html:
      '<p>Три тела подряд с резонансными связями образуют <b>цепочку</b>: вы получаете бонус, равный сумме двух связей. Но у настоящего резонанса Лапласа (Ио, Европа, Ганимед) тройного сближения не бывает, поэтому <b>если фазы всех трёх одинаковые, бонуса нет</b>.</p>'+
      demoRow([a,b,c],{chain:cb>0?'⛓ +'+cb:''})+
      '<div class="row" style="justify-content:center"><button class="btn'+(demo.chain==='diff'?' pri':'')+'" data-d="chain:diff">Разные фазы (0, 1, 2)</button><button class="btn'+(demo.chain==='same'?' pri':'')+'" data-d="chain:same">Одинаковые фазы (1, 1, 1)</button></div>'+
      demoNote('Связи: '+l1+' + '+l2+', бонус цепочки: '+cb+'. <b>Итого '+tot+'.</b> '+(demo.chain==='diff'?'Чисто и безопасно: нет сближения, нет нагрузки.':'Бонуса цепочки нет, а обе связи ещё и копят нагрузку: невыгодно.'),demo.chain==='diff'?'green':'red')};
  },
  ()=>({title:'Ваш ход: три типа карт',html:
    '<p>В свой ход вы играете <b>одну карту</b> из руки (4 карты), затем берёте новую. Очки получает тот, кто сыграл карту.</p>'+
    '<div class="demo-row gap">'+
      '<div class="demo-col">'+cardHTML(dBody('Земля',0).card,{body:dBody('Земля',0)})+'<div class="demo-cap"><b>Тело.</b> К левому или правому краю системы, с выбором фазы.</div></div>'+
      '<div class="demo-col">'+cardHTML({id:'d',kind:'perturb',fx:'tide',name:'Приливная сила',icon:'🌊',text:'Период тела ±1'})+'<div class="demo-cap"><b>Возмущение.</b> Меняет карту в системе: период, фазу, порядок.</div></div>'+
      '<div class="demo-col">'+cardHTML({id:'d',kind:'hatch',hx:'kirkwood',hit:6,name:'Щель 2:1',icon:'🕳️',text:'Выбрасывает тела с периодом 6 (кроме тел в фазе 2)'})+'<div class="demo-cap"><b>Люк.</b> Ложится в зону Кирквуда и выбрасывает тела.</div></div>'+
    '</div>'+
    demoNote('Возмущения тоже приносят очки: вы получаете прирост, который они создали. Солнечный ветер убирает тело, Гравитационный толчок меняет двух соседей местами, Сдвиг фазы поворачивает карту на ±90°.')}),
  ()=>{
    const left=dBody('Астероид 3:1',0),right=dBody('Астероид 3:1',2);
    const hz={id:'d',kind:'hatch',hx:'kirkwood',hit:4,name:'Щель 3:1',icon:'🕳️',text:'Выбрасывает тела с периодом 4 (кроме тел в фазе 2)'};
    let h='<p><b>Люки</b> лежат в зоне Кирквуда (Юпитер = 12) и выбрасывают тела с нужным периодом: сразу при появлении и в конце каждого раунда. От Люка защищает <b>фаза 2</b>; период 8 защищает карта «Гильды 3:2».</p>';
    h+='<div class="demo-row gap">'+
      '<div class="demo-col">'+(demo.hatched?'<div class="ghost">💥 выброшен<br>(фаза 0)</div>':cardHTML(left.card,{body:left,cls:'threat'}))+'<div class="demo-cap">Фаза 0: не защищён</div></div>'+
      '<div class="demo-col">'+cardHTML(right.card,{body:right})+'<div class="demo-cap">Фаза 2: защищён</div></div>'+
      '<div class="demo-col">'+(demo.hatched?cardHTML(hz):'<div class="ghost" style="border-color:#fff3;color:#9fa6ff">зона<br>Кирквуда<br>пуста</div>')+'<div class="demo-cap">Зона Кирквуда</div></div>'+
    '</div>';
    h+='<div class="row" style="justify-content:center"><button class="btn pri" data-d="hatch"'+(demo.hatched?' disabled':'')+'>Положить «Щель 3:1» в зону</button><button class="btn" data-d="unhatch">Сначала</button></div>';
    h+=demoNote(demo.hatched?'Щель 3:1 выбрасывает тела с периодом 4. Тело в фазе 2 осталось на месте, потому что оно в противофазе: безопасная позиция.':'Красная рамка у карты слева значит, что ей грозит Люк. В игре такие карты пульсируют красным.',demo.hatched?'green':'');
    return {title:'Люки: резонанс разрушает',html:h};
  },
  ()=>({title:'Как закончится игра',html:
    '<ul><li>Когда колода пуста, каждый игрок делает ещё по одному ходу.</li><li>Побеждает набравший <b>больше очков</b>.</li><li>Если в руке нет хороших ходов, можно сбросить карту вместо хода.</li></ul>'+
    demoNote('<b>Совет новичку:</b> выбирайте режим «Лёгкая (с подсказками)»: игра подсветит лучший ход и объяснит, почему он хорош. Наведите курсор на любую карту или связь, чтобы прочитать физический факт.')+
    '<p>Итак, коротко: простые отношения периодов дают очки, фаза решает, будет резонанс защитой (Δ=2) или ловушкой (Δ=0), а Люки и нагрузка выбрасывают лишних.</p>'})
];
function renderDemo(){
  const old=document.querySelector('#ov .modal'),sc=old?old.scrollTop:0;
  DEMO_ON=true;
  let st;try{st=DEMO_STEPS[demo.step]();}finally{DEMO_ON=false;}
  const n=DEMO_STEPS.length,last=demo.step===n-1;
  showOv('<h2>'+st.title+'</h2><div class="dots">'+DEMO_STEPS.map((_,i)=>'<i class="'+(i===demo.step?'on':'')+'"></i>').join('')+'</div><div class="mut" style="text-align:center;margin-bottom:6px">Демонстрация правил: шаг '+(demo.step+1)+' из '+n+'</div>'+st.html+
    '<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn" data-d="skip">'+(demo.from==='game'?'Закрыть':'Пропустить')+'</button><span class="row" style="margin:0">'+
    (demo.step>0?'<button class="btn" data-d="prev">← Назад</button>':'')+
    '<button class="btn pri" data-d="'+(last?'finish':'next')+'">'+(last?(demo.from==='game'?'Закрыть':'К игре →'):'Дальше →')+'</button></span></div>','wide');
  const nm=document.querySelector('#ov .modal');if(nm)nm.scrollTop=sc;
}
function showDemo(from){
  Object.assign(demo,{step:0,from:from||'start',ph:0,loads:0,phB:1,ejected:false,chain:'diff',hatched:false});
  renderDemo();
}
function leaveDemo(){if(demo.from==='game')hideOv();else showStart();}
function demoAct(a){
  if(a==='next'){demo.step=Math.min(demo.step+1,DEMO_STEPS.length-1);demo.loads=0;demo.ejected=false;}
  else if(a==='prev'){demo.step=Math.max(0,demo.step-1);}
  else if(a==='skip'||a==='finish'){leaveDemo();return;}
  else if(a==='hear:ok'||a==='hear:bad'){
    ui.sound=true;
    const p=a==='hear:ok'?[1,2]:[5,7];
    tone(freqOf(p[0])*2,0,1.2,0.14);tone(freqOf(p[1])*2,0,1.2,0.14);
    return;
  }
  else if(a==='rot'){demo.ph=(demo.ph+1)%4;}
  else if(a==='round'){demo.loads++;if(demo.loads>=3){demo.ejected=true;soundEject();}}
  else if(a==='rotB'){demo.phB=(demo.phB+1)%4;demo.loads=0;}
  else if(a==='resetLoad'){demo.loads=0;demo.phB=1;demo.ejected=false;}
  else if(a==='chain:diff'||a==='chain:same'){demo.chain=a.split(':')[1];}
  else if(a==='hatch'){demo.hatched=true;soundEject();}
  else if(a==='unhatch'){demo.hatched=false;}
  renderDemo();
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const dd=t.closest('[data-d]');
  if(dd){if(!dd.disabled)demoAct(dd.dataset.d);return;}
  if(t.id==='bDemo'){showDemo(t.dataset.from);return;}
  const hc=t.closest('#hand .card');
  if(hc&&G){
    const c=G.players[0].hand.find(x=>x.id===hc.dataset.cid);
    $('#info').textContent=infoOf(c);
    if(!humanTurn())return;
    ui.sel=ui.sel&&ui.sel.id===c.id?null:c;ui.tgt=null;ac();render();return;
  }
  const sc=t.closest('#system .card');
  if(sc&&G){
    const i=+sc.dataset.i;$('#info').textContent=infoOf(G.system[i].card);
    if(humanTurn()&&ui.sel&&ui.sel.kind==='perturb'){ui.tgt=i;render();}
    return;
  }
  const pb=t.closest('.pbtn');
  if(pb&&!pb.disabled){humanAct(ui.acts[+pb.dataset.a]);return;}
  if(t.id==='bHint'){ui.hints=!ui.hints;ui.hint=null;render();return;}
  if(t.id==='bShowHint'){
    const hn=getHint();if(!hn)return;
    ui.sel=G.players[0].hand.find(x=>x.id===hn.a.cardId)||null;
    ui.tgt=ui.sel&&ui.sel.kind==='perturb'&&hn.a.idx!==undefined?hn.a.idx:null;
    ac();render();
    const pn=$('#panel');if(pn&&pn.scrollIntoView)pn.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  if(t.id==='bDiscard'){humanAct({type:'discard',cardId:ui.sel.id});return;}
  if(t.id==='bCancel'){ui.sel=null;ui.tgt=null;render();return;}
  if(t.id==='bStart'){ac();startGame();return;}
  if(t.id==='bAgain'){startGame();return;}
  if(t.id==='bRules2'){showRules(true);return;}
  const seg=t.closest('#sBots button');if(seg){ui.bots=+seg.dataset.v;showStart();return;}
  const sd=t.closest('#sDiff button');if(sd){ui.diff=sd.dataset.v;showStart();return;}
});
document.addEventListener('mouseover',e=>{
  const d=e.target.closest('[data-info]');
  if(d)$('#info').textContent=d.dataset.info;
});
$('#bRules').onclick=()=>showRules(false);
$('#bNew').onclick=()=>{ui.busy=true;showStart();};
$('#bSound').onclick=()=>{ui.sound=!ui.sound;render();};
$('#info').textContent='Наведите курсор на карту или связь, чтобы увидеть подсказку.';
showDemo('start');
/*UI_END*/
</script>
</body>
</html>
