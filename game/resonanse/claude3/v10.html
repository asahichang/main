/* ---------- хэш-цепочка журнала ----------
   h0 = SHA256(HASH_VER | salt | начальные условия), h_i = SHA256(h_{i-1} | n | раунд | вид | текст | очки).
   salt — отдельная переменная: window.RESONANCE_SALT (или resonanceSetSalt(s)); позже её можно получать с сервера. */
const HASH_VER=1;
let HASH_SALT=(typeof window!=='undefined'&&window.RESONANCE_SALT)||'';
function resonanceSetSalt(s){HASH_SALT=String(s||'');}
if(typeof window!=='undefined')window.resonanceSetSalt=resonanceSetSalt;
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);
  m.set(b);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Array(64),R=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),c=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+a+w[i-7]+c)|0;}
    let [a,bb,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&bb)^(a&c)^(bb&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    h=[h[0]+a,h[1]+bb,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x|0);
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function logInit(){
  const init=JSON.stringify([HASH_VER,HASH_SALT,ui.gid,G.diff||ui.diff,G.players.map(p=>[p.name,p.isBot?1:0]),G.bodies[0].card.name,G.deck.length]);
  ui.hs={n:0,h:sha256(init),h0:null};ui.hs.h0=ui.hs.h;
}
function logAdd(e){
  const hs=ui.hs;hs.n++;
  e.n=hs.n;e.sc=G.players.map(p=>p.score).join(',');
  e.h=hs.h=sha256(hs.h+'|'+JSON.stringify([e.n,e.round===undefined?null:e.round,e.kind||'',e.text,e.sc]));
  ui.log.unshift(e);
}
function logFp(){return ui.hs?ui.hs.h:'';}
function logChain(){return {ver:HASH_VER,salt:HASH_SALT,genesis:ui.hs&&ui.hs.h0,head:logFp(),steps:ui.log.slice().reverse().map(l=>({n:l.n,round:l.round===undefined?null:l.round,kind:l.kind||'',text:l.text,sc:l.sc,h:l.h}))};}
if(typeof window!=='undefined')window.resonanceLogChain=()=>logChain();

function handleEvents(evs,ownMove){
  for(const e of evs){
    logAdd({text:e.text,kind:e.kind,round:G.round});
    if(e.kind==='place'){
      const b=bodyByUid(G,e.uid);
      if(b){ui.last=e.uid;addFloater(b.x,b.y,'+'+e.gained);soundPlace(b);showBody(b);}
      if(!ownMove)toast(e.text);
    }else if(e.kind==='perturb'){
      const b=bodyByUid(G,e.uid);
      if(b&&e.gained>0){addFloater(b.x,b.y,'+'+e.gained);tone(660,0,0.4,0.1);}
      if(!ownMove)toast(e.text);
    }else if(e.kind==='eject'){
      if(e.body){addFading(e.body);if(e.owner!==null)addFloater(e.body.x,e.body.y,'−'+PENALTY,true);}
      soundEject();toast(e.text,true);
    }else if(e.kind==='hatch'||e.kind==='discard'){
      if(!ownMove)toast(e.text);
    }else if(e.kind==='laplace'){
      const u=e.uids.slice();
      fxSchedule(()=>{if(G.over)return;fxBurst(u,'#7be0ff');fxBanner('lap','РЕЗОНАНС ЛАПЛАСА','+'+LAPLACE_BONUS,esc(namesOf(u))+' (ход: '+esc(G.players[e.by].name)+')');chordTones(u,'lap');});
    }else if(e.kind==='chain'){
      const u=e.uids.slice(),by=e.by,r=(()=>{const c=(G.chains||[]).find(c=>c.uids.join()===e.uids.join());return c?c.round+2:'';})();
      fxSchedule(()=>{if(G.over)return;fxBurst(u,'#ffd34d');fxBanner('pc','ПЛАНЕТНАЯ ЦЕПОЧКА','1 · 2 · 4 · 8',esc(G.players[by].name)+' победит, если цепочка простоит до конца раунда '+r);chordTones(u,'pc');});
    }else if(e.kind==='chainwin'){
      const u=(e.uids||[]).slice(),by=e.by;
      fxSchedule(()=>{fxBurst(u,'#ffd34d');fxConfetti();fxBanner('win','ПОБЕДА',esc(G.players[by].name),'Планетная цепочка простояла два раунда');chordTones(u,'pc');});
    }else if(e.kind==='chainbreak'){
      if(!G.over)toast(e.text,true);
    }else if(['trade','overload','steal','eclipse','damper','reboot','beacon','cash','skip','spend','quanta','shield'].includes(e.kind)){
      if(e.kind==='quanta'){const g=e.gain[me().id];if(g&&!ownMove)toast('◈ +'+g+' за стабильные резонансы');}

function usedChars(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=k.length+(localStorage.getItem(k)||'').length;}}catch(e){}return n;}
const kb=n=>n<1024?n+' Б':(n/1024<100?(n/1024).toFixed(1):Math.round(n/1024))+' КБ';
function listSaves(){
  const out=[];
  try{for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);if(!k||k.indexOf(SAVE_KEY)!==0)continue;
    const raw=localStorage.getItem(k)||'';let rec=null;
    try{rec=JSON.parse(raw);if(!rec||!rec.G||rec.fmt!=='resonance-save')rec=null;}catch(e){}
    out.push({id:k.slice(SAVE_KEY.length),raw,size:k.length+raw.length,rec});
  }}catch(e){}
  return out.sort((a,b)=>((b.rec&&b.rec.savedAt)||0)-((a.rec&&a.rec.savedAt)||0));
}

async function advance(){
  const gid=ui.gid;
  ui.busy=true;render();
  while(!G.over){
    const p=G.players[G.cur];
    if(!p.hand.length){logAdd({text:p.name+': карт нет, ход пропущен',round:G.round});handleEvents(finishTurn(G),true);render();await sleep(300);if(gid!==ui.gid)return;continue;}
    if(!p.isBot)break;
    await sleep(1000);
    if(gid!==ui.gid)return;
    const fs=botFreeShift(G);
    if(fs){const rs=applyFreeShift(G,fs);if(rs.ok){handleEvents(rs.events,false);render();await sleep(750);if(gid!==ui.gid)return;}}
    const a=botChoose(G);
    let r=applyAction(G,a);
    if(!r.ok){r=applyAction(G,{type:'discard',cardId:p.hand[0].id});}
    handleEvents(r.events,false);
    handleEvents(finishTurn(G),false);
    render();
  }
  ui.busy=false;
  if(G.over){ui.tEnd=Date.now();render();endModal();return;}
  if(multi()&&!curP().isBot){handoffModal();return;}
  render();
}

function selectCard(c){
  if(!humanTurn()||ui.hide)return;
  if(ui.ampCard){
    if(c.id===ui.ampCard.id){resetSel();render();return;}
    if(c.kind==='body'){
      if(ui.sel&&ui.sel.id===c.id){ui.sel=null;ui.mode='amppick';ui.cell=null;}
      else{ui.sel=c;ui.mode='place';ui.cell=null;}
      ac();render();return;

  if(c.kind==='perturb'&&c.fx==='amp'){ui.ampCard=c;ui.mode='amppick';ac();render();return;}

}

    case 'hintsw':ui.hints=!ui.hints;menuModal();render();break;
    case 'factsw':ui.noFacts=!ui.noFacts;if(ui.noFacts)hideFact();break;
    case 'factsw2':ui.noFacts=!ui.noFacts;if(ui.noFacts)hideFact();menuModal();break;
    case 'factx':hideFact();break;
    case 'factoff':ui.noFacts=true;hideFact();toast('Факты отключены. Включить снова можно в меню');break;
    case 'facts':factsModal();break;

function setupEvents(){
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='svName'){e.preventDefault();const b=document.querySelector('[data-act="svgo"]');if(b)b.click();}if(e.key==='Enter'&&e.target&&e.target.id==='nameIn'){e.preventDefault();const b=document.querySelector('[data-act="namenext"]');if(b)b.click();}});
  document.addEventListener('click',e=>{
    const t=e.target;
    if(!t.closest('#dlm')&&!t.closest('#bDl'))dlClose();
    const ac_=t.closest('[data-act]');
    if(ac_){onAct(ac_);return;}
    const dm=t.closest('[data-demo]');
    if(dm){if(!dm.disabled)demoAct(dm.dataset.demo);return;}
    const ab=t.closest('[data-a]');
    if(ab&&!ab.disabled){
      const a=ui.acts[+ab.dataset.a];
      if(a){if(a.type==='freeshift')humanFreeShift(a);else if(a.type==='spend')humanSpend(a);else humanAct(a);}
      return;
    }
    if(t.id==='modal'&&t.dataset.lock!=='1'){closeModal();return;}
    const hc=t.closest('.hc');
    if(hc&&G){const c=me().hand.find(x=>x.id===hc.dataset.cid);if(c){if(hc._lp){hc._lp=false;return;}selectCard(c);}return;}
    const gh=t.closest('.gh');
    if(gh){onCell(+gh.dataset.x,+gh.dataset.y);return;}
    const lk=t.closest('.lk');
    if(lk&&G){const a=bodyByUid(G,lk.dataset.la),b=bodyByUid(G,lk.dataset.lb);if(a&&b)openModal(linkInfoModal(a,b));return;}
    const fb=t.closest('.fb');
    if(fb&&G&&!fb.classList.contains('out')&&fb.dataset.uid!=='preview'){onBody(fb.dataset.uid);return;}
  });
  /* долгое нажатие на карту в руке открывает описание */
  document.addEventListener('pointerdown',e=>{
    const hc=e.target.closest('.hc');if(!hc||!G)return;
    hc._lp=false;
    const t0=setTimeout(()=>{const c=me().hand.find(x=>x.id===hc.dataset.cid);if(c){hc._lp=true;openModal(cardInfo(c,null));}},520);
    const clr=()=>{clearTimeout(t0);document.removeEventListener('pointerup',clr);document.removeEventListener('pointermove',mv);};
    const sx=e.clientX,sy=e.clientY;
    const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8)clr();};
    document.addEventListener('pointerup',clr);document.addEventListener('pointermove',mv);
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').dataset.lock!=='1')closeModal();});
  window.addEventListener('resize',()=>{if(G&&!ui.userView&&G.bodies.length<=1)centerOn(G.bodies[0]);});
}

function stageHTML(bodies,o){
  o=o||{};

  for(const b of bodies){mnx=Math.min(mnx,b.x);mny=Math.min(mny,b.y);mxx=Math.max(mxx,b.x);mxy=Math.max(mxy,b.y);}
  const bs=bodies.map(b=>Object.assign({},b,{x:b.x-mnx,y:b.y-mny}));
  const w=(mxx-mnx)*SX+CW,h=(mxy-mny)*SY+CH;
  const avail=Math.min(window.innerWidth-56,560),sc=Math.min(o.max||.8,avail/w);
  const st={bodies:bs,loads:o.loads||{},zone:o.zone||[],players:DEMO_PL};
  return `<div class="stage" style="width:${Math.round(w*sc)}px;height:${Math.round(h*sc)}px"><div class="sw" style="width:${w}px;height:${h}px;transform:scale(${sc})">${worldHTML(st,{players:DEMO_PL})}</div></div>`;
}

let jAnim=0;
function jupiterRun(){
  const cancel=()=>{if(jAnim){cancelAnimationFrame(jAnim);jAnim=0;}};
  cancel();
  if(!document.getElementById('jv'))return;
  const ms=[0,1,2].map(i=>document.getElementById('jm'+i)),ts=[0,1,2].map(i=>document.getElementById('jt'+i)),ns=[0,1,2].map(i=>document.getElementById('jn'+i));
  const MR=[11,11,12.5],mult=[4,2,1];
  let last=performance.now(),hold=0;
  const tick=now=>{
    if(!document.getElementById('jv')){jAnim=0;return;}
    const dt=(now-last)/1000;last=now;
    if(!demo.jpause){
      if(hold>0){hold-=dt;if(hold<=0){demo.jt=0;hold=0;}}
      else{demo.jt+=dt;if(demo.jt>=JUP_SEC){demo.jt=JUP_SEC;hold=2;}}  /* один цикл Лапласа: Ио 4, Европа 2, Ганимед 1 — затем сброс */
    }
    const g=demo.jt/JUP_SEC*Math.PI*2;
    ms.forEach((m,i)=>{
      const a=g*mult[i],x=JC+JUP_R[i]*Math.cos(a),y=JC+JUP_R[i]*Math.sin(a);
      m.setAttribute('cx',x.toFixed(2));m.setAttribute('cy',y.toFixed(2));
      ts[i].setAttribute('x',x.toFixed(2));ts[i].setAttribute('y',y.toFixed(2));
      ts[i].textContent=Math.floor(demo.jt/JUP_SEC*mult[i]+1e-6);
      const lx=Math.max(34,Math.min(284,x)),below=i===1?y-MR[i]-6<14||true:y-MR[i]-6<14,ly=below?y+MR[i]+15:y-MR[i]-6;
      ns[i].setAttribute('x',lx.toFixed(2));ns[i].setAttribute('y',ly.toFixed(2));
    });
    jAnim=requestAnimationFrame(tick);
  };
  jAnim=requestAnimationFrame(tick);
}

/* ---------- демо: пример музыки из файлов рядом с игрой ---------- */
const DEMO_INS=['flute','bell','clar','string','pluck','organ'];
function demoMusicStop(){const a=demo.aud;if(a){try{a.pause();}catch(e){}}demo.aud=null;}
function demoSync(){
  const a=demo.aud,b=document.getElementById('dBtn');
  if(b&&a){b.textContent=a.paused?'▶':'⏸';b.setAttribute('aria-label',a.paused?'Играть':'Пауза');}
}
function demoMusicInit(){
  const a=document.getElementById('dAud'),img=document.getElementById('dImg'),btn=document.getElementById('dBtn');
  if(!a||!img)return;
  demo.aud=a;
  const miss=()=>{const m=document.getElementById('dMiss');if(m)m.style.display='block';if(btn)btn.style.display='none';};
  a.addEventListener('error',miss);img.addEventListener('error',miss);
  a.addEventListener('play',demoSync);a.addEventListener('pause',demoSync);a.addEventListener('ended',()=>{demoSync();});
  const st={ni:0,fl:[],last:0};
  const buf=new Uint8Array(1024),idle=new Uint8Array(1024);
  const frame=()=>{
    const cv=document.getElementById('dwave');
    if(!cv||demo.aud!==a){try{a.pause();}catch(e){}return;}
    const tt=a.currentTime||0,playing=!a.paused&&!a.ended;
    if(tt<st.last-.3){st.ni=0;st.fl=[];}
    st.last=tt;
    if(playing||tt>0){
      while(st.ni<DEMO_NOTES.length&&DEMO_NOTES[st.ni][0]<=tt){
        const n=DEMO_NOTES[st.ni++];
        st.fl.push({t:n[0],x:n[4]<0?.5:.06+.88*Math.min(1,Math.max(0,(Math.log2(n[3])-Math.log2(100))/(Math.log2(1400)-Math.log2(100)))),c:n[4]<0?'#ffffff':FL_COL[DEMO_INS[n[4]]]});
      }
      st.fl=st.fl.filter(f=>tt-f.t<1);
    }
    const cx=cv.getContext('2d');
    if(playing){
      buf.fill(128);
      for(const n of DEMO_NOTES){
        if(n[4]<0||n[0]>tt||tt>n[0]+n[1])continue;
        const env=Math.exp(-(tt-n[0])/(n[1]*.35)),k=3+5*Math.log2(n[3]/100),amp=n[2]*.7*env*128;
        for(let i=0;i<1024;i++)buf[i]+=amp*Math.sin(6.2832*k*i/1024+n[0]*7);
      }
      drawWave(cx,cv.width,cv.height,null,buf,st.fl,tt,.2);
    }else{
      for(let i=0;i<1024;i++)idle[i]=a.paused&&tt>0?128:128+Math.sin(i/16+performance.now()/900)*4;
      drawWave(cx,cv.width,cv.height,null,idle,st.fl,tt,.25);
    }
    const ph=document.querySelector('.dph');
    if(ph){const g=DEMO_GEOM;if(tt>0&&!a.ended){ph.style.display='block';ph.style.left=(g.ML+(tt-g.T0)/(g.LEN-g.T0)*(g.W-g.ML-g.MR))/g.W*100+'%';}else ph.style.display='none';}
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function renderDemo(keep){
  demoMusicStop();
  const old=document.querySelector('#modal .mbox');
  const sc=keep&&old?old.scrollTop:0;
  const st=DEMO_STEPS[demo.step](),n=DEMO_STEPS.length,last=demo.step===n-1,game=demo.from==='game';
  openModal(`<h2>${st.title}</h2><div class="dots">${DEMO_STEPS.map((_,i)=>'<i class="'+(i===demo.step?'on':'')+'"></i>').join('')}</div><div class="mut" style="text-align:center;margin-bottom:6px">Демонстрация правил: шаг ${demo.step+1} из ${n} <span style="opacity:.65">· листайте стрелками ← →</span></div>${st.html}`+
    `<div class="row" style="justify-content:space-between;margin-top:14px">${dBtn('skip',game?'Закрыть':'Пропустить')}<span class="row" style="margin:0">${demo.step>0?dBtn('prev','← Назад'):''}${dBtn(last?'finish':'next',last?(game?'Закрыть':'К игре →'):'Дальше →',{pri:1})}</span></div>`,
    {lock:!game,keepScroll:sc});
  if(demo.step===0)jupiterRun();
  if(demo.step===DEMO_STEPS.length-1)demoMusicInit();
}
function showDemo(from){
  Object.assign(demo,{jt:0,jpause:false,step:0,from:from||'start',ph:0,loads:0,phB:1,ejected:false,layout:'row',same:false,hatched:false});
  renderDemo(false);
}
function demoAct(a){
  if(a==='next'){demo.step=Math.min(demo.step+1,DEMO_STEPS.length-1);demo.loads=0;demo.ejected=false;renderDemo(false);return;}
  if(a==='prev'){demo.step=Math.max(0,demo.step-1);renderDemo(false);return;}
  if(a==='skip'||a==='finish'){if(demo.from==='game')closeModal();else startModal();return;}
  if(a==='hear:ok'||a==='hear:bad'){
    ui.sound=true;const p=a==='hear:ok'?[1,2]:[5,7];
    tone(freqOf(p[0])*2,0,1.2,0.14);tone(freqOf(p[1])*2,0,1.2,0.14);return;
  }
  if(a==='mplay'){const au=demo.aud;if(au){if(au.paused){if(au.ended)au.currentTime=0;au.play().catch(()=>{});}else au.pause();}return;}
  if(a==='jpause'){demo.jpause=!demo.jpause;renderDemo(true);return;}
  if(a==='jreset'){demo.jt=0;renderDemo(true);return;}
  if(a==='rot')demo.ph=(demo.ph+1)%4;
  else if(a==='round'){demo.loads++;if(demo.loads>=3){demo.ejected=true;soundEject();}}
  else if(a==='rotB'){demo.phB=(demo.phB+1)%4;demo.loads=0;}
  else if(a==='resetLoad'){demo.loads=0;demo.phB=1;demo.ejected=false;}
  else if(a.startsWith('lay:'))demo.layout=a.slice(4);
  else if(a==='ph:same')demo.same=true;
  else if(a==='ph:diff')demo.same=false;
  else if(a==='hatch'){demo.hatched=true;soundEject();}
  else if(a==='unhatch')demo.hatched=false;
  renderDemo(true);
}

document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(!document.querySelector('#modal.on .dots'))return;
  const b=document.querySelector('#modal.on [data-demo="'+(e.key==='ArrowRight'?'next':'prev')+'"]');
  if(b&&!b.disabled){e.preventDefault();demoAct(e.key==='ArrowRight'?'next':'prev');}
});
