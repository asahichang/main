<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
  
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c24">
<title>Резонансы — карточная игра</title>
<meta name="description" content="Карточная игра о резонансах: в космосе, музыке и физике. Составляйте цепочки из планет, струн и маятников.">
<meta property="og:type" content="website">
<meta property="og:title" content="Резонансы — карточная игра">
<meta property="og:description" content="Карточная игра о резонансах: в космосе, музыке и физике. Составляйте цепочки из планет, струн и маятников.">
<meta property="og:image" content="resonance_game_preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="resonance_game_preview.png">
<style>
:root{--bg:#0a0c24;--panel:#13174a;--panel2:#1d2268;--gold:#e0b858;--ink:#eef0ff;--mut:#a3a9ff;--red:#ff6b5e;--green:#5fd18a;--yel:#f3c24a;--grey:#8a8fb5;--line:#ffffff26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.4;cursor:default}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(900px 480px at 10% -10%,#2a3190aa,transparent),radial-gradient(700px 420px at 100% 0,#0f4a5a77,transparent),var(--bg)}

/* верхняя панель */
#top{flex:none;padding:calc(6px + env(safe-area-inset-top)) 8px 5px;display:flex;flex-direction:column;gap:5px;background:#0a0c24ee;border-bottom:1px solid var(--line);z-index:6}
.tb1{display:flex;align-items:center;gap:6px}
.ib{width:38px;height:38px;flex:none;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.ib svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.pulse::after{content:'';position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--yel);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tb-title{flex:1;text-align:center;font-size:13px;color:var(--mut);letter-spacing:.4px;line-height:1.25}
.tb-title b{color:var(--gold);letter-spacing:2px;font-size:15px;display:block}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid transparent;border-radius:12px;padding:3px 10px;font-size:13px;white-space:nowrap}
.chip.act{border-color:var(--gold);box-shadow:0 0 12px #e0b85866}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip b{font-size:16px;min-width:20px;text-align:right}
.chip small{color:var(--mut);font-size:11px}
@media(max-width:600px){.chip{gap:4px;padding:3px 7px;font-size:12px}.chip b{font-size:15px;min-width:16px}.chip small{font-size:10px}.chip span{max-width:72px;overflow:hidden;text-overflow:ellipsis}}
.lk.pc .bd{box-shadow:0 0 0 3px #ffd34d,0 0 14px 2px #ffd34d;background:#4a3a00}
.lk.lap:not(.pc) .bd{box-shadow:0 0 0 2px #7be0ff,0 0 10px #7be0ff}

/* поле */
#fieldWrap{position:relative;flex:1;min-height:0}
#field,#field *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#field{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(#ffffff2a 1px,transparent 1.6px) 0 0/34px 34px,radial-gradient(#ffffff18 1px,transparent 1.6px) 17px 17px/34px 34px}
#field:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#wBodies,#floaters{position:absolute;left:0;top:0}
#floaters{pointer-events:none;z-index:20}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.fab{width:42px;height:42px;border-radius:12px;background:#141a5acc;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;font-weight:600;backdrop-filter:blur(4px);color:var(--ink)}
.fab svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#shiftFab{position:absolute;left:8px;bottom:58px;z-index:5;height:42px;padding:0 14px;border-radius:21px;background:#2a1f6ecc;border:1px solid #c79bf2;display:none;align-items:center;gap:8px;font-size:14px;font-weight:600;backdrop-filter:blur(4px)}
#shiftFab.on{display:flex}
#shiftFab.act{background:var(--gold);color:#241a05;border-color:var(--gold)}
#shiftFab b{background:#0006;border-radius:10px;padding:1px 8px}
#turn{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5;background:#141a5acc;border:1px solid var(--line);border-radius:16px;padding:5px 14px;font-size:13px;color:var(--mut);white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#turn.me{color:#241a05;background:var(--gold);border-color:var(--gold);font-weight:700}

/* связи */
.lk{position:absolute;display:grid;place-items:center;z-index:2}
.lk .ln{position:absolute;background:#ffffff40;border-radius:2px}
.lk.hz .ln{left:0;right:0;top:50%;height:3px;margin-top:-1.5px}
.lk.vt .ln{top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px}
.lk .bd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#1b2175;border:2px solid #fff6;line-height:1.05;cursor:pointer;box-shadow:0 2px 6px #0007}
.lk .bd em{font-style:normal;font-size:9px;font-weight:700}
.lk .bd strong{font-size:10px}
.lk.d0 .bd{border-color:var(--red);background:#4a1a2c}.lk.d0 .ln{background:var(--red)}
.lk.d2 .bd{border-color:var(--green);background:#134232}.lk.d2 .ln{background:var(--green)}
.lk.dn .bd{border-color:var(--yel)}.lk.dn .ln{background:var(--yel);opacity:.7}
.lk.dis .bd{width:22px;height:22px;opacity:.75;background:#262a62}.lk.dis .bd em{font-size:11px;color:var(--grey)}
.lk.chain .ln{background:var(--yel);opacity:1;box-shadow:0 0 10px var(--yel)}
.lk.lap .ln{background:#7be0ff;opacity:1;box-shadow:0 0 12px #7be0ff}
.lk.pc .ln{background:#ffd34d;opacity:1;box-shadow:0 0 16px 2px #ffd34d}
.lk.hz.lap .ln,.lk.hz.pc .ln{height:6px;margin-top:-3px}.lk.vt.lap .ln,.lk.vt.pc .ln{width:6px;margin-left:-3px}
.lk.hz.chain .ln{height:6px;margin-top:-3px}.lk.vt.chain .ln{width:6px;margin-left:-3px}
.lk .ld{position:absolute;font-size:8px;letter-spacing:1px;color:#ff8a7e;white-space:nowrap}
.lk.hz .ld{left:50%;top:calc(50% + 19px);transform:translateX(-50%)}
.lk.vt .ld{left:calc(50% + 21px);top:50%;transform:translateY(-50%)}

/* тела на поле */
.fb{position:absolute;z-index:3}
.fb .cd{position:absolute;left:0;top:0}
.fb.threat .cd{animation:thr 1s infinite}
@keyframes thr{50%{box-shadow:0 0 1.3em #ff6b5e,inset 0 0 0 .13em #ff6b5e,inset 0 0 0 .26em #0006}}
.fb.tg{cursor:pointer}
.fb.tg .cd{outline:.2em dashed #fff;outline-offset:.25em}
.fb.pick .cd{outline:.22em solid var(--gold);outline-offset:.25em;box-shadow:0 0 1.5em var(--gold)}
.fb.pv{opacity:.95}.fb.pv .cd{outline:.2em dashed var(--gold);outline-offset:.25em;animation:pv 1.1s infinite}
@keyframes pv{50%{box-shadow:0 0 1.4em var(--gold)}}
.fb.pop .cd{animation:pop .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fb.hnt .cd{outline:.2em solid var(--yel);outline-offset:.25em;animation:pv 1.1s infinite}
.fb .chn{position:absolute;right:-6px;top:-6px;z-index:4;background:var(--yel);color:#241a05;border-radius:10px;padding:0 6px;font-size:11px;font-weight:800;box-shadow:0 2px 6px #0008}
.fb.out{pointer-events:none;z-index:15}
.fb.out .cd{animation:out .9s forwards}
@keyframes out{0%{transform:none;opacity:1}100%{transform:translateY(-60px) scale(.6) rotate(12deg);opacity:0;filter:grayscale(1) brightness(1.6)}}
.gh{position:absolute;border:2px dashed #ffffff66;border-radius:12px;display:grid;place-items:center;color:#fff;background:#ffffff0c;cursor:pointer;z-index:1}
.gh span{font-size:22px;font-weight:700;opacity:.9}
.gh small{font-size:11px;display:block;font-weight:600;color:var(--yel);text-align:center}
.gh.sel{border-color:var(--gold);border-style:solid;background:#e0b85822;box-shadow:0 0 16px #e0b85866}
.gh.hnt{border-color:var(--yel);animation:pv 1.1s infinite}
.fl{position:absolute;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#ffe58a;text-shadow:0 2px 6px #000,0 0 14px #e0b858;animation:fl 1.4s forwards;white-space:nowrap}
.fl.neg{color:#ff8a7e;text-shadow:0 2px 6px #000,0 0 14px #ff6b5e}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

/* карта */
.cd{position:relative;width:7.5em;height:10.5em;border-radius:.8em;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;flex:none;box-shadow:0 .3em .8em #000a,inset 0 0 0 .13em var(--ac,#d9b45a),inset 0 0 0 .26em #0006}
.cd.space{--ac:#d9b45a;background:linear-gradient(#1b2064,#0a0d33)}
.cd.earth{--ac:#e8c378;background:linear-gradient(#17707a,#0a3038)}
.cd.pert{--ac:#c79bf2;background:linear-gradient(#52247c,#1f0d3c)}
.cd.hat{--ac:#ff9a8a;background:linear-gradient(#7a2230,#2d0a12)}
.cd-bg{position:absolute;inset:0;pointer-events:none}
.space .cd-bg{background:radial-gradient(circle at 25% 15%,#4a55d0aa,transparent 55%),radial-gradient(circle at 85% 95%,#8a45c877,transparent 50%),radial-gradient(#fff 0.05em,transparent .09em) 0 0/2.3em 2.9em,radial-gradient(#ffffffaa .04em,transparent .08em) .9em 1.4em/3.7em 3.1em}
.earth .cd-bg{background:radial-gradient(circle at 30% 18%,#5fe0d055,transparent 55%),linear-gradient(#ffffff14 .05em,transparent .05em) 0 0/1em 1em,linear-gradient(90deg,#ffffff14 .05em,transparent .05em) 0 0/1em 1em}
.pert .cd-bg{background:radial-gradient(circle at 50% 30%,#b06bff66,transparent 60%),repeating-linear-gradient(135deg,#ffffff0d 0 .4em,transparent .4em .8em)}
.hat .cd-bg{background:radial-gradient(circle at 50% 40%,#ff6b5e44,transparent 60%),repeating-linear-gradient(45deg,#00000033 0 .5em,transparent .5em 1em)}
.cd-per{position:absolute;left:.45em;top:.45em;width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff3b8,#e0b858 55%,#9c7424);color:#241a05;box-shadow:0 0 0 .12em #0007,0 .15em .4em #000a;z-index:2}
.cd-per b{font-size:1.3em;font-weight:900;line-height:1}
.cd-per.mod{outline:.16em solid var(--red);outline-offset:.05em}
.cd-dial{position:absolute;right:.4em;top:.4em;width:2.1em;height:2.1em;color:var(--ac);z-index:2}
.cd-dial svg{width:100%;height:100%;display:block}
.cd-art{position:absolute;left:.5em;right:.5em;top:2.1em;bottom:3.8em}
.cd-art svg{width:100%;height:100%;overflow:visible;display:block}
.cd-art.big{top:1.7em}
.cd-name{position:absolute;left:.375em;right:.375em;bottom:2.25em;height:2.4em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:.8em;line-height:1.08;text-shadow:0 .1em .25em #000}
.cd-note{position:absolute;left:50%;transform:translateX(-50%);bottom:.57em;height:1.7em;display:flex;align-items:center;font-size:.7em;white-space:nowrap;padding:0 1em;border-radius:1em;background:#0007;color:var(--ac);font-weight:600}
.cd-kind{position:absolute;top:.55em;left:0;right:0;text-align:center;font-size:.55em;letter-spacing:.25em;opacity:.85;color:var(--ac);font-weight:700}
.cd-own{position:absolute;left:0;right:0;bottom:0;height:.4em;background:var(--oc,transparent)}
.cd-sh{position:absolute;left:.35em;top:2.75em;width:1.5em;height:1.5em;z-index:3}
.cd-sh svg{width:100%;height:100%;display:block}

/* лист действий */
#sheet{flex:none;background:linear-gradient(#1a1f66,#10144a);border-top:2px solid var(--gold);padding:8px 10px 8px;display:none;max-height:46vh;overflow:auto;z-index:6}
#sheet.on{display:block;animation:up .18s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-h{display:flex;align-items:center;gap:8px}
.sh-h b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-h .sx{width:34px;height:34px;border-radius:10px;background:#ffffff14;display:grid;place-items:center;font-size:16px;flex:none}
.sh-t{font-size:13px;color:#d4d8ff;line-height:1.4;margin:6px 0 2px}
.sh-t b{color:#fff}
.ph-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 6px}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 6px}
.ph,.opt{border:2px solid var(--line);border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.ph{padding:5px 2px;min-height:72px}
.opt{padding:8px 14px;min-height:56px;flex:1;min-width:90px}
.ph svg,.opt svg{width:26px;height:26px;color:var(--gold)}
.ph b,.opt b{font-size:16px}
.ph small,.opt small{font-size:10.5px;color:var(--mut);text-align:center;line-height:1.1}
.ph.d0,.opt.d0{border-color:var(--red)}.ph.d0 small{color:#ffb0a8}
.ph.d2{border-color:var(--green)}.ph.d2 small{color:#a8f0c4}
.ph.dn,.opt.dn{border-color:var(--yel)}
.ph.on{background:#3b43b0;box-shadow:0 0 0 2px var(--gold)}
.rec::after{content:'★ совет';position:absolute;top:-9px;right:4px;background:var(--yel);color:#241a05;font-size:10px;font-weight:800;border-radius:8px;padding:0 6px}
.sh-f{display:flex;gap:8px;margin-top:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;min-height:42px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(#ecc96f,#c9a044);color:#241a05;font-weight:800;border:0;flex:1}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}

/* рука */
#handBar{flex:none;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#0a0c24ee;border-top:1px solid var(--line);display:flex;gap:5px;justify-content:center;align-items:flex-end;z-index:6;min-height:50px}
.hc{position:relative;flex:none;transition:transform .15s;cursor:pointer}
.hc.sel{transform:translateY(-12px);filter:drop-shadow(0 0 .6em var(--gold))}
.hc.sel .cd{box-shadow:0 .3em .8em #000a,inset 0 0 0 .2em var(--gold)}
.hc.hnt .cd{animation:pv 1.1s infinite;outline:.15em solid var(--yel)}
#handBar.off .hc{opacity:.65;cursor:default}
.hand-empty{color:var(--mut);font-size:13px;padding:14px}

/* окна */
#modal{position:fixed;inset:0;z-index:50;background:#05061ccc;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.mbox{position:relative;width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;background:linear-gradient(#1a1f66,#0e1140);border:2px solid var(--gold);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s}
@media(min-width:700px){#modal{align-items:center}.mbox{border-radius:20px;border-bottom:2px solid var(--gold)}}
.mbox h2{margin:0 36px 8px 0;color:var(--gold);letter-spacing:1.5px;font-size:19px}
.mbox p,.mbox li{font-size:14.5px;line-height:1.5;color:#dfe2ff}
.mbox ul{padding-left:20px;margin:6px 0}
.mx{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:10px;background:#ffffff18;font-size:17px;display:grid;place-items:center}
.mut{color:var(--mut);font-size:13px}
.seg{display:flex;gap:6px;margin:6px 0 12px}
.seg button{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;font-size:14px}
.seg button.on{border-color:var(--gold);background:#3a3f9a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.row.c{justify-content:center}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.menu .btn{text-align:left;font-size:15px;padding:13px 14px}
.note{margin:10px 0;padding:10px 12px;background:#ffffff10;border-left:3px solid var(--gold);border-radius:8px;font-size:14px;line-height:1.5;color:#e8eaff}
.note.red{border-color:var(--red)}.note.green{border-color:var(--green)}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff33}.dots i.on{background:var(--gold)}
.stage{position:relative;margin:8px auto;max-width:100%}
.sw{position:absolute;left:0;top:0;transform-origin:0 0}
.big-card{display:flex;justify-content:center;margin:6px 0 10px}
table.res{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
table.res td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.res tr.win td{color:var(--gold);font-weight:700}
.logl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.logl div{padding:6px 2px;border-bottom:1px solid #fff1;color:#d0d4ff;line-height:1.35}
.logl .rd{color:var(--yel)}.logl .ej{color:#ffb0a8}
.nb{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;background:#ffffff0d;margin:5px 0;font-size:13.5px;line-height:1.35}
.nb .pill{flex:none;border-radius:10px;padding:2px 8px;font-weight:800;font-size:13px;border:2px solid var(--yel);background:#1b2175}
.nb .pill.d0{border-color:var(--red)}.nb .pill.d2{border-color:var(--green)}.nb .pill.dis{border-color:#fff3;color:var(--grey);font-weight:500}
#toasts{position:fixed;left:0;right:0;top:calc(150px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:40}
.toast{background:#14194ff0;border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;max-width:92vw;animation:ti .25s;box-shadow:0 4px 14px #0008}
.toast.bad{border-color:var(--red)}
@keyframes ti{from{transform:translateY(-8px);opacity:0}}
@media(min-width:700px){.chip{padding:5px 14px}}

/* ===== v4: траты квантов, факты, эффекты, часы ===== */
#spendFab{position:absolute;left:8px;bottom:8px;z-index:5;height:42px;padding:0 14px;border-radius:21px;background:#0f3a52cc;border:1px solid #7be0ff;display:none;align-items:center;gap:8px;font-size:14px;font-weight:600;backdrop-filter:blur(4px);color:#dff6ff}
#spendFab.on{display:flex}
#spendFab b{background:#0006;border-radius:10px;padding:1px 8px;color:#7be0ff}
.clk{font-size:12px;color:#9fd8ff;font-weight:600;letter-spacing:0;margin-left:6px;font-variant-numeric:tabular-nums}
#handBar{overflow-x:auto;justify-content:safe center;scrollbar-width:none}
#handBar::-webkit-scrollbar{display:none}
.hand-hide{color:var(--mut);font-size:14px;padding:18px 10px;text-align:center;width:100%}
.hand-hide b{color:var(--gold)}
.chip.skip{opacity:.7}
.chip.skip::after{content:'⏸';font-size:12px}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:14.5px;cursor:pointer;color:#dfe2ff}
.chk input{width:22px;height:22px;accent-color:#f3c24a;flex:none}
.seg.sm button{padding:8px 4px;font-size:13px}

function freqOf(p){return 660/p;}
function noteOf(p){
  const f=freqOf(p),m=69+12*Math.log2(f/440),r=Math.round(m),cents=Math.round((m-r)*100);
  return {f,name:NOTE_NAMES[((r%12)+12)%12],oct:Math.floor(r/12)-1,cents,approx:Math.abs(cents)>12};
}
function noteText(p){const n=noteOf(p);return (n.approx?'≈ ':'')+n.name+n.oct+' · '+Math.round(n.f)+' Гц';}

function buildDeck(){
  let id=0;const d=[];
  BODIES.forEach(b=>d.push({id:'c'+(id++),kind:'body',name:b.n,period:b.p,theme:b.k,shape:b.s,color:b.c,fact:b.f}));
  PERTURBS.forEach(x=>{for(let i=0;i<x.c;i++)d.push({id:'c'+(id++),kind:'perturb',fx:x.fx,name:x.n,text:x.t});});
  HATCHES.forEach(x=>{for(let i=0;i<x.c;i++)d.push({id:'c'+(id++),kind:'hatch',hx:x.hx,hit:x.hit,name:x.n,
    text:'Выбрасывает все тела с периодом '+x.hit+' (кроме тел в фазе 2)'});});
  return d;
}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- геометрия поля ---------- */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function effP(b){return clamp(b.card.period+b.mod);}
function cellMap(bodies){const m=new Map();for(const b of bodies)m.set(b.x+','+b.y,b);return m;}
function pairsOf(bodies,m){
  m=m||cellMap(bodies);const ps=[];
  for(const a of bodies){
    const r=m.get((a.x+1)+','+a.y);if(r)ps.push([a,r]);
    const d=m.get(a.x+','+(a.y+1));if(d)ps.push([a,d]);
  }
  return ps;
}
function triplesOf(bodies,m){
  m=m||cellMap(bodies);const ts=[];
  for(const b of bodies){
    const l=m.get((b.x-1)+','+b.y),r=m.get((b.x+1)+','+b.y);if(l&&r)ts.push([l,b,r]);
    const u=m.get(b.x+','+(b.y-1)),d=m.get(b.x+','+(b.y+1));if(u&&d)ts.push([u,b,d]);
  }
  return ts;
}
function freeCells(st){
  if(!st.bodies.length)return [{x:0,y:0}];
  const m=cellMap(st.bodies),seen=new Set(),out=[];
  for(const b of st.bodies)for(const d of DIRS){
    const x=b.x+d[0],y=b.y+d[1],k=x+','+y;
    if(!m.has(k)&&!seen.has(k)){seen.add(k);out.push({x,y});}
  }
  return out;
}
function bodyByUid(st,uid){return st.bodies.find(b=>b.uid===uid)||null;}

/* ---------- очки ---------- */
function baseScore(pa,pb){const g=gcd(pa,pb),hi=Math.max(pa,pb)/g,lo=Math.min(pa,pb)/g;return BASE[hi+':'+lo]||0;}
function ratioText(pa,pb){const g=gcd(pa,pb);return (Math.max(pa,pb)/g)+':'+(Math.min(pa,pb)/g);}
function phaseDelta(x,y){return (((x.phase-y.phase)%4)+4)%4;}
function linkInfo(x,y){
  const base=baseScore(effP(x),effP(y)),d=phaseDelta(x,y);
  const score=!base?0:d===0?base*2:d===2?base+1:base;
  return {base,d,score,ratio:ratioText(effP(x),effP(y))};
}
function linkScore(x,y){return linkInfo(x,y).score;}
function chainBonus(x,y,z){
  const a=linkScore(x,y),b=linkScore(y,z);
  if(!a||!b)return 0;
  if(x.phase===y.phase&&y.phase===z.phase)return 0;
  return CHAIN_BONUS;
}
/* соседи тела по четырём направлениям */
function neighborsIn(b,m){
  const out=[];
  for(const d of DIRS){const n=m.get((b.x+d[0])+','+(b.y+d[1]));if(n)out.push(n);}
  return out;
}
/* резонанс Лапласа: три тела подряд (по прямой или с изгибом), периоды a : 2a : 4a, фазы не все одинаковые */
function laplaceTriples(bodies,m){
  m=m||cellMap(bodies);const out=[];
  for(const y of bodies){
    const ns=neighborsIn(y,m);
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
      const x=ns[i],z=ns[j],px=effP(x),py=effP(y),pz=effP(z);
      const ok=(px*2===py&&py*2===pz)||(pz*2===py&&py*2===px);
      if(ok&&!(x.phase===y.phase&&y.phase===z.phase))out.push([x,y,z]);
    }
  }
  return out;
}
/* планетная цепочка 1:2:4:8: четыре тела подряд (прямая или изгиб), периоды 1-2-4-8, у всех четырёх тел разные фазы (0, 1, 2, 3): все связи стабильны */
function findChains(bodies,m){
  m=m||cellMap(bodies);const out=[];
  for(const a of bodies){
    if(effP(a)!==1)continue;
    for(const b of neighborsIn(a,m)){
      if(effP(b)!==2)continue;
      for(const c of neighborsIn(b,m)){
        if(c===a||effP(c)!==4)continue;
        for(const d of neighborsIn(c,m)){
          if(d===b||effP(d)!==8)continue;
          if(new Set([a.phase,b.phase,c.phase,d.phase]).size===4)out.push([a,b,c,d]);
        }
      }
    }
  }
  return out;
}
function findChain(bodies,m){const r=findChains(bodies,m);return r.length?r[0]:null;}
function chainKey(c){return c.map(x=>x.uid).join('>');}
function ownChain(st,id){return (st.chains||[]).find(c=>c.by===id)||null;}
function totalScore(bodies){
  const m=cellMap(bodies);let t=0;
  for(const p of pairsOf(bodies,m))t+=linkScore(p[0],p[1]);
  for(const q of triplesOf(bodies,m))t+=chainBonus(q[0],q[1],q[2]);
  t+=LAPLACE_BONUS*laplaceTriples(bodies,m).length;
  return t;
}
/* ключи троек Лапласа: чтобы заметить новую тройку после хода */
function lapKey(t){return t[1].uid+':'+[t[0].uid,t[2].uid].sort().join(',');}
function lapKeys(st){return new Set(laplaceTriples(st.bodies).map(lapKey));}
function chainNames(st,uids){return uids.map(u=>{const b=bodyByUid(st,u);return b?'«'+b.card.name+'»':'?';}).join(' – ');}
function lapNew(st,before,ev,by){
  for(const t of laplaceTriples(st.bodies)){
    if(before.has(lapKey(t)))continue;
    ev.push({kind:'laplace',by,uids:t.map(x=>x.uid),text:'Резонанс Лапласа '+effP(t[0])+':'+effP(t[1])+':'+effP(t[2])+' ('+t.map(x=>'«'+x.card.name+'»').join(' – ')+')! '+pname(st,by)+': +'+LAPLACE_BONUS});
  }
}
/* цепочка достаётся тому, кто своим ходом её собрал; побеждает, если простоит два полных раунда после сборки (до конца раунда N+2) */
function updateChain(st,ev,by){
  st.chains=st.chains||[];
  const cur=findChains(st.bodies),keys=new Set(cur.map(chainKey)),keep=[];
  for(const c of st.chains){
    if(keys.has(c.key))keep.push(c);
    else ev.push({kind:'chainbreak',text:'Планетная цепочка ('+c.names.map(n=>'«'+n+'»').join(' – ')+') разрушена'});
  }
  st.chains=keep;
  for(const c of cur){
    const k=chainKey(c);
    if(st.chains.some(o=>o.key===k))continue;
    const ch={by,round:st.round,uids:c.map(x=>x.uid),names:c.map(x=>x.card.name),key:k,seq:st.chainSeq++};
    st.chains.push(ch);
    ev.push({kind:'chain',by,uids:ch.uids,text:'Планетная цепочка 1-2-4-8 ('+chainNames(st,ch.uids)+')! '+pname(st,by)+' победит, если она простоит до конца раунда '+(st.round+2)+'.'});
  }
  st.chain=st.chains.length?st.chains[0]:null;
}
function loadKey(a,b){return a.uid<b.uid?a.uid+'|'+b.uid:b.uid+'|'+a.uid;}
function isProtected(st,b){return b.phase===2;}
function shielded(st,b){return !!(st.shield&&st.shield.uids.includes(b.uid));}
function hatchHits(st,b){return !isProtected(st,b)&&!shielded(st,b)&&st.zone.some(c=>c.hx==='kirkwood'&&c.hit===effP(b));}
function pruneLoads(st){
  const nl={};
  for(const [a,b] of pairsOf(st.bodies)){
    const k=loadKey(a,b),inf=linkInfo(a,b);
    if(inf.base&&inf.d===0&&st.loads[k]>0)nl[k]=st.loads[k];
  }
  st.loads=nl;
}
function pname(st,id){const p=st.players[id];return p?p.name:'Система';}

/* оценка выкладывания без изменения состояния */
function evalPlacement(st,card,x,y,phase,owner){
  const before=totalScore(st.bodies);
  const nb={uid:'tmp',card,owner,phase,mod:0,x,y};
  st.bodies.push(nb);
  let gained=totalScore(st.bodies)-before;
  const known=new Set((st.chains||[]).map(c=>c.key)),makesChain=findChains(st.bodies).some(c=>!known.has(chainKey(c)));
  const m=cellMap(st.bodies),links=[];
  for(const d of DIRS){
    const n=m.get((x+d[0])+','+(y+d[1]));
    if(n&&n!==nb)links.push({other:n,dx:d[0],dy:d[1],inf:linkInfo(nb,n)});
  }
  st.bodies.pop();
  return {gained,links,threat:hatchHits(st,nb),makesChain};
}

/* ---------- выброс: штраф и возврат в колоду ---------- */
function returnToDeck(st,card){st.deck.splice(Math.floor(Math.random()*(st.deck.length+1)),0,card);}
function ejectBody(st,uid,reason,ev){
  const i=st.bodies.findIndex(b=>b.uid===uid);
  if(i<0)return;
  const b=st.bodies.splice(i,1)[0];
  returnToDeck(st,b.card);
  const nm='«'+b.card.name+'» (период '+effP(b)+')';
  let text=reason==='hatch'?'Щель Кирквуда выбрасывает '+nm
    :reason==='load'?'Орбита раскачана: '+nm+' выбрасывается из системы'
    :reason==='quanta'?'Тело '+nm+' убрано с поля за кванты'
    :'Солнечный ветер уносит '+nm;
  if(reason==='quanta')text+='. Карта вернулась в колоду';
  else if(b.owner!==null){
    st.players[b.owner].score-=PENALTY;
    text+='. '+pname(st,b.owner)+': −'+PENALTY+' очка, карта вернулась в колоду';
  }else text+='. Карта вернулась в колоду';
  ev.push({kind:'eject',reason,owner:reason==='quanta'?null:b.owner,uid:b.uid,text,body:{x:b.x,y:b.y,card:b.card,phase:b.phase,mod:b.mod,owner:b.owner}});
  pruneLoads(st);
}
function applyHatches(st,ev){
  for(;;){
    const b=st.bodies.find(x=>hatchHits(st,x));
    if(!b)break;
    ejectBody(st,b.uid,'hatch',ev);
  }
}
function endRound(st,ev){
  ev.push({kind:'round',text:'Конец раунда '+st.round});
  applyHatches(st,ev);
  const nl={};
  for(const [a,b] of pairsOf(st.bodies)){
    const k=loadKey(a,b),inf=linkInfo(a,b);
    if(inf.base&&inf.d===0)nl[k]=(st.loads[k]||0)+1;
  }
  st.loads=nl;
  for(;;){
    const hit=pairsOf(st.bodies).find(p=>(st.loads[loadKey(p[0],p[1])]||0)>=3&&!shielded(st,effP(p[0])>effP(p[1])?p[0]:p[1]));
    if(!hit)break;
    const [a,b]=hit;
    ejectBody(st,effP(a)>effP(b)?a.uid:b.uid,'load',ev);
  }
  updateChain(st,ev,st.cur);
  const ready=(st.chains||[]).filter(c=>st.round>c.round+1);
  if(ready.length){
    const c=ready[0];
    st.over=true;st.winner=c.by;
    ev.push({kind:'chainwin',by:c.by,uids:c.uids.slice(),text:'Планетная цепочка ('+c.names.map(n=>'«'+n+'»').join(' – ')+') простояла весь раунд: '+pname(st,c.by)+' побеждает!'+(ready.length>1?' (обе цепочки выстояли, побеждает собранная раньше)':'')});
  }
  /* кванты: +1 за каждый стабильный резонанс (связь без сближения) каждому владельцу его тел */
  const gain={};
  for(const [a,b] of pairsOf(st.bodies)){
    const inf=linkInfo(a,b);
    if(!inf.base||inf.d===0)continue;
    new Set([a.owner,b.owner]).forEach(o=>{if(o!==null)gain[o]=(gain[o]||0)+1;});
  }
  const parts=[];
  for(const id in gain){st.players[id].quanta+=gain[id];parts.push(st.players[id].name+' +'+gain[id]);}
  if(parts.length)ev.push({kind:'quanta',gain,text:'Кванты за стабильные резонансы: '+parts.join(', ')});
}

/* ---------- игра ---------- */
function newGame(opts){
  opts=opts||{};
  const rng=opts.rng||Math.random;
  const nh=Math.max(1,Math.min(4,opts.humans||1));
  let nb=opts.bots===undefined?1:opts.bots;
  nb=Math.max(0,Math.min(4-nh,nb));if(nh+nb<2)nb=1;
  const deck=shuffle(buildDeck(),rng);
  const names=['Вояджер','Кассини','Галилео'],cols=['#f3bd3c','#6ec6ff','#ff8a7a','#9be58f'];
  const players=[];
  const used=new Set();
  const hname=i=>{let n=String((opts.names&&opts.names[i])||'').replace(/\s+/g,' ').trim().slice(0,16)||('Игрок '+(i+1));
    if(used.has(n.toLowerCase()))n=n+' ('+(i+1)+')';used.add(n.toLowerCase());return n;};
  for(let i=0;i<nh;i++)players.push({id:i,name:hname(i),isBot:false,color:cols[i],hand:[],score:0,shifts:FREE_SHIFTS,quanta:0,removes:0,skip:false});
  for(let i=0;i<nb;i++)players.push({id:nh+i,name:names[i],isBot:true,color:cols[nh+i],hand:[],score:0,shifts:FREE_SHIFTS,quanta:0,removes:0,skip:false});
  const diff=opts.diff||'normal';
  const st={deck,discard:[],players,bodies:[],loads:{},zone:[],cur:0,round:1,turnsInRound:0,endLeft:null,over:false,winner:null,chain:null,chains:[],chainSeq:0,shield:null,bought:false,drew:false,uidN:0,diff,maxRounds:diff==='hard'?0:ROUNDS_LIMIT};
  const si=st.deck.findIndex(c=>c.kind==='body');
  const seed=st.deck.splice(si,1)[0];
  st.bodies.push({uid:'u'+(st.uidN++),card:seed,owner:null,phase:0,mod:0,x:0,y:0});
  for(const p of players)for(let i=0;i<HAND_N;i++)p.hand.push(st.deck.pop());
  return st;
}

function fail(msg){return {ok:false,msg,events:[],gained:0};}
function applyAction(st,a){
  const p=st.players[st.cur],ci=p.hand.findIndex(c=>c.id===a.cardId);
  if(ci<0)return fail('Нет такой карты');
  const card=p.hand[ci],ev=[],bs=st.bodies,before=totalScore(bs),lap0=lapKeys(st);
  let gained=0;
  if(a.type==='discard'){
    p.hand.splice(ci,1);st.discard.push(card);
    ev.push({kind:'discard',text:p.name+' сбрасывает «'+card.name+'» и пропускает ход'});
    return {ok:true,events:ev,gained:0};
  }
  if(a.type==='body'){
    if(card.kind!=='body')return fail('Это не тело');
    if(!freeCells(st).some(c=>c.x===a.x&&c.y===a.y))return fail('Сюда класть нельзя');
    p.hand.splice(ci,1);
    const b={uid:'u'+(st.uidN++),card,owner:p.id,phase:((a.phase%4)+4)%4,mod:0,x:a.x,y:a.y};
    bs.push(b);
    gained=totalScore(bs)-before;
    let extra='';
    ev.push({kind:'place',uid:b.uid,gained,text:p.name+' кладёт «'+card.name+'» (период '+effP(b)+', фаза '+b.phase+'): +'+gained+extra});
  }else if(a.type==='tide'||a.type==='shift'||a.type==='wind'||a.type==='swap'){
    if(card.kind!=='perturb'||card.fx!==a.type)return fail('Карта не подходит');
    if(a.type==='swap'){
      const x=bodyByUid(st,a.a),y=bodyByUid(st,a.b);
      if(!x||!y||Math.abs(x.x-y.x)+Math.abs(x.y-y.y)!==1)return fail('Нужны два соседних тела');
      if(shielded(st,x)||shielded(st,y))return fail('Цепочка под защитой');
      p.hand.splice(ci,1);st.discard.push(card);
      const tx=x.x,ty=x.y;x.x=y.x;x.y=y.y;y.x=tx;y.y=ty;
      gained=Math.max(0,totalScore(bs)-before);
      ev.push({kind:'perturb',uid:x.uid,gained,text:p.name+' меняет местами «'+x.card.name+'» и «'+y.card.name+'»: +'+gained});
    }else{
      const b=bodyByUid(st,a.uid);
      if(!b)return fail('Нет цели');
      if(shielded(st,b))return fail('Цепочка под защитой');
      if(a.type==='tide'){
        const e=effP(b),ne=clamp(e+a.dir);
        if(ne===e)return fail('Период на границе');
        p.hand.splice(ci,1);st.discard.push(card);
        b.mod=ne-b.card.period;
        gained=Math.max(0,totalScore(bs)-before);
        ev.push({kind:'perturb',uid:b.uid,gained,text:p.name+': «'+b.card.name+'» период '+e+' → '+ne+': +'+gained});
      }else if(a.type==='shift'){
        p.hand.splice(ci,1);st.discard.push(card);
        const o=b.phase;b.phase=(((o+a.dir)%4)+4)%4;
        gained=Math.max(0,totalScore(bs)-before);
        ev.push({kind:'perturb',uid:b.uid,gained,text:p.name+': «'+b.card.name+'» фаза '+o+' → '+b.phase+': +'+gained});
      }else{
        if(bs.length<2)return fail('Нельзя убрать единственное тело');
        p.hand.splice(ci,1);st.discard.push(card);
        ejectBody(st,b.uid,'wind',ev);
      }
    }
  }else if(a.type==='hatch'){
    if(card.kind!=='hatch')return fail('Это не Люк');
    p.hand.splice(ci,1);
    st.zone.push(card);
    if(st.zone.length>2)st.discard.push(st.zone.shift());
    ev.push({kind:'hatch',text:p.name+' кладёт в зону Кирквуда «'+card.name+'»'});
    applyHatches(st,ev);
  }else if(a.type==='doppler'){
    if(card.kind!=='perturb'||card.fx!=='doppler')return fail('Карта не подходит');
    const b=bodyByUid(st,a.uid);if(!b)return fail('Нет цели');
    if(shielded(st,b))return fail('Цепочка под защитой');
    const e=effP(b),ne=clamp(e+(a.dir<0?-2:2));
    if(ne===e)return fail('Период на границе');
    p.hand.splice(ci,1);st.discard.push(card);
    b.mod=ne-b.card.period;
    gained=Math.max(0,totalScore(bs)-before);
    ev.push({kind:'perturb',uid:b.uid,gained,text:p.name+': эффект Доплера, «'+b.card.name+'» период '+e+' → '+ne+': +'+gained});
  }else if(a.type==='trade'||a.type==='overload'||a.type==='steal'||a.type==='eclipse'){
    if(card.kind!=='perturb'||card.fx!==a.type)return fail('Карта не подходит');
    const t=st.players[a.target];
    if(!t||t.id===p.id)return fail('Нужен соперник');
    if(a.type==='overload'){
      const keys=[];
      for(const [x,y] of pairsOf(bs)){
        if(x.owner!==t.id&&y.owner!==t.id)continue;
        const inf=linkInfo(x,y);
        if(inf.base&&inf.d===0)keys.push(loadKey(x,y));
      }
      if(!keys.length)return fail('У соперника нет нестабильных резонансов');
      p.hand.splice(ci,1);st.discard.push(card);
      for(const k of keys)st.loads[k]=(st.loads[k]||0)+1;
      ev.push({kind:'overload',text:p.name+' перегружает '+t.name+': +1 жетон на '+keys.length+' нестабильных резонансах'});
    }else if(a.type==='steal'){
      const n=Math.min(STEAL_N,t.quanta);
      if(n<=0)return fail('У соперника нет квантов');
      p.hand.splice(ci,1);st.discard.push(card);
      t.quanta-=n;p.quanta+=n;
      ev.push({kind:'steal',text:p.name+' крадёт у '+t.name+' '+kv(n)});
    }else if(a.type==='eclipse'){
      if(t.skip)return fail('Этот игрок уже пропускает ход');
      p.hand.splice(ci,1);st.discard.push(card);
      t.skip=true;
      ev.push({kind:'eclipse',text:t.name+' пропустит следующий ход (Затмение от '+p.name+')'});
    }else{
      p.hand.splice(ci,1);st.discard.push(card);
      const h=p.hand;p.hand=t.hand;t.hand=h;
      ev.push({kind:'trade',text:p.name+' меняется руками с '+t.name});
    }
  }else if(a.type==='shield'){
    if(card.kind!=='perturb'||card.fx!=='shield')return fail('Карта не подходит');
    const oc=ownChain(st,p.id);
    if(!oc)return fail('У вас нет планетной цепочки');
    if(st.shield)return fail('Цепочка уже под защитой');
    p.hand.splice(ci,1);st.discard.push(card);
    st.shield={by:p.id,uids:oc.uids.slice()};
    ev.push({kind:'shield',text:p.name+' защищает цепочку ('+oc.names.map(n=>'«'+n+'»').join(' – ')+') до своего следующего хода'});
  }else if(a.type==='damper'){
    if(card.kind!=='perturb'||card.fx!=='damper')return fail('Карта не подходит');
    const keys=[];
    for(const [x,y] of pairsOf(bs)){
      if(x.owner!==p.id&&y.owner!==p.id)continue;
      const k=loadKey(x,y);
      if(st.loads[k]>0)keys.push(k);
    }
    if(!keys.length)return fail('Нет жетонов на ваших резонансах');
    p.hand.splice(ci,1);st.discard.push(card);
    for(const k of keys)delete st.loads[k];
    ev.push({kind:'damper',text:p.name+' гасит колебания: жетоны сняты с '+keys.length+' резонансов'});
  }else if(a.type==='amp'){
    if(card.kind!=='perturb'||card.fx!=='amp')return fail('Карта не подходит');
    const body=p.hand.find(c=>c.id===a.bodyId);
    if(!body||body.kind!=='body')return fail('Нужна карта тела');
    if(!freeCells(st).some(c=>c.x===a.x&&c.y===a.y))return fail('Сюда класть нельзя');
    p.hand=p.hand.filter(c=>c.id!==card.id&&c.id!==body.id);st.discard.push(card);
    const b={uid:'u'+(st.uidN++),card:body,owner:p.id,phase:((a.phase%4)+4)%4,mod:0,x:a.x,y:a.y};
    bs.push(b);
    let g=totalScore(bs)-before;
    gained=g*2;
    ev.push({kind:'place',uid:b.uid,gained,text:p.name+' с «Усилителем» кладёт «'+body.name+'» (период '+effP(b)+', фаза '+b.phase+'): +'+g+' ×2 = +'+gained});
  }else if(a.type==='reboot'){
    if(card.kind!=='perturb'||card.fx!=='reboot')return fail('Карта не подходит');
    p.hand.splice(ci,1);st.discard.push(card);
    const n=p.hand.length;
    for(const c of p.hand)st.discard.push(c);
    p.hand=[];
    for(let i=0;i<n&&st.deck.length;i++)p.hand.push(st.deck.pop());
    ev.push({kind:'reboot',text:p.name+' перезагружает руку: '+n+' карт заменены'});
  }else if(a.type==='beacon'){
    if(card.kind!=='perturb'||card.fx!=='beacon')return fail('Карта не подходит');
    const ix=st.deck.findIndex(c=>c.id===a.pickId);
    if(ix<0)return fail('Такой карты нет в колоде');
    p.hand.splice(ci,1);st.discard.push(card);
    const got=st.deck.splice(ix,1)[0];p.hand.push(got);
    ev.push({kind:'beacon',text:p.name+' зажигает «Маяк» и берёт из колоды «'+got.name+'»'});
  }else if(a.type==='cash'){
    if(card.kind!=='perturb'||card.fx!=='cash')return fail('Карта не подходит');
    if(p.quanta<CASH_COST)return fail('Нужно '+kv(CASH_COST));
    p.hand.splice(ci,1);st.discard.push(card);
    p.quanta-=CASH_COST;gained=CASH_POINTS;
    ev.push({kind:'cash',gained,text:p.name+' меняет '+kv(CASH_COST)+' на '+CASH_POINTS+' очков'});
  }else return fail('Неизвестное действие');
  pruneLoads(st);
  lapNew(st,lap0,ev,p.id);
  updateChain(st,ev,p.id);
  p.score+=gained;
  return {ok:true,events:ev,gained};
}
/* сдвиг фазы без карты и без траты хода: бесплатный (3 за игру) или купленный за кванты (a.paid) */
function applyFreeShift(st,a){
  const p=st.players[st.cur];
  if(a.paid){if(st.bought)return fail('За ход можно сделать только одну покупку за кванты');if(p.quanta<COST_SHIFT)return fail('Не хватает квантов');}
  else if(p.shifts<=0)return fail('Бесплатные сдвиги закончились');
  const b=bodyByUid(st,a.uid);
  if(!b)return fail('Нет цели');
  if(!a.paid&&b.owner!==p.id)return fail('Бесплатно можно сдвигать только свои тела');
  if(shielded(st,b))return fail('Цепочка под защитой');
  const before=totalScore(st.bodies),lap0=lapKeys(st),o=b.phase;
  b.phase=(((o+a.dir)%4)+4)%4;
  const gained=Math.max(0,totalScore(st.bodies)-before);
  let how;
  if(a.paid){p.quanta-=COST_SHIFT;st.bought=true;how='за '+kv(COST_SHIFT);}
  else{p.shifts--;how='бесплатный сдвиг, осталось '+p.shifts;}
  p.score+=gained;pruneLoads(st);
  const ev=[{kind:'perturb',free:true,uid:b.uid,gained,text:p.name+' ('+how+'): «'+b.card.name+'» фаза '+o+' → '+b.phase+': +'+gained}];
  lapNew(st,lap0,ev,p.id);
  updateChain(st,ev,p.id);
  return {ok:true,gained,events:ev};
}
/* траты квантов: дополнительная карта (раз за ход) и удаление тела с поля (REMOVE_MAX раз за игру) */
function applySpend(st,a){
  if(st.bought)return fail('За ход можно сделать только одну покупку за кванты');
  const r=applySpend0(st,a);
  if(r.ok)st.bought=true;
  return r;
}
function applySpend0(st,a){
  const p=st.players[st.cur],ev=[];
  if(a.kind==='draw'){
    if(st.drew)return fail('Дополнительную карту можно взять один раз за ход');
    if(p.quanta<COST_DRAW)return fail('Не хватает квантов');
    if(!st.deck.length)return fail('Колода пуста');
    p.quanta-=COST_DRAW;p.hand.push(st.deck.pop());st.drew=true;
    return {ok:true,gained:0,events:[{kind:'spend',text:p.name+' берёт дополнительную карту за '+kv(COST_DRAW)}]};
  }
  if(a.kind==='remove'){
    if((p.removes||0)>=REMOVE_MAX)return fail('Убрать тело можно '+REMOVE_MAX+' раза за игру');
    if(p.quanta<COST_REMOVE)return fail('Не хватает квантов');
    if(st.bodies.length<2)return fail('Нельзя убрать единственное тело');
    const b=bodyByUid(st,a.uid);if(!b)return fail('Нет цели');
    if(shielded(st,b))return fail('Цепочка под защитой');
    p.quanta-=COST_REMOVE;p.removes=(p.removes||0)+1;
    ejectBody(st,b.uid,'quanta',ev);
    updateChain(st,ev,p.id);
    return {ok:true,gained:0,events:ev};
  }
  if(a.kind==='tide'){
    if(p.quanta<COST_TIDE)return fail('Не хватает квантов');
    const b=bodyByUid(st,a.uid);if(!b)return fail('Нет цели');
    if(shielded(st,b))return fail('Цепочка под защитой');
    const d=a.dir>0?1:-1,np=b.card.period+b.mod+d;
    if(np<1||np>12)return fail('Период вне диапазона 1–12');
    p.quanta-=COST_TIDE;b.mod+=d;
    ev.push({kind:'spend',text:p.name+' покупает приливную силу: «'+b.card.name+'» теперь период '+effP(b)+' (−'+kv(COST_TIDE)+')'});
    applyHatches(st,ev);pruneLoads(st);updateChain(st,ev,p.id);
    return {ok:true,gained:0,events:ev};
  }
  if(a.kind==='shield'){
    if(p.quanta<COST_SHIELD)return fail('Не хватает квантов');
    const oc=ownChain(st,p.id);
    if(!oc)return fail('У вас нет планетной цепочки');
    if(st.shield)return fail('Цепочка уже под защитой');
    p.quanta-=COST_SHIELD;st.shield={by:p.id,uids:oc.uids.slice()};
    return {ok:true,gained:0,events:[{kind:'shield',text:p.name+' покупает защиту цепочки ('+oc.names.map(n=>'«'+n+'»').join(' – ')+') до своего следующего хода (−'+kv(COST_SHIELD)+')'}]};
  }
  if(a.kind==='clear'){
    if(p.quanta<COST_CLEAR)return fail('Не хватает квантов');
    if(!st.zone.length)return fail('Зона Кирквуда пуста');
    p.quanta-=COST_CLEAR;
    const n=st.zone.length;st.discard.push(...st.zone);st.zone=[];
    return {ok:true,gained:0,events:[{kind:'spend',text:p.name+' очищает зону Кирквуда ('+n+' шт.) за '+kv(COST_CLEAR)}]};
  }
  if(a.kind==='analyze'){
    if(p.quanta<COST_ANALYZE)return fail('Не хватает квантов');
    const t=st.players[a.target];if(!t||t.id===p.id)return fail('Нет цели');
    p.quanta-=COST_ANALYZE;
    return {ok:true,gained:0,info:analyzeOpp(st,t.id),events:[{kind:'spend',text:p.name+' анализирует стратегию: '+t.name+' (−'+kv(COST_ANALYZE)+')'}]};
  }
  return fail('Неизвестная трата');
}
/* анализ соперника: рука, ресурсы и вероятный следующий ход */
function analyzeOpp(st,id){
  const t=st.players[id],c=cloneState(st);
  c.cur=id;
  let guess='нет карт';
  if(t.hand.length){
    try{
      const a=botChoose(c);
      const card=t.hand.find(x=>x.id===a.cardId);
      guess=a.type==='discard'?'сбросит «'+(card?card.name:'карту')+'»':'сыграет «'+(card?card.name:'карту')+'»'+(a.type==='body'?' (период '+card.period+') в клетку '+a.x+','+a.y:'');
    }catch(e){guess='неясно';}
  }
  const mine=st.bodies.filter(b=>b.owner===id).length;
  const combos=[];
  const sets=[['Планетная цепочка 1-2-4-8',[1,2,4,8]],['Лаплас 1:2:4',[1,2,4]],['Лаплас 2:4:8',[2,4,8]],['Лаплас 3:6:12',[3,6,12]]];
  for(const [nm,per] of sets){
    const onT=[],inH=[],miss=[];
    for(const q of per){
      const b=st.bodies.find(x=>effP(x)===q&&!onT.some(y=>y.b===x));
      if(b){onT.push({b,q});continue;}
      const h=t.hand.find(x=>x.kind==='body'&&x.period===q&&!inH.some(y=>y.h===x));
      if(h)inH.push({h,q});else miss.push(q);
    }
    const have=onT.length+inH.length;
    if(have>=2&&miss.length<=per.length-2&&have<per.length+1&&(miss.length>0||inH.length>0)){
      combos.push(nm+': на поле '+(onT.map(x=>'«'+x.b.card.name+'» ('+x.q+')').join(', ')||'ничего')+'; в руке '+(inH.map(x=>'«'+x.h.name+'» ('+x.q+')').join(', ')||'ничего')+(miss.length?'; не хватает периодов: '+miss.join(', '):'; все периоды есть'));
    }
  }
  const useful=t.hand.filter(x=>x.kind==='perturb'&&['shield','steal','eclipse','overload','amp'].includes(x.fx)).map(x=>x.name);
  return {combos,useful,name:t.name,hand:t.hand.map(x=>x.name+(x.kind==='body'?' · п.'+x.period:'')),score:t.score,quanta:t.quanta,shifts:t.shifts,bodies:mine,guess};
}
function advanceSeat(st,ev){
  st.turnsInRound++;
  st.cur=(st.cur+1)%st.players.length;
  if(st.turnsInRound>=st.players.length){endRound(st,ev);st.round++;st.turnsInRound=0;}
  if(st.shield&&st.shield.by===st.cur){st.shield=null;ev.push({kind:'shield',text:'Защита цепочки закончилась'});}
}
function finishTurn(st){
  const ev=[],p=st.players[st.cur];
  while(p.hand.length<HAND_N&&st.deck.length)p.hand.push(st.deck.pop());
  pruneLoads(st);
  if(st.endLeft!==null)st.endLeft--;
  else if(!st.deck.length)st.endLeft=st.players.length;
  st.drew=false;st.bought=false;
  advanceSeat(st,ev);
  let guard=0;
  while(!st.over&&st.players[st.cur].skip&&guard++<8){
    const q=st.players[st.cur];q.skip=false;
    ev.push({kind:'skip',text:q.name+' пропускает ход (Затмение)'});
    if(st.endLeft!==null)st.endLeft--;
    advanceSeat(st,ev);
  }
  if(st.endLeft!==null&&st.endLeft<=0)st.over=true;
  if(st.round>(st.maxRounds||300))st.over=true;
  if(st.players.every(q=>!q.hand.length))st.over=true;
  return ev;
}
function cloneState(st){return JSON.parse(JSON.stringify(st));}

/* ---------- ходы, бот ---------- */
function legalActions(st){
  const p=st.players[st.cur],acts=[],seen=new Set(),bs=st.bodies,cells=freeCells(st);
  for(const c of p.hand){
    const key=c.kind+c.name;
    if(seen.has(key))continue;seen.add(key);
    if(c.kind==='body'){
      for(const cl of cells)for(let ph=0;ph<4;ph++)acts.push({type:'body',cardId:c.id,x:cl.x,y:cl.y,phase:ph});
    }else if(c.kind==='perturb'){
      if(c.fx==='tide'){for(const b of bs)for(const dir of [-1,1]){const e=effP(b);if(clamp(e+dir)!==e)acts.push({type:'tide',cardId:c.id,uid:b.uid,dir});}}

function botChoose(st,rng){

        for(const l of r.links)if(l.inf.base&&l.inf.d===0)risk+=1.6;

    if((st.chains||[]).some(c=>c.by!==me&&!(sim.chains||[]).some(o=>o.key===c.key)))v+=40;

const SHORT={beacon:'любая карта из колоды',shield:'защита цепочки',tide:'период ±1',shift:'фаза ±90°',wind:'убрать тело',swap:'поменять',trade:'обмен руками',overload:'жетоны сопернику',steal:'украсть кванты',eclipse:'пропуск хода',damper:'снять жетоны',doppler:'период ±2',amp:'очки ×2',reboot:'замена всех карт',cash:'кванты → очки'};
function shortOf(c){return c.kind==='perturb'?SHORT[c.fx]:'бьёт период '+c.hit;}
function noteShort(p){const n=noteOf(p);return (n.approx?'≈':'')+n.name+n.oct;}

function dialSVG(ph){
  const a=ph*Math.PI/2,x=15+9.5*Math.sin(a),y=15-9.5*Math.cos(a);
  return `<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12.5" fill="#0b0e36" stroke="currentColor" stroke-width="1.4"/><circle cx="15" cy="15" r="9.5" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="1 2.2"/><path d="M15 .6 l-2.8 3.8 h5.6z" fill="currentColor"/><line x1="15" y1="15" x2="${f1(x)}" y2="${f1(y)}" stroke="#fff" stroke-opacity=".5" stroke-width="1"/><circle cx="15" cy="15" r="2" fill="#f3c24a"/><circle cx="${f1(x)}" cy="${f1(y)}" r="3" fill="#fff"/></svg>`;
}
const SHIELD='<svg viewBox="0 0 24 24"><path d="M12 2 L21 5.5 V12 Q21 19 12 22 Q3 19 3 12 V5.5Z" fill="#17624a" stroke="#8ff0c0" stroke-width="1.6"/><path d="M8 12 L11 15 L16 9" fill="none" stroke="#e8fff4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* карта целиком */
function cardEl(c,o){
  o=o||{};const b=o.body,pl=o.players||[];
  const kind=c.kind,theme=kind==='body'?(c.theme==='earth'?'earth':'space'):(kind==='perturb'?'pert':'hat');
  const oc=b&&b.owner!=null&&pl[b.owner]?';--oc:'+pl[b.owner].color:'';
  let h=`<div class="cd ${theme}${o.cls?' '+o.cls:''}" style="font-size:${o.fs||13}px${oc}"${o.attrs?' '+o.attrs:''}><i class="cd-bg"></i>`;
  if(kind==='body'){
    const p=b?effP(b):c.period;
    h+=`<span class="cd-per${b&&b.mod?' mod':''}"><b>${p}</b></span>`;
    if(b)h+=`<span class="cd-dial">${dialSVG(b.phase)}</span>`;
    h+=`<div class="cd-art"><svg viewBox="0 0 100 100">${artBody(c)}</svg></div><div class="cd-name">${c.name}</div><div class="cd-note">♪ ${noteShort(p)}</div>`;
    if(b&&b.owner!=null)h+='<i class="cd-own"></i>';
    if(b&&o.state&&isProtected(o.state,b))h+=`<span class="cd-sh">${SHIELD}</span>`;
  }else{
    h+=`<span class="cd-kind">${kind==='perturb'?'ВОЗМУЩЕНИЕ':'ЛЮК'}</span><div class="cd-art big"><svg viewBox="0 0 100 100">${artPert(c)}</svg></div><div class="cd-name">${c.name}</div><div class="cd-note">${shortOf(c)}</div>`;
  }
  return h+'</div>';
}

let factN=0;
function pickFact(card){
  let list;
  if(card.kind==='body')list=FACTS[card.name];
  else if(card.kind==='perturb')list=FX_FACTS[card.fx];
  else list=FX_FACTS[card.hx];
  if(!list||!list.length)return null;
  return list[(factN++)%list.length];
}

/* ---------- звук ---------- */
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'&&!(ui.mp&&ui.mp.state==='pause'))AC.resume();
  return AC;
}
function tone(f,t,d,vol,type){
  if(!ui.sound)return;const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+(t||0);
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(d||0.7));
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+(d||0.7)+0.05);
}
function soundPlace(b){
  tone(freqOf(effP(b))*2,0,0.8,0.14);
  const m=cellMap(G.bodies);
  for(const d of DIRS){
    const n=m.get((b.x+d[0])+','+(b.y+d[1]));
    if(n){const f2=freqOf(effP(n))*2,ok=baseScore(effP(b),effP(n))>0;tone(ok?f2:f2*1.04,0,0.8,0.09);break;}
  }
}
function soundEject(){tone(90,0,0.5,0.2,'triangle');tone(65,0.08,0.5,0.15,'triangle');}

/* ---------- масштаб и перемещение поля ---------- */
function applyView(){$('#world').style.transform='translate('+V.tx+'px,'+V.ty+'px) scale('+V.s+')';}
function fieldSize(){const f=$('#field');return {w:f.clientWidth,h:f.clientHeight};}
function zoomAt(cx,cy,k){
  const ns=Math.max(.28,Math.min(2.4,V.s*k)),r=ns/V.s;
  V.tx=cx-(cx-V.tx)*r;V.ty=cy-(cy-V.ty)*r;V.s=ns;applyView();ui.userView=true;
}
function fitView(){
  const {w,h}=fieldSize();if(!w||!h||!G)return;
  const cells=G.bodies.length?G.bodies:[{x:0,y:0}];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of cells){x0=Math.min(x0,c.x*SX);y0=Math.min(y0,c.y*SY);x1=Math.max(x1,c.x*SX+CW);y1=Math.max(y1,c.y*SY+CH);}
  const pad=26,bw=x1-x0,bh=y1-y0;
  const s=Math.max(.28,Math.min((w-pad*2)/bw,(h-pad*2)/bh,1.05));
  V.s=s;V.tx=(w-bw*s)/2-x0*s;V.ty=(h-bh*s)/2-y0*s;applyView();ui.userView=false;
}
function ensureVisible(wx,wy,ww,wh){
  const {w,h}=fieldSize();if(!w||!h)return;
  const m=12,sx0=V.tx+wx*V.s,sy0=V.ty+wy*V.s,sx1=sx0+ww*V.s,sy1=sy0+wh*V.s;
  let dx=0,dy=0;
  if(sx1-sx0>w-2*m)dx=(w-(sx0+sx1))/2;else if(sx0<m)dx=m-sx0;else if(sx1>w-m)dx=w-m-sx1;
  if(sy1-sy0>h-2*m)dy=(h-(sy0+sy1))/2;else if(sy0<m)dy=m-sy0;else if(sy1>h-m)dy=h-m-sy1;
  if(dx||dy){V.tx+=dx;V.ty+=dy;applyView();}
}
function showBody(b){ensureVisible(b.x*SX,b.y*SY,CW,CH);}
function showCell(c){ensureVisible(c.x*SX,c.y*SY,CW,CH);}
function setupField(){
  const f=$('#field'),pts=new Map();
  let drag=null,pinch=null,moved=false;
  const two=()=>{const a=[...pts.values()];return {d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2};};
  f.addEventListener('selectstart',e=>e.preventDefault());f.addEventListener('dragstart',e=>e.preventDefault());
  f.addEventListener('pointerdown',e=>{
    try{const sl=getSelection();if(sl&&sl.rangeCount)sl.removeAllRanges();}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){moved=false;drag={x:e.clientX,y:e.clientY,tx:V.tx,ty:V.ty};}
    else if(pts.size===2){moved=true;drag=null;const t=two();pinch={d:t.d};}
  });
  f.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2&&pinch){
      const t=two(),r=f.getBoundingClientRect();
      zoomAt(t.cx-r.left,t.cy-r.top,t.d/pinch.d);pinch.d=t.d;
    }else if(drag&&pts.size===1){
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!moved&&Math.hypot(dx,dy)>7)moved=true;
      if(moved){V.tx=drag.tx+dx;V.ty=drag.ty+dy;applyView();ui.userView=true;}
    }
  });
  const up=e=>{
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===1){const p=[...pts.values()][0];drag={x:p.x,y:p.y,tx:V.tx,ty:V.ty};}
    else if(pts.size===0)drag=null;
  };
  f.addEventListener('pointerup',up);f.addEventListener('pointercancel',up);
  f.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  f.addEventListener('wheel',e=>{
    e.preventDefault();const r=f.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0016));
  },{passive:false});
}

  const players=o.players||st.players;
  const bodies=st.bodies.slice();
  if(o.extra)bodies.push(o.extra);
  const m=cellMap(bodies),chain=new Set(),mids=new Set();
  for(const [a,b,c] of triplesOf(bodies,m))if(chainBonus(a,b,c)>0){chain.add(lkKey(a,b));chain.add(lkKey(b,c));mids.add(b.uid);}
  const lap=new Set(),pc=new Set(),lapB=new Set(),pcB=new Set();
  for(const [a,b,c] of laplaceTriples(bodies,m)){lap.add(lkKey(a,b));lap.add(lkKey(b,c));lapB.add(a.uid);lapB.add(b.uid);lapB.add(c.uid);}
  for(const pch of findChains(bodies,m)){for(let i=0;i<3;i++)pc.add(lkKey(pch[i],pch[i+1]));pch.forEach(b=>pcB.add(b.uid));}
  let h='';
  if(o.ghosts)for(const g of o.ghosts){
    const sel=o.cell&&o.cell.x===g.x&&o.cell.y===g.y;
    h+=`<div class="gh${sel?' sel':''}${o.hintCell&&o.hintCell.x===g.x&&o.hintCell.y===g.y?' hnt':''}" data-x="${g.x}" data-y="${g.y}" style="left:${g.x*SX}px;top:${g.y*SY}px;width:${CW}px;height:${CH}px"><div><span>+</span>${g.label?'<small>'+g.label+'</small>':''}</div></div>`;
  }
  for(const [a,b] of pairsOf(bodies,m)){
    const inf=linkInfo(a,b),hz=a.y===b.y,ld=st.loads[loadKey(a,b)]||0;
    const cls=!inf.base?'dis':inf.d===0?'d0':inf.d===2?'d2':'dn';
    const left=a.x*SX+(hz?CW:0),top=a.y*SY+(hz?0:CH);
    h+=`<div class="lk ${cls} ${hz?'hz':'vt'}${chain.has(lkKey(a,b))?' chain':''}${lap.has(lkKey(a,b))?' lap':''}${pc.has(lkKey(a,b))?' pc':''}" data-la="${a.uid}" data-lb="${b.uid}" style="left:${left}px;top:${top}px;width:${hz?GAP:CW}px;height:${hz?CH:GAP}px"><i class="ln"></i><span class="bd"><em>${inf.base?inf.ratio:'×'}</em>${inf.base?'<strong>+'+inf.score+'</strong>':''}</span>${inf.base&&inf.d===0?'<span class="ld">'+'●'.repeat(ld)+'○'.repeat(Math.max(0,3-ld))+'</span>':''}</div>`;
  }
  for(const b of bodies){
    const thr=b.uid!=='preview'&&hatchHits(st,b);
    const cls=['fb'];
    if(pcB.has(b.uid))cls.push('pcb');else if(lapB.has(b.uid))cls.push('lapb');
    if(thr)cls.push('threat');
    if(b.uid==='preview')cls.push('pv');
    if(o.targets&&b.uid!=='preview')cls.push('tg');
    if(o.tgt===b.uid)cls.push('pick');
    if(o.hintUid===b.uid)cls.push('hnt');
    if(o.last===b.uid)cls.push('pop');
    h+=`<div class="${cls.join(' ')}" data-uid="${b.uid}" style="left:${b.x*SX}px;top:${b.y*SY}px;width:${CW}px;height:${CH}px">${cardEl(b.card,{fs:FS,body:b,players,state:st})}${mids.has(b.uid)?'<span class="chn">⛓ +'+CHAIN_BONUS+'</span>':''}</div>`;
  }
  return h;
}
function bestAt(card,cell){
  let best=-99;
  for(let ph=0;ph<4;ph++)best=Math.max(best,evalPlacement(G,card,cell.x,cell.y,ph,G.cur).gained*(ui.ampCard?2:1));
  return best;
}
function renderWorld(){
  const o={players:G.players,last:ui.last};

    if(ui.cell)o.extra={uid:'preview',card:ui.sel,owner:G.cur,phase:ui.phase,mod:0,x:ui.cell.x,y:ui.cell.y};

}

/* ---------- лист действий ---------- */
function actBtn(a){ui.acts.push(a);return 'data-a="'+(ui.acts.length-1)+'"';}
function shHead(title,sub,infoOk){
  return `<div class="sh-h"><b>${title}</b>${infoOk?'<button class="sx" data-act="info" aria-label="О карте">ⓘ</button>':''}<button class="sx" data-act="cancel" aria-label="Отмена">✕</button></div>`+(sub?`<div class="sh-t">${sub}</div>`:'');
}
function tagOf(r){
  const L=r.links.filter(l=>l.inf.base);
  if(!L.length)return {t:r.links.length?'диссонанс':'нет связей',k:'dis'};
  if(L.some(l=>l.inf.d===0))return {t:'сближение ⚠',k:'d0'};
  if(L.some(l=>l.inf.d===2))return {t:'противофаза',k:'d2'};
  return {t:'сдвиг',k:'dn'};
}
function phaseOptions(card,cell){
  const rec=ui.hintShow&&ui.hintShow.a.type==='body'?ui.hintShow.a:null;
  return [0,1,2,3].map(ph=>({ph,r:evalPlacement(G,card,cell.x,cell.y,ph,G.cur),rec:rec&&rec.x===cell.x&&rec.y===cell.y&&rec.phase===ph}));
}
function sheetHTML(){
  if(!humanTurn()||ui.hide)return '';
  ui.acts=[];
  if(ui.mode==='shift')return shiftSheet();
  if(ui.mode==='remove')return removeSheet();
  if(ui.mode==='tide')return tideSheet();
  if(ui.mode==='amppick')return ampPickSheet();
  const c=ui.sel;if(!c)return '';
  if(c.kind==='body')return bodySheet(c);
  if(c.kind==='perturb')return perturbSheet(c);
  return hatchSheet(c);
}
function discardBtn(c){return `<button class="btn" ${actBtn({type:'discard',cardId:c.id})}>Сбросить карту, пропустить ход</button>`;}
function bodySheet(c){
  const mult=ui.ampCard?2:1,dc=ui.ampCard||c;
  if(!ui.cell)return shHead(ui.ampCard?'Усилитель + '+c.name:c.name,(ui.ampCard?'Очки за выкладывание удвоятся. ':'')+'Нажмите «+» на поле: карта соединится со всеми соседями (сверху, снизу, слева, справа).',true)+`<div class="sh-f">${discardBtn(dc)}</div>`;
  const opts=phaseOptions(c,ui.cell),cur=opts[ui.phase];
  let h=shHead(ui.ampCard?'Усилитель + '+c.name:c.name,'Выберите фазу (поворот карты)'+(ui.ampCard?', очки ×2':'')+':',true)+'<div class="ph-row">';
  for(const o of opts){
    const tg=tagOf(o.r);
    h+=`<button class="ph ${tg.k}${o.ph===ui.phase?' on':''}${o.rec?' rec':''}" data-act="phase" data-v="${o.ph}">${dialSVG(o.ph)}<b>+${o.r.gained*mult}</b><small>${tg.t}</small></button>`;
  }
  h+=`</div><div class="sh-f"><button class="btn pri" ${actBtn(ui.ampCard?{type:'amp',cardId:ui.ampCard.id,bodyId:c.id,x:ui.cell.x,y:ui.cell.y,phase:ui.phase}:{type:'body',cardId:c.id,x:ui.cell.x,y:ui.cell.y,phase:ui.phase})}>Положить: +${cur.r.gained*mult}</button>${discardBtn(dc)}</div>`;
  return h;
}
function neighborsOf(b){
  const m=cellMap(G.bodies),out=[];
  DIRS.forEach((d,i)=>{const n=m.get((b.x+d[0])+','+(b.y+d[1]));if(n)out.push({n,dir:i});});
  return out;
}
function countUnstable(id){
  let n=0;
  for(const [x,y] of pairsOf(G.bodies)){if(x.owner!==id&&y.owner!==id)continue;const i=linkInfo(x,y);if(i.base&&i.d===0)n++;}
  return n;
}
function oppRow(c){
  let h='<div class="opp-row">';
  for(const q of G.players.filter(z=>z.id!==G.cur)){
    const a={type:c.fx,cardId:c.id,target:q.id};let ok=true,info='';
    if(c.fx==='trade')info='карт в руке: '+q.hand.length;
    else if(c.fx==='steal'){ok=q.quanta>0;info='у него ◈'+q.quanta+(ok?' → заберёте '+Math.min(STEAL_N,q.quanta):'');}
    else if(c.fx==='eclipse'){ok=!q.skip;info=q.skip?'уже пропускает ход':'пропустит следующий ход';}
    else{const n=countUnstable(q.id);ok=n>0;info=n?'нестабильных резонансов: '+n:'нет нестабильных резонансов';}
    h+=`<button class="opp" ${ok?actBtn(a):'disabled'}><b style="color:${q.color}">● ${esc(q.name)}</b><small>${info}</small></button>`;
  }
  return h+'</div>';
}
function perturbSheet(c){
  if(['trade','overload','steal','eclipse'].includes(c.fx))return shHead(c.name,c.text+'. Выберите соперника:',true)+oppRow(c)+`<div class="sh-f">${discardBtn(c)}</div>`;
  if(c.fx==='damper'){
    let n=0,tk=0;
    for(const [x,y] of pairsOf(G.bodies)){if(x.owner!==G.cur&&y.owner!==G.cur)continue;const v=G.loads[loadKey(x,y)]||0;if(v>0){n++;tk+=v;}}
    return shHead(c.name,c.text+'.<br>'+(n?'Сейчас на ваших резонансах: '+tk+' жетонов на '+n+' связях.':'На ваших резонансах жетонов нет.'),true)+`<div class="sh-f"><button class="btn pri" ${n?actBtn({type:'damper',cardId:c.id}):'disabled'}>Снять жетоны</button>${discardBtn(c)}</div>`;
  }
  if(c.fx==='shield'){
    const ok=ownChain(G,G.cur)&&!G.shield;
    return shHead(c.name,c.text+'.<br>'+(ok?'Защита действует на все тела вашей цепочки: их нельзя убрать, сдвинуть, поменять, выбросить Люком или нагрузкой.':(ownChain(G,G.cur)?'Цепочка уже защищена.':'У вас сейчас нет планетной цепочки.')),true)+`<div class="sh-f"><button class="btn pri" ${ok?actBtn({type:'shield',cardId:c.id}):'disabled'}>Защитить цепочку</button>${discardBtn(c)}</div>`;
  }
  if(c.fx==='reboot'){
    const k=me().hand.length-1;
    return shHead(c.name,c.text+'. Сейчас в руке ещё '+k+' карт: они уйдут в сброс.',true)+`<div class="sh-f"><button class="btn pri" ${actBtn({type:'reboot',cardId:c.id})}>Перезагрузить руку</button>${discardBtn(c)}</div>`;
  }
  if(c.fx==='beacon'){
    const n=G.deck.length;
    return shHead(c.name,c.text+'. В колоде сейчас '+n+' карт.',true)+`<div class="sh-f"><button class="btn pri" ${n?'data-act="beacon" data-v="'+c.id+'"':'disabled'}>Выбрать карту из колоды</button>${discardBtn(c)}</div>`;
  }
  if(c.fx==='cash'){
    const ok=me().quanta>=CASH_COST;
    return shHead(c.name,c.text+'. У вас ◈'+me().quanta+'.'+(ok?'':' Не хватает квантов.'),true)+`<div class="sh-f"><button class="btn pri" ${ok?actBtn({type:'cash',cardId:c.id}):'disabled'}>Обменять: +${CASH_POINTS} очков</button>${discardBtn(c)}</div>`;
  }
  const sub={tide:'Нажмите на тело, чьё значение периода хотите изменить.',doppler:'Нажмите на тело: его период изменится на ±2.',shift:'Нажмите на тело, фазу которого хотите повернуть.',wind:'Нажмите на тело, которое нужно убрать (его владелец потеряет '+PENALTY+' очка).',swap:'Нажмите на тело, которое хотите поменять с соседом.'}[c.fx];
  if(!ui.tgt)return shHead(c.name,sub,true)+`<div class="sh-f">${discardBtn(c)}</div>`;
  const b=bodyByUid(G,ui.tgt);if(!b){ui.tgt=null;return shHead(c.name,sub,true);}
  let h=shHead(c.name,'Цель: <b>«'+b.card.name+'»</b> (период '+effP(b)+', фаза '+b.phase+')',true)+'<div class="opt-row">';
  const gain=a=>{const sim=cloneState(G),r=applyAction(sim,a);return r.ok?r:null;};
  if(c.fx==='tide'||c.fx==='doppler'){
    const stp=c.fx==='doppler'?2:1;
    for(const dir of [-stp,stp]){
      const a={type:c.fx,cardId:c.id,uid:b.uid,dir},e=effP(b),ne=clamp(e+dir),r=ne===e?null:gain(a);
      h+=`<button class="opt dn" ${r?actBtn(a):'disabled'}><b>${dir<0?'−'+stp:'+'+stp}</b><small>период ${e} → ${ne}${r?'<br>очки +'+r.gained:''}</small></button>`;
    }
  }else if(c.fx==='shift'){
    for(const dir of [-1,1]){
      const a={type:'shift',cardId:c.id,uid:b.uid,dir},r=gain(a);
      h+=`<button class="opt dn" ${actBtn(a)}>${dialSVG((b.phase+dir+4)%4)}<b>${dir<0?'↺ −90°':'↻ +90°'}</b><small>очки +${r?r.gained:0}</small></button>`;
    }
  }else if(c.fx==='wind'){
    const a={type:'wind',cardId:c.id,uid:b.uid},ok=G.bodies.length>=2;
    h+=`<button class="opt d0" ${ok?actBtn(a):'disabled'}><b>Убрать</b><small>«${b.card.name}»<br>${b.owner===null?'без штрафа':G.players[b.owner].name+' −'+PENALTY}</small></button>`;
  }else{
    const nb=neighborsOf(b);
    if(!nb.length)h+='<div class="sh-t">У этого тела нет соседей.</div>';
    for(const o of nb){
      const a={type:'swap',cardId:c.id,a:b.uid,b:o.n.uid},r=gain(a);
      h+=`<button class="opt dn" ${actBtn(a)}><b>${DIRN[o.dir][1]}</b><small>с «${o.n.card.name}»<br>очки +${r?r.gained:0}</small></button>`;
    }
  }
  return h+`</div><div class="sh-f">${discardBtn(c)}</div>`;
}
function ampPickSheet(){

function hatchSheet(c){

function tideSheet(){
  const p=me(),head=`<div class="sh-h"><b>Приливная сила за ${kv(COST_TIDE)}</b><button class="sx" data-act="cancel">✕</button></div>`;

/* Мелодия: полиритмия. Тело с периодом p звучит каждые p долей своей нотой (660/p Гц, на октаву выше),
   фаза сдвигает удар внутри периода (фаза/4 периода). Если два тела бьют одновременно, добавляется удар барабана.
   Порядок: планетные цепочки, затем резонансы Лапласа вперемешку с остальными телами, затем всё поле вместе.
   Тела одной секции играют разными инструментами, чтобы одновременные ноты различались на слух. */
const INSTR=['flute','bell','clar','string','pluck','organ'];
const INSTR_VOL={flute:1,bell:.85,clar:.5,string:.55,pluck:1,organ:.8};
function melodyPlan(){
  const BEAT=.3,notes=[],names=[],starts=[],ends=[],bs=G.bodies;
  const lcm=(a,b)=>a/gcd(a,b)*b;
  const secs=[];
  for(const c of findChains(bs))secs.push({name:'планетная цепочка '+c.map(x=>effP(x)).join('-'),list:c,vol:.2});
  const laps=[],seenL=new Set();
  for(const t of laplaceTriples(bs)){
    const k=t.map(x=>effP(x)).sort((a,b)=>a-b).join(':');
    if(seenL.has(k)||laps.length>=3)continue;seenL.add(k);
    laps.push({name:'Лаплас '+t.map(x=>effP(x)).join(':'),list:t,vol:.16});
  }
  const used=new Set([...secs,...laps].flatMap(s=>s.list.map(b=>b.uid)));
  const rest=bs.filter(b=>!used.has(b.uid)).sort((a,b)=>effP(a)-effP(b));
  const others=[];
  for(let k=0;k<rest.length&&others.length<3;k+=3){
    const g=rest.slice(k,k+3);
    if(g.length>=2||!others.length)others.push({name:'другие тела',list:g,vol:.13});
  }
  for(let k=0;k<Math.max(laps.length,others.length);k++){
    if(laps[k])secs.push(laps[k]);
    if(others[k])secs.push(others[k]);
  }
  if(bs.length>1)secs.push({name:'все вместе ещё раз',list:bs.slice(0,14),vol:.12,final:true});
  else if(bs.length===1&&!secs.length)secs.push({name:'единственное тело',list:bs,vol:.14});
  let t=0;
  for(const s of secs){
    starts.push(t);
    const seenP=new Set(),vl=[];
    for(const b of s.list){const p=effP(b);if(!seenP.has(p)){seenP.add(p);vl.push(b);}}
    const vs=vl.slice(0,6),per=[...new Set(vs.map(b=>effP(b)))];
    let L=per.reduce((a,p)=>lcm(a,p),1);if(L>8)L=8;
    const total=L,hits=[],sn=[];
    vs.forEach((b,bi)=>{
      const p=effP(b),off=((b.phase%4)/4)*p,ins=INSTR[bi%INSTR.length];
      for(let bt=off;bt<total-1e-9;bt+=p){
        hits.push({bt,id:b.uid});
        sn.push({f:freqOf(p)*2,t:t+bt*BEAT,d:Math.min(.45+p*.16,2)*(ins==='pluck'?.5:1),v:s.vol*INSTR_VOL[ins],ins,sec:names.length});
      }
    });
    hits.sort((a,b)=>a.bt-b.bt);
    sn.sort((x,y)=>x.t-y.t||x.f-y.f);
    for(let i=0;i<sn.length;){
      let j=i;while(j+1<sn.length&&sn[j+1].t-sn[i].t<.06*BEAT)j++;
      const g=sn.slice(i,j+1);
      if(g.length>3){notes.push(g[0],g[g.length>>1],g[g.length-1]);}else notes.push(...g);
      i=j+1;
    }
    for(let i=0;i<hits.length;){
      let j=i;const ids=new Set([hits[i].id]);
      while(j+1<hits.length&&hits[j+1].bt-hits[i].bt<.06){j++;ids.add(hits[j].id);}
      if(ids.size>=2)notes.push({kick:true,f:90,t:t+hits[i].bt*BEAT,d:.3,v:.3,sec:names.length});
      i=j+1;
    }
    names.push(s.name);
    t+=(total+1)*BEAT;
    if(s.final){per.forEach(p=>notes.push({f:freqOf(p)*2,t:t-BEAT,d:2.4,v:.07,ins:'organ',sec:names.length-1}));t+=2.2;}
    ends.push(t);
  }

}
function melodyVoice(c,n,t0,dest){
  const s=t0+n.t,g=c.createGain(),dst=dest||c.destination;
  g.gain.setValueAtTime(0.0001,s);
  if(n.kick){
    const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(130,s);o.frequency.exponentialRampToValueAtTime(45,s+.18);
    g.gain.exponentialRampToValueAtTime(n.v,s+.005);g.gain.exponentialRampToValueAtTime(.0001,s+n.d);
    o.connect(g);g.connect(dst);o.start(s);o.stop(s+n.d+.05);return;
  }
  const atk=n.ins==='string'?.08:n.ins==='flute'?.03:.012;
  g.gain.exponentialRampToValueAtTime(n.v,s+atk);g.gain.exponentialRampToValueAtTime(.0001,s+n.d);
  let out=g;
  const mk=(type,f,gain)=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;const x=c.createGain();x.gain.value=gain;o.connect(x);o.start(s);o.stop(s+n.d+.05);return x;};
  const lp=fr=>{const b=c.createBiquadFilter();b.type='lowpass';b.frequency.value=fr;b.connect(g);return b;};
  switch(n.ins){
    case 'bell':mk('sine',n.f,1).connect(g);mk('sine',n.f*2.76,.35).connect(g);break;
    case 'clar':mk('square',n.f,1).connect(lp(1300));break;
    case 'string':mk('sawtooth',n.f,1).connect(lp(1000));mk('sawtooth',n.f*1.004,.6).connect(lp(1000));break;
    case 'pluck':mk('triangle',n.f,1).connect(g);mk('triangle',n.f*2,.3).connect(g);break;
    case 'organ':mk('sine',n.f,1).connect(g);mk('sine',n.f*2,.5).connect(g);break;
    default:mk('triangle',n.f,1).connect(g);
  }
  g.connect(dst);
}

function drawWave(cx,w,h,an,buf,fl,tt,fade){
  cx.globalCompositeOperation='source-over';
  cx.fillStyle='rgba(11,16,32,'+fade+')';cx.fillRect(0,0,w,h);
  if(an)an.getByteTimeDomainData(buf);

  cx.globalCompositeOperation='lighter';
  /* всполохи на нотах: расходящееся свечение, затухает */
  for(const f of fl){
    const age=tt-f.t,k=Math.min(1,age/.9);if(k>=1)continue;
    const r=14+k*46,al=(1-k)*.8;
    const g=cx.createRadialGradient(f.x*w,mid,0,f.x*w,mid,r);

  }

}

async function downloadVideo(){
  if(!G||!G.bodies.length){toast('Поле пусто',true);return;}
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast('Браузер не умеет записывать видео',true);return;}
  if(ui.recBusy)return;
  ui.recBusy=true;
  try{
    const url=await rollUrl(),img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
    const c=ac();if(!c)throw new Error('audio');
    if(ui.mp&&ui.mp.state!=='idle')mpStop();
    ui.mp=null;
    const m=melodyPlan(),bus=melBus(c),W=1440,H=1160,WH=150,k=W/1800;
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const cx=cv.getContext('2d'),wv=document.createElement('canvas');wv.width=W;wv.height=WH;const wx=wv.getContext('2d');
    wx.fillStyle='#0b1020';wx.fillRect(0,0,W,WH);

    const stream=cv.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    const mimes=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=mimes.find(t=>MediaRecorder.isTypeSupported(t))||'';
    const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{}),chunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    const done=new Promise(res=>{rec.onstop=res;});
    const t0=c.currentTime+.2;m.notes.forEach(n=>melodyVoice(c,n,t0,sg));
    const mp={m,fl:[],ni:0};ui.mp=mp;mp.c=c;mp.t0=t0;mp.state='rec';mp.sg=sg;
    const g=ui.rollGeom,buf=bus.buf;
    toast('Идёт запись видео, около '+Math.ceil(m.len+1)+' с. Не закрывайте вкладку.');
    rec.start(250);
    const total=m.len+.6;
    await new Promise(res=>{
      const frame=()=>{
        const tt=Math.max(0,c.currentTime-t0);
        mpFlashes(tt);
        drawWave(wx,W,WH,bus.an,buf,mp.fl,tt,.2);
        cx.fillStyle='#0b1020';cx.fillRect(0,0,W,H);
        cx.drawImage(wv,0,0);
        cx.drawImage(img,0,WH,W,1260*k);
        const x=(g.ML+(Math.min(tt,m.len)-g.T0)/(g.LEN-g.T0)*(g.W-g.ML-g.MR))*k;
        cx.fillStyle='#ffd34d';cx.shadowColor='#ffd34d';cx.shadowBlur=12;cx.fillRect(x-1,WH,2,1260*k);cx.shadowBlur=0;
        cx.fillStyle='#ffd34d';cx.font='600 22px system-ui,sans-serif';cx.textAlign='left';cx.fillText('Резонансы · музыка вашей партии',18,32);
        if(tt>=total)res();else requestAnimationFrame(frame);
      };frame();
    });
    rec.stop();await done;
    try{sg.disconnect();}catch(e){}
    ui.mp=null;mpSync();
    const blob=new Blob(chunks,{type:mime||'video/webm'});
    saveBlob(blob,'resonance_video_'+stamp()+(mime.startsWith('video/mp4')?'.mp4':'.webm'));
  }catch(e){toast('Не удалось записать видео',true);console.error(e);ui.mp=null;mpSync();}
  ui.recBusy=false;
}

function gameResult(){

function fireworks(cx,W,H,n,seed){
  let r=seed;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647;};
  const cols=['#ffd34d','#ff6b81','#7be0ff','#9be58f','#c79bf2','#ff9a3c'];
  for(let k=0;k<n;k++){
    const x=W*(.08+.84*rnd()),y=H*(.05+.45*rnd()),R=40+rnd()*60,c=cols[k%cols.length],m=22+Math.floor(rnd()*10);
    const g=cx.createRadialGradient(x,y,0,x,y,R*1.3);g.addColorStop(0,c+'55');g.addColorStop(1,c+'00');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,R*1.3,0,7);cx.fill();
    cx.strokeStyle=c;cx.fillStyle=c;cx.lineCap='round';
    for(let j=0;j<m;j++){
      const a=j/m*Math.PI*2+rnd()*.1,r0=R*.25,r1=R*(.75+rnd()*.25);
      cx.globalAlpha=.9;cx.lineWidth=2.4;cx.beginPath();cx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);cx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);cx.stroke();
      cx.globalAlpha=1;cx.beginPath();cx.arc(x+Math.cos(a)*(r1+6),y+Math.sin(a)*(r1+6),2.6,0,7);cx.fill();
    }
    cx.globalAlpha=1;
  }
}

function computeHint(){
  const st=G,a=botChoose(st,()=>0),c=me().hand.find(x=>x.id===a.cardId);
  if(!c)return null;
  let text='',gain=0;
  if(a.type==='body'){
    const r=evalPlacement(st,c,a.x,a.y,a.phase,st.cur);gain=r.gained;
    const nb=r.links.map(l=>'«'+l.other.card.name+'» ('+(l.inf.base?l.inf.ratio:'диссонанс')+')').join(', ');
    const tg=tagOf(r);
    const why=tg.k==='d2'?'противофаза даёт +1 очко и защиту от Люков':tg.k==='d0'?'сближение удваивает очки, но копит нагрузку: следите за жетонами':tg.k==='dn'?'простое отношение периодов приносит очки':'связей с резонансом нет';
    text=`Положите <b>«${c.name}»</b> в клетку рядом с ${nb||'полем'} и выберите <b>фазу ${a.phase}</b>: <b>+${gain}</b>. Почему: ${why}.`;
  }else{
    const sim=cloneState(st),r=applyAction(sim,a);gain=r.ok?r.gained:0;
    const b=a.uid?bodyByUid(st,a.uid):null,nm=b?'«'+b.card.name+'»':'';
    if(a.type==='tide')text=`Сыграйте <b>«Приливная сила»</b> на ${nm}: период ${effP(b)} → ${clamp(effP(b)+a.dir)}, <b>+${gain}</b>.`;
    else if(a.type==='shift')text=`Сыграйте <b>«Сдвиг фазы»</b> на ${nm}: фаза ${b.phase} → ${(b.phase+a.dir+4)%4}, <b>+${gain}</b>.`;
    else if(a.type==='swap'){const x=bodyByUid(st,a.a),y=bodyByUid(st,a.b);text=`Сыграйте <b>«Гравитационный толчок»</b>: поменять «${x.card.name}» и «${y.card.name}», <b>+${gain}</b>.`;}
    else if(a.type==='wind')text=`Сыграйте <b>«Солнечный ветер»</b> на ${nm}: тело уйдёт с поля${b.owner===null?'':', его владелец '+st.players[b.owner].name+' потеряет '+PENALTY+' очка'}.`;
    else if(a.type==='hatch'){const lost=st.bodies.filter(b=>!sim.bodies.some(x=>x.uid===b.uid));text=`Положите Люк <b>«${c.name}»</b> в зону: `+(lost.length?'будут выброшены '+lost.map(b=>'«'+b.card.name+'»').join(', '):'пока никого не заденет, но создаст угрозу.');}
    else if(a.type==='amp'){const bc=me().hand.find(x=>x.id===a.bodyId);text=`Сыграйте <b>«Усилитель»</b> вместе с <b>«${bc?bc.name:'телом'}»</b>: положите её в выбранную клетку, фаза ${a.phase}. Очки удвоятся: <b>+${gain}</b>.`;}
    else if(a.type!=='discard')text=`Сыграйте <b>«${c.name}»</b>: ${c.text}.`;
    else text='Сбросьте карту.';
  }
  if(gain<=0&&['body','tide','shift','swap'].includes(a.type))text+=' Очков этот ход не принесёт: выгодных вариантов в руке нет, можно и сбросить карту.';
  const fs=botFreeShift(st);
  let shiftText='';
  if(fs){const b=bodyByUid(st,fs.uid);shiftText=`Перед ходом выгодно потратить бесплатный сдвиг: повернуть <b>«${b.card.name}»</b> ${fs.dir<0?'↺ на −90°':'↻ на +90°'} (осталось ${me().shifts}).`;}
  return {a,card:c,text,shift:fs,shiftText};
}
function hintModal(){
  if(!humanTurn()){toast('Подсказка доступна в ваш ход');return;}
  const h=computeHint();
  if(!h){openModal('<h2>💡 Подсказка</h2><p>Подходящих ходов не найдено. Можно сбросить карту.</p>');return;}
  ui.hintCache=h;
  openModal(`<h2>💡 Подсказка</h2><p>${h.text}</p>${h.shiftText?'<div class="note">'+h.shiftText+'</div>':''}<div class="note">Совет: ${TIPS[ui.tipN++%TIPS.length]}</div><div class="row"><button class="btn pri" data-act="hintshow">Показать ход</button>${h.shift?'<button class="btn" data-act="hintshift">Применить сдвиг</button>':''}<button class="btn" data-act="mclose">Закрыть</button></div>`);
}
function hintShow(){
  const h=ui.hintCache;closeModal();if(!h||!humanTurn())return;
  const c=me().hand.find(x=>x.id===h.a.cardId);if(!c)return;
  resetSel();ui.sel=c;ui.hintShow=h;
  if(c.kind==='perturb'&&c.fx==='amp'){ui.ampCard=c;ui.sel=me().hand.find(x=>x.id===h.a.bodyId)||null;ui.mode='place';ui.cell={x:h.a.x,y:h.a.y};ui.phase=h.a.phase;render();showCell(ui.cell);return;}
  if(c.kind==='body'){ui.mode='place';ui.cell={x:h.a.x,y:h.a.y};ui.phase=h.a.phase;}
  else if(c.kind==='perturb'){ui.mode='perturb';ui.tgt=h.a.uid||h.a.a||null;}
  else ui.mode='hatch';
  render();
  if(ui.cell)showCell(ui.cell);
}

function chordTones(uids,kind){
  const ps=uids.map(u=>{const b=bodyByUid(G,u);return b?effP(b):null;}).filter(Boolean);
  if(!ui.sound||!ps.length)return;
  ac();
  ps.forEach((p,i)=>tone(freqOf(p)*2,i*0.14,1.1,0.12));
  if(kind!=='lap')tone(freqOf(1)*8,ps.length*0.14,1.4,0.1);
  tone(freqOf(Math.min(...ps))*4,ps.length*0.14+0.1,1.6,0.09);
}
function fxSchedule(fn){
  const now=Date.now(),at=Math.max(now,ui.fxAt);
  ui.fxAt=at+2600;
  const gid=ui.gid;
  setTimeout(()=>{if(G&&gid===ui.gid)fn();},at-now);
