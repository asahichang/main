<style>

  --accent:#5CC8B8; --accent-ink:#06211D; --stage:#0A100E; --chip:#1C2A26; --ring:rgba(92,200,184,.28); color-scheme:dark}}

  padding-block:18px 32px;

.ctl input[type=number]{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-family:var(--f-mono)}

.btn{background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-weight:500;font-size:13px}

  padding:40px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.6))}
.show.idle .show-top,.show.idle .show-bar{opacity:0;pointer-events:none}
.show.idle canvas{cursor:none}
.play{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#0b1210;display:grid;place-items:center;padding:0}
.play:hover{background:#dff6f2}
.tl{position:relative;height:30px;min-width:0}
.tl-track{position:absolute;left:0;right:0;top:11px;height:8px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}

.sp{display:flex;gap:8px;align-items:center;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8)}

.sp select option{color:#111}
@media (max-width:640px){.show-bar{grid-template-columns:auto minmax(0,1fr)}.sp{justify-self:end}}

<div class="app">
  <header>
    <div>
      <h1>Heightmap Graph</h1>
      <p class="sub">Узловой генератор рельефа в духе World Machine: шум, эрозия, карта высот и 3D. Выбери узел и меняй параметры.</p>
    </div>

  </header>

  </section>

  <div class="work">

      </div>

  </div>

<script>
/*CORE*/
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeNoise(seed){
  const rnd=mulberry32(seed|0), perm=[];
  for(let i=0;i<256;i++)perm.push(i);
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=perm[i];perm[i]=perm[j];perm[j]=t}
  const p=new Uint8Array(512);for(let i=0;i<512;i++)p[i]=perm[i&255];
  const gx=new Float32Array(256),gy=new Float32Array(256);
  for(let i=0;i<256;i++){const a=rnd()*6.283185307;gx[i]=Math.cos(a);gy[i]=Math.sin(a)}
  return function(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
    const u=xf*xf*xf*(xf*(xf*6-15)+10),v=yf*yf*yf*(yf*(yf*6-15)+10);
    const aa=p[p[X]+Y],ab=p[p[X]+Y+1],ba=p[p[X+1]+Y],bb=p[p[X+1]+Y+1];
    const n00=gx[aa]*xf+gy[aa]*yf,n10=gx[ba]*(xf-1)+gy[ba]*yf;
    const n01=gx[ab]*xf+gy[ab]*(yf-1),n11=gx[bb]*(xf-1)+gy[bb]*(yf-1);
    const a0=n00+u*(n10-n00),a1=n01+u*(n11-n01);
    return a0+v*(a1-a0);
  };
}
function normalize(a){
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<a.length;i++){const v=a[i];if(v<mn)mn=v;if(v>mx)mx=v}
  const r=mx-mn||1;
  for(let i=0;i<a.length;i++)a[i]=(a[i]-mn)/r;
  return a;
}

function genPerlin(N,p){
  const nz=makeNoise(p.seed),nw=makeNoise(p.seed+101),out=new Float32Array(N*N),oct=p.octaves|0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let nx=x/N*p.scale,ny=y/N*p.scale;
    if(p.warp>0){
      const wx=nw(nx*0.8+3.1,ny*0.8+7.7),wy=nw(nx*0.8+11.3,ny*0.8+1.9);
      nx+=wx*p.warp*1.2;ny+=wy*p.warp*1.2;
    }
    let s=0,a=1,f=1,n=0;
    for(let o=0;o<oct;o++){s+=a*nz(nx*f+o*31.7,ny*f+o*17.3);n+=a;a*=p.gain;f*=p.lac}
    out[y*N+x]=s/n;
  }
  return normalize(out);
}
function genRidged(N,p){
  const nz=makeNoise(p.seed),out=new Float32Array(N*N),oct=p.octaves|0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const nx=x/N*p.scale,ny=y/N*p.scale;
    let s=0,a=0.5,f=1,w=1;
    for(let o=0;o<oct;o++){
      let n=nz(nx*f+o*19.1,ny*f+o*7.3);
      n=1-Math.abs(n)*1.6;if(n<0)n=0;
      n=Math.pow(n,p.sharp)*w;w=clamp(n*2,0,1);
      s+=n*a;a*=0.5;f*=2.05;
    }
    out[y*N+x]=s;
  }
  return normalize(out);
}
function runCombine(A,B,p,N){
  const out=new Float32Array(N*N),m=p.amount,mode=p.mode;
  for(let i=0;i<out.length;i++){
    const a=A[i],b=B[i];let v;
    if(mode==='mix')v=a*(1-m)+b*m;
    else if(mode==='mul')v=lerp(a,a*b,m);
    else if(mode==='max')v=lerp(a,Math.max(a,b),m);
    else v=a+m*b*smooth(0.35,0.75,a);
    out[i]=v;
  }
  return normalize(out);
}
function runShape(A,p,N){
  const out=new Float32Array(N*N),steps=p.steps|0,k=1+p.sharp*6;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=y*N+x;let v=Math.pow(A[i],p.gamma);
    if(p.falloff>0){
      const dx=(x+0.5)/N*2-1,dy=(y+0.5)/N*2-1,d=Math.sqrt(dx*dx+dy*dy)/1.2;
      v=lerp(v,v*(1-smooth(0.35,1.0,d)),p.falloff);
    }
    if(steps>1){
      const t=v*steps,ip=Math.floor(t),f=t-ip;
      const f2=f<0.5?0.5*Math.pow(2*f,k):1-0.5*Math.pow(2*(1-f),k);
      v=(ip+f2)/steps;
    }
    out[i]=v;
  }
  return normalize(out);
}
function runThermal(A,p,N){
  const h=Float32Array.from(A),d=new Float32Array(N*N),T=p.talus*(256/N),it=p.iter|0;
  for(let n=0;n<it;n++){
    d.fill(0);
    for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
      const i=y*N+x,hi=h[i];
      let df=hi-h[i-1];if(df>T){const m=(df-T)*0.18;d[i]-=m;d[i-1]+=m}
      df=hi-h[i+1];if(df>T){const m=(df-T)*0.18;d[i]-=m;d[i+1]+=m}
      df=hi-h[i-N];if(df>T){const m=(df-T)*0.18;d[i]-=m;d[i-N]+=m}
      df=hi-h[i+N];if(df>T){const m=(df-T)*0.18;d[i]-=m;d[i+N]+=m}
    }
    for(let i=0;i<h.length;i++)h[i]+=d[i];
  }
  return h;
}
function runHydro(A,p,N){
  const sc=N/256,h=new Float32Array(A.length);
  for(let i=0;i<h.length;i++)h[i]=A[i]*sc;
  const rnd=mulberry32(p.seed|0),drops=Math.round(p.drops*1000*sc*sc);
  const R=Math.max(1,Math.round(p.radius*sc)),bo=[],bw=[];let ws=0;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<R){bo.push(dx,dy);bw.push(R-d);ws+=R-d}
  }

  const inertia=p.inertia,cap=p.capacity,er=p.erode,dep=p.deposit,ev=p.evap,life=p.life|0,g=4,minS=0.01;

GRAPH.forEach(g=>NODE[g.id]={dirty:true,ver:0,key:'',data:null,size:0,ms:0,gray:null,aux:null,changed:true});

function applyPreset(key){
  P=clone(DEF);const pr=PRESETS[key].p;
  for(const id in pr)Object.assign(P[id],pr[id]);
  ST.preset=key;GRAPH.forEach(g=>NODE[g.id].dirty=true);
}
applyPreset('island');

/* ---------- compute ---------- */
let tmr=0;
function schedule(delay){
  clearTimeout(tmr);setBusy(true);
  tmr=setTimeout(compute,delay);
}
function setBusy(b,txt){const s=$('#stat');s.classList.toggle('busy',b);s.textContent=b?'Пересчёт…':txt}
function compute(){
  const t0=performance.now();
  for(const g of GRAPH){
    const n=NODE[g.id],key=g.in.map(i=>NODE[i].ver).join(',')+'|'+N;
    if(!n.dirty&&n.key===key)continue;
    const ins=g.in.map(i=>NODE[i].data),s=performance.now();
    n.data=RUN[g.id](ins,P[g.id],N);
    if(g.id==='hydro'){const a=ins[0],d=n.data,aux=new Float32Array(N*N);for(let i=0;i<aux.length;i++)aux[i]=d[i]-a[i];n.aux=aux}
    n.size=Math.round(Math.sqrt(n.data.length));
    n.ms=performance.now()-s;n.ver=++VER;n.key=key;n.dirty=false;n.gray=null;n.changed=true;
  }
  refreshAll();
  setBusy(false,'Готово · '+Math.round(performance.now()-t0)+' мс');
}
function markDirty(id){NODE[id].dirty=true}
let raf2=0;
function refreshSoon(){if(raf2)return;raf2=requestAnimationFrame(()=>{raf2=0;refreshAll()})}

/* ---------- canvases from arrays ---------- */
function toCanvas(img,w){
  const c=document.createElement('canvas');c.width=w;c.height=w;
  c.getContext('2d').putImageData(new ImageData(img.data,w,w),0,0);return c;
}
function grayOf(n){
  if(n.gray)return n.gray;
  const d=new Uint8ClampedArray(n.size*n.size*4),a=n.data;
  for(let i=0;i<a.length;i++){const v=a[i]*255,j=i*4;d[j]=v;d[j+1]=v;d[j+2]=v;d[j+3]=255}
  return n.gray=toCanvas({data:d},n.size);
}
const CACHE={relief:{key:'',cv:null},ero:{key:'',cv:null}};
function outOpts(){return Object.assign({},P.out,{contours:ST.contours,shadows:ST.shadows})}
function reliefCanvas(){
  const key=NODE.out.ver+'|'+JSON.stringify(P.out)+'|'+ST.contours+'|'+ST.shadows;
  if(CACHE.relief.key!==key){CACHE.relief.cv=toCanvas(buildShade(NODE.out.data,NODE.out.size,outOpts(),'relief'),NODE.out.size);CACHE.relief.key=key}
  return CACHE.relief.cv;
}
function eroCanvas(){
  const key=NODE.out.ver+'|'+NODE.hydro.ver+'|'+JSON.stringify(P.out);
  if(CACHE.ero.key!==key){
    const hn=normalize(Float32Array.from(NODE.hydro.data));
    CACHE.ero.cv=toCanvas(buildShade(hn,N,outOpts(),'ero',NODE.hydro.aux),N);CACHE.ero.key=key}
  return CACHE.ero.cv;
}

/* ---------- graph UI ---------- */
const NW=148,NH=84,GX=16,CS=172,GY=14,RS=98;
function buildGraph(){
  const host=$('#graph');let wires='',cards='';
  const pos={};GRAPH.forEach(g=>pos[g.id]={x:GX+g.col*CS,y:GY+g.row*RS});
  GRAPH.forEach(g=>{
    g.in.forEach(src=>{
      const a=pos[src],b=pos[g.id],x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2;
      wires+=`<path class="wire" data-from="${src}" data-to="${g.id}" d="M${x1} ${y1}C${x1+12} ${y1} ${x2-12} ${y2} ${x2} ${y2}"/><circle class="port" cx="${x1}" cy="${y1}" r="4"/><circle class="port" cx="${x2}" cy="${y2}" r="4"/>`;
    });
    const s=SCHEMA[g.id];
    cards+=`<button class="node" data-id="${g.id}" style="left:${pos[g.id].x}px;top:${pos[g.id].y}px" aria-pressed="false" aria-label="${s.title}, ${s.kind}">
      <canvas width="128" height="128"></canvas><span class="nk">${s.kind}</span><span class="nt">${s.title}</span><span class="nm">–</span></button>`;
  });
  host.innerHTML=`<svg width="1212" height="216" aria-hidden="true">${wires}</svg>${cards}`;
  host.addEventListener('click',e=>{const b=e.target.closest('.node');if(b)selectNode(b.dataset.id)});
}
function outThumb(){
  const S=NODE.out.size,T=96,f=S/T,h=NODE.out.data,t=new Float32Array(T*T);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++)t[y*T+x]=h[Math.floor((y+0.5)*f)*S+Math.floor((x+0.5)*f)];
  return toCanvas(buildShade(t,T,Object.assign({},P.out,{contours:false,shadows:ST.shadows}),'relief'),T);
}
function drawThumb(id){
  const el=document.querySelector(`.node[data-id="${id}"]`);if(!el||!NODE[id].data)return;
  const cx=el.querySelector('canvas').getContext('2d');
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
  cx.drawImage(id==='out'?outThumb():grayOf(NODE[id]),0,0,128,128);
}
function refreshGraph(){
  GRAPH.forEach(g=>{
    const n=NODE[g.id],el=document.querySelector(`.node[data-id="${g.id}"]`);
    if(n.changed||g.id==='out')drawThumb(g.id);
    n.changed=false;
    if(g.id==='out')el.querySelector('.nm').textContent='карта';
    else el.querySelector('.nm').textContent=(n.ms<1?'<1':Math.round(n.ms))+' мс';
    el.setAttribute('aria-pressed',g.id===ST.sel?'true':'false');
  });
  document.querySelectorAll('#graph .wire').forEach(w=>w.classList.toggle('on',w.dataset.to===ST.sel));
}

/* ---------- inspector ---------- */
function fmtV(d,v){return Number(v).toFixed(d.d)}
function ctlHTML(id,d,val){
  const eid=`p-${id}-${d.k}`;
  if(d.t==='select')return `<div class="ctl"><label class="lbl" for="${eid}">${d.label}</label><select id="${eid}" data-k="${d.k}">${d.opts.map(o=>`<option value="${o[0]}"${o[0]===val?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  if(d.t==='seed')return `<div class="ctl"><label class="lbl" for="${eid}">${d.label}</label><div class="seedrow"><input type="number" id="${eid}" data-k="${d.k}" value="${val}" min="0" max="99999" step="1"><button class="btn" type="button" data-dice="${d.k}">Случайный</button></div></div>`;
  if(d.t==='palette')return `<div class="ctl"><span class="lbl">${d.label}</span><div class="pal" style="grid-column:1/3">${Object.keys(PAL).map(k=>{
    const p=PAL[k],g='linear-gradient(90deg,'+p.land.map(s=>s[1]+' '+Math.round(s[0]*100)+'%').join(',')+')';
    return `<button type="button" data-pal="${k}" aria-pressed="${k===val}"><i style="background:${g}"></i><span>${p.name}</span></button>`}).join('')}</div></div>`;
  return `<div class="ctl"><label class="lbl" for="${eid}">${d.label}</label><output id="o-${eid}">${fmtV(d,val)}</output><input type="range" id="${eid}" data-k="${d.k}" min="${d.min}" max="${d.max}" step="${d.step}" value="${val}"></div>`;
}
function renderInspector(){
  const id=ST.sel,s=SCHEMA[id],p=P[id];
  const main=s.params.filter(d=>!d.adv).map(d=>ctlHTML(id,d,p[d.k])).join('');
  const adv=s.params.filter(d=>d.adv).map(d=>ctlHTML(id,d,p[d.k])).join('');
  $('#insp').dataset.id=id;
  $('#insp').innerHTML=`<div class="ihead"><h2>${s.title}</h2><span class="kind">${s.kind}</span></div><p class="desc">${s.desc}</p>
    <div class="ctls">${main}</div>${adv?`<details><summary>Дополнительно</summary><div class="ctls">${adv}</div></details>`:''}
    <div class="foot"><button class="btn" type="button" data-reset="1">Сбросить узел</button></div>`;
}
function selectNode(id){
  ST.sel=id;renderInspector();refreshGraph();
  if(ST.view==='height')refreshStage();
}
function onParam(id,k,v){
  P[id][k]=v;
  if(ST.preset){ST.preset=null;markPresets()}
  if(id==='out'){if(k==='edge'||k==='plain'){markDirty('out');schedule(40)}else refreshSoon();return}
  markDirty(id);schedule(HEAVY[id]||N>256?260:40);
}
function bindInspector(){
  const insp=$('#insp');
  insp.addEventListener('input',e=>{
    const t=e.target,id=insp.dataset.id,k=t.dataset.k;if(!k)return;
    if(t.type==='range'){const d=SCHEMA[id].params.find(x=>x.k===k);$('#o-'+t.id).textContent=fmtV(d,t.value);onParam(id,k,+t.value)}
    else if(t.type==='number'){const v=Math.max(0,Math.round(+t.value||0));onParam(id,k,v)}
  });
  insp.addEventListener('change',e=>{
    const t=e.target,id=insp.dataset.id;
    if(t.tagName==='SELECT'&&t.dataset.k)onParam(id,t.dataset.k,t.value);
  });
  insp.addEventListener('click',e=>{
    const id=insp.dataset.id,b=e.target.closest('button');if(!b)return;
    if(b.dataset.dice){const v=Math.floor(Math.random()*9999)+1;onParam(id,b.dataset.dice,v);document.getElementById(`p-${id}-${b.dataset.dice}`).value=v}
    else if(b.dataset.pal){onParam(id,'palette',b.dataset.pal);insp.querySelectorAll('[data-pal]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}
    else if(b.dataset.reset){Object.assign(P[id],clone(DEF[id]));renderInspector();markDirty(id);schedule(60)}
  });
}
function markPresets(){document.querySelectorAll('#presets .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.p===ST.preset?'true':'false'))}

/* ---------- stage ---------- */
const stage=$('#stage'),c2d=$('#c2d'),c3d=$('#c3d'),ctx2=c2d.getContext('2d');
const VIEWS={height:'Карта высот',relief:'Рельеф',ero:'Эрозия','3d':'3D'};
function refreshAll(){
  if(!NODE.out.data)return;
  refreshGraph();refreshStage();
}
function fit(){
  const dpr=window.devicePixelRatio||1;
  if(ST.view==='show'){
    const cw=showEl.clientWidth,ch=showEl.clientHeight,k=Math.min(dpr,1.5,Math.sqrt(1.6e6/Math.max(cw*ch,1)))*V3.scale;
    const w=Math.max(160,Math.round(cw*k)),h=Math.max(160,Math.round(ch*k));
    if(c3d.width!==w||c3d.height!==h){c3d.width=w;c3d.height=h}
    return;
  }
  const cw=stage.clientWidth;
  [[c2d,2],[c3d,1.5*V3.scale]].forEach(([c,cap])=>{const w=Math.max(160,Math.round(cw*Math.min(dpr,cap)));if(c.width!==w){c.width=w;c.height=w}});
}
function refreshStage(){
  const v=ST.view;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v?'true':'false'));
  $('#contLbl').hidden=v!=='relief';$('#shdLbl').hidden=v!=='relief'&&v!=='3d';$('#cycle').hidden=v!=='3d';
  c2d.hidden=v==='3d'||v==='show';c3d.hidden=v!=='3d'&&v!=='show';
  if(!NODE.out.data){$('#tag').textContent='Считаю…';return}
  if(v==='show'){ensureMesh();startShow();return}
  const what=v==='height'?SCHEMA[ST.sel].title+' · '+VIEWS[v]:VIEWS[v];
  $('#tag').textContent=what;
  const S=NODE.out.size,cell=Math.round(P.out.areaKm*1000/S);
  const base=`${S}×${S} · ${P.out.areaKm} км · ${cell} м/пиксель`;
  const ro=$('#readout');
  if(v==='3d'){ensureMesh();startLoop();ro.textContent='Тяни, чтобы вращать, колесо или щипок меняют масштаб. Солнце настраивается в узле Output. '+base}
  else{
    stopLoop();draw2D();
    ro.innerHTML=(v==='ero'?'<span class="dot" style="background:#e87028"></span>снос породы<span class="dot" style="background:#2ebeb0"></span>отложение. ':'Наведи курсор на карту, чтобы увидеть высоту. ')+base;
  }
}
function draw2D(){
  fit();
  const v=ST.view,cv=v==='height'?grayOf(NODE[ST.sel]):v==='relief'?reliefCanvas():eroCanvas();
  ctx2.imageSmoothingEnabled=true;ctx2.imageSmoothingQuality='high';
  ctx2.drawImage(cv,0,0,c2d.width,c2d.height);
}
c2d.addEventListener('pointermove',e=>{
  if(!NODE.out.data)return;
  const S=NODE.out.size,r=c2d.getBoundingClientRect(),u=clamp((e.clientX-r.left)/r.width,0,0.9999),w=clamp((e.clientY-r.top)/r.width,0,0.9999);
  const x=Math.floor(u*S),y=Math.floor(w*S),h=NODE.out.data,o=P.out,i=y*S+x,xm=Math.max(x-1,0),xp=Math.min(x+1,S-1),ym=Math.max(y-1,0),yp=Math.min(y+1,S-1);
  const k=o.maxElev/(1-o.sea),cell=o.areaKm*1000/S;
  const gx=(h[y*S+xp]-h[y*S+xm])/(xp-xm)*k/cell,gy=(h[yp*S+x]-h[ym*S+x])/(yp-ym)*k/cell;
  const deg=Math.atan(Math.sqrt(gx*gx+gy*gy))*180/Math.PI,el=Math.round(elevOf(h[i],o));
  let t=`x ${(u*o.areaKm).toFixed(2)} км · y ${(w*o.areaKm).toFixed(2)} км<br>${el.toLocaleString('ru-RU')} м · уклон ${deg.toFixed(0)}°`;
  if(ST.view==='height'){const n=NODE[ST.sel];t+=` · узел ${n.data[Math.floor(w*n.size)*n.size+Math.floor(u*n.size)].toFixed(3)}`}
  $('#readout').innerHTML=t;
});
c2d.addEventListener('pointerleave',()=>{if(ST.view!=='3d')refreshReadout()});
function refreshReadout(){
  const S=NODE.out.size,cell=Math.round(P.out.areaKm*1000/S),base=`${S}×${S} · ${P.out.areaKm} км · ${cell} м/пиксель`;
  $('#readout').innerHTML=ST.view==='ero'?'<span class="dot" style="background:#e87028"></span>снос породы<span class="dot" style="background:#2ebeb0"></span>отложение. '+base:'Наведи курсор на карту, чтобы увидеть высоту. '+base;
}

/* ---------- 3D (plain WebGL): sky, sun, cast shadows, water glints ---------- */
const V3={gl:null,M:0,nIdx:0,key:'',yaw:1.448,pitch:0.30,dist:3.1,auto:false,raf:0,last:0,phase:0.6,u32:false,scale:1,slow:0,fast:0,ov:null};
const PREC='#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
const GL_SKY=`uniform vec3 uLight;uniform vec3 uSunCol;uniform vec3 uZen;uniform vec3 uHor;uniform float uNight;
vec3 sky(vec3 r){
  float t=clamp(r.y,0.0,1.0);
  vec3 c=mix(uHor,uZen,pow(t,0.5));
  float cs=max(dot(r,uLight),0.0);
  c+=uSunCol*(pow(cs,5.0)*0.18+pow(cs,48.0)*0.32);
  float vis=smoothstep(-0.03,0.03,r.y)*step(-0.05,uLight.y);
  c+=uSunCol*smoothstep(0.9995,0.99985,cs)*5.0*vis;
  vec3 g=floor(r*170.0);
  float hh=fract(sin(dot(g,vec3(12.9898,78.233,45.164)))*43758.5453);
  c+=vec3(step(0.9972,hh)*uNight*smoothstep(0.05,0.3,r.y));
  return c;
}`;
const VS_T=`attribute vec3 aPos;attribute vec3 aNor;attribute vec3 aCol;uniform mat4 uMVP;varying vec3 vN;varying vec3 vC;varying vec3 vW;
void main(){vN=aNor;vC=aCol;vW=aPos;gl_Position=uMVP*vec4(aPos,1.0);}`;
const VS_S=`attribute vec2 aQ;varying vec2 vQ;void main(){vQ=aQ;gl_Position=vec4(aQ,0.9999,1.0);}`;
const FS_S=PREC+GL_SKY+`varying vec2 vQ;uniform vec3 uF;uniform vec3 uR;uniform vec3 uU;uniform float uTan;uniform float uAsp;
void main(){vec3 r=normalize(uF+uR*(vQ.x*uTan*uAsp)+uU*(vQ.y*uTan));gl_FragColor=vec4(sky(r),1.0);}`;
const FS_T=PREC+GL_SKY+`varying vec3 vN;varying vec3 vC;varying vec3 vW;
uniform vec3 uEye;uniform sampler2D uH;uniform float uSea;uniform float uYS;uniform float uMaxY;uniform float uFogD;uniform float uTime;
uniform sampler2D uSM;uniform float uSMon;const float SMR=5.0;
uniform float uShadow;uniform float uSunI;uniform float uMoon;uniform vec3 uWS;uniform vec3 uWD;uniform vec3 uAmb;uniform float uWater;uniform float uAlpha;
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x),mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x),f.y);}
float hAt(vec2 uv){vec4 t=texture2D(uH,uv);float h=(t.r*255.0*256.0+t.g*255.0)/65535.0;return max((h-uSea)*uYS,0.0);}
float shadow(vec3 p){
  if(uShadow<0.5)return 1.0;
  if(uLight.y<=0.0)return 0.0;
  float sh=1.0;
  if(uSMon>0.5){
    vec2 suv=p.xz*(0.5/SMR)+0.5;
    if(suv.x>0.0&&suv.x<1.0&&suv.y>0.0&&suv.y<1.0)sh=texture2D(uSM,suv).r;
  }
  if(sh<0.01)return 0.0;
  float t=0.012;
  for(int i=0;i<14;i++){
    vec3 q=p+uLight*t;
    if(q.y>uMaxY)break;
    if(q.x>-1.0&&q.x<1.0&&q.z>-1.0&&q.z<1.0){
      float d=q.y-hAt(q.xz*0.5+0.5);
      sh=min(sh,clamp(d/(0.004+0.04*t),0.0,1.0));
    }
    t+=0.01+0.14*t;
  }
  return smoothstep(0.0,1.0,sh);
}
void main(){
  vec3 V=normalize(uEye-vW);float dist=length(uEye-vW);
  vec3 col;float alpha=1.0;
  /* a low sun barely lights flat ground, so cast shadows vanish; lift the light for the diffuse term only (shadow geometry stays exact) */
  float lift=0.2*(1.0-smoothstep(0.1,0.5,uLight.y));
  if(uWater>0.5){
    vec2 q=vW.xz*45.0;float ra=1.0/(1.0+dist*0.9);
    vec3 n=normalize(vec3((sin(q.x*0.7+uTime*1.3)*0.03+sin(q.y*1.3-uTime)*0.02)*ra,1.0,(cos(q.y*0.8+uTime*1.1)*0.03+cos(q.x*1.7+uTime*0.7)*0.015)*ra));
    vec2 wuv=vW.xz*0.5+0.5;
    vec4 wt=texture2D(uH,clamp(wuv,0.0,1.0));
    float edgeDepth=max((uSea-(wt.r*255.0*256.0+wt.g*255.0)/65535.0)*uYS,0.0);
    float dOut=max(max(abs(vW.x),abs(vW.z))-1.0,0.0);
    float wdepth=mix(edgeDepth,1.0,smoothstep(0.0,0.3,dOut));
    float sh=shadow(vW+vec3(0.0,0.002,0.0));
    float fr=pow(1.0-max(dot(V,n),0.0),4.0);
    vec3 R=reflect(-V,n);
    vec3 refl=sky(vec3(R.x,abs(R.y),R.z));
    vec3 base=mix(uWS,uWD,smoothstep(0.0,0.15,wdepth))*(uAmb*0.9+uSunCol*uSunI*max(uLight.y+lift,0.0)*1.1*sh);
    col=mix(base,refl,0.15+0.7*fr);
    col+=uSunCol*pow(max(dot(R,uLight),0.0),300.0)*3.5*sh*uSunI;
    alpha=1.0;
    col+=vec3(0.35,0.45,0.8)*uMoon*0.05;
  }else{
    vec3 N=normalize(vN);
    float g1=vn(vW.xz*260.0);float g2=vn(vW.xz*900.0);float nf=1.0/(1.0+dist*0.6);
    float rock=1.0-N.y;
    float outside=smoothstep(0.9,1.4,max(abs(vW.x),abs(vW.z)));
    float lf=vn(vW.xz*1.3)*0.55+vn(vW.xz*4.5)*0.45;
    vec3 n=normalize(N+vec3(g1-0.5,0.0,g2-0.5)*(0.10+0.5*rock)*nf+vec3(vn(vW.xz*3.0+7.0)-0.5,0.0,vn(vW.xz*3.0+19.0)-0.5)*0.55*outside);
    float sh=shadow(vW+N*0.003);
    float dif=max(dot(n,normalize(uLight+vec3(0.0,lift,0.0))),0.0)*sh;
    vec3 shT=mix(vec3(1.0),vec3(0.8,0.92,1.15),(1.0-sh)*uSunI*0.8);
    float hem=0.5+0.5*n.y;
    vec3 mdir=normalize(vec3(-uLight.x,abs(uLight.y)+0.6,-uLight.z));
    col=vC*(0.88+0.24*mix(0.5,g1,nf))*(uAmb*hem*shT+uSunCol*uSunI*dif*0.85+vec3(0.35,0.45,0.8)*max(dot(n,mdir),0.0)*uMoon*0.32);
    col*=(1.0+(lf-0.5)*0.7*outside)*mix(vec3(1.0),vec3(1.14,1.02,0.78),smoothstep(0.35,0.65,lf)*outside);
  }
  float f=clamp(1.0-exp(-dist*uFogD),0.0,0.97);
  col=mix(col,sky(-V),f);
  gl_FragColor=vec4(col,alpha);
}`;

const showEl=$('#show');
/* a low golden-hour arc: about 55% of the loop the sun stays under 10 degrees, peak 20 */
function showSun(u){const s=Math.sin(Math.PI*u);return{ph:Math.PI*u,alt:-2+22*Math.pow(s,2.5),az:((80+200*u)%360+360)%360}}
function pad2(n){return String(n).padStart(2,'0')}
function clockText(ph){const h=5.5+13*ph/Math.PI,hh=Math.floor(h),mm=Math.floor((h-hh)*60);return pad2(hh)+':'+pad2(mm)}
function phaseLabel(s,u){
  if(s.alt<0)return u<0.5?'Рассвет':'Сумерки';
  if(s.alt<12)return u<0.5?'Рассвет':'Закат';
  return 'Золотой час';
}
function showGradient(){
  const stops=[];
  for(let i=0;i<=24;i++){
    const u=i/24,sp=skyParams(showSun(u).alt),c=mixv(sp.hor,sp.zen,0.45).map(v=>Math.round(clamp(v,0,1)*255));
    stops.push(`rgb(${c[0]},${c[1]},${c[2]}) ${(u*100).toFixed(1)}%`);
  }
  $('#shTrack').style.background='linear-gradient(90deg,'+stops.join(',')+')';
  SHOW.gradient=true;
}
function applyShow(){
  const u=SHOW.u,s=showSun(u);
  V3.ov={alt:s.alt,az:s.az};
  V3.yaw=-(1.05+2*Math.PI*u);
  V3.pitch=0.24+0.10*Math.sin(4*Math.PI*u-0.5);
  V3.dist=1.8+0.25*Math.cos(2*Math.PI*u);
}
function updateShowUI(){
  const u=SHOW.u,s=showSun(u),sec=Math.floor(u*SHOW.dur);
  if(!SHOW.drag)$('#shTl').value=Math.round(u*1000);
  $('#shClock').innerHTML=`<b title="Высота солнца над горизонтом">${Math.round(s.alt)}°</b><span>${Math.floor(sec/60)}:${pad2(sec%60)} / ${Math.floor(SHOW.dur/60)}:${pad2(SHOW.dur%60)}</span>`;
  $('#shPhase').textContent=phaseLabel(s,u);
}
const ICON_PLAY='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z" fill="currentColor"/></svg>';
function setPlaying(on){
  SHOW.playing=on;const b=$('#shPlay');
  b.innerHTML=on?ICON_PAUSE:ICON_PLAY;b.setAttribute('aria-label',on?'Остановить':'Запустить');b.title=on?'Остановить':'Запустить';
  wake();
}
function showTick(now){
  SHOW.raf=0;if(ST.view!=='show')return;
  const raw=(now-(SHOW.last||now))/1000,dt=Math.min(0.1,raw);SHOW.last=now;
  adaptScale(raw);
  if(SHOW.playing&&!SHOW.drag){SHOW.u+=dt*SHOW.speed/SHOW.dur;if(SHOW.u>=1)SHOW.u-=1}
  applyShow();updateShowUI();draw3D();
  SHOW.raf=requestAnimationFrame(showTick);
}
function startShow(){SHOW.last=0;if(!SHOW.raf)SHOW.raf=requestAnimationFrame(showTick)}
function wake(){
  showEl.classList.remove('idle');clearTimeout(SHOW.idle);
  SHOW.idle=setTimeout(()=>{if(SHOW.playing&&!SHOW.drag&&!$('#shBar').matches(':hover')&&!showEl.contains(document.activeElement.closest('select,input')||null))showEl.classList.add('idle')},3200);
}
function enterShow(){
  SHOW.cam={yaw:V3.yaw,pitch:V3.pitch,dist:V3.dist,auto:V3.auto};
  V3.auto=false;stopLoop();
  if(!SHOW.gradient)showGradient();
  showEl.hidden=false;showEl.insertBefore(c3d,showEl.firstChild);c3d.hidden=false;
  document.documentElement.style.overflow='hidden';
  setPlaying(!REDUCED);
  ensureMesh();applyShow();updateShowUI();startShow();
  $('#shPlay').focus({preventScroll:true});
}
function leaveShow(){
  if(SHOW.raf){cancelAnimationFrame(SHOW.raf);SHOW.raf=0}
  clearTimeout(SHOW.idle);showEl.classList.remove('idle');
  stage.insertBefore(c3d,$('#tag'));
  showEl.hidden=true;V3.ov=null;
  if(SHOW.cam){V3.yaw=SHOW.cam.yaw;V3.pitch=SHOW.cam.pitch;V3.dist=SHOW.cam.dist;V3.auto=SHOW.cam.auto}
  document.documentElement.style.overflow='';
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
}
function bindShow(){
  const tl=$('#shTl');
  $('#shPlay').addEventListener('click',()=>setPlaying(!SHOW.playing));
  tl.addEventListener('pointerdown',()=>{SHOW.drag=true});
  const up=()=>{SHOW.drag=false;wake()};
  tl.addEventListener('pointerup',up);tl.addEventListener('pointercancel',up);tl.addEventListener('blur',up);
  tl.addEventListener('input',()=>{SHOW.u=Math.min(0.9999,tl.value/1000);applyShow();updateShowUI()});
  $('#shSpeed').addEventListener('change',e=>{SHOW.speed=+e.target.value});
  $('#shClose').addEventListener('click',()=>setView(ST.prev||'3d'));
  const fs=$('#shFs');
  if(!document.fullscreenEnabled||!showEl.requestFullscreen)fs.hidden=true;
  fs.addEventListener('click',()=>{
    if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}
    else showEl.requestFullscreen().catch(()=>{});
  });
  ['pointermove','pointerdown','touchstart'].forEach(ev=>showEl.addEventListener(ev,wake,{passive:true}));
  document.addEventListener('keydown',e=>{
    if(ST.view!=='show')return;
    if(e.key==='Escape'&&!document.fullscreenElement){setView(ST.prev||'3d');return}
    if(e.key===' '&&!/^(BUTTON|INPUT|SELECT)$/.test(e.target.tagName)){e.preventDefault();setPlaying(!SHOW.playing)}
  });
}

/* ---------- wiring ---------- */
function setView(v){
  if(v!=='3d'&&ST.cycle)setCycle(false);
  if(ST.view==='show'&&v!=='show')leaveShow();
  if(v==='show'){
    if(ST.view!=='show')ST.prev=ST.view;
    ST.view='show';enterShow();refreshStage();return;
  }
  ST.view=v;
  refreshStage();
}
function init(){
  buildGraph();bindInspector();
  $('#presets').innerHTML=Object.keys(PRESETS).map(k=>`<button type="button" class="chip" data-p="${k}" aria-pressed="${k===ST.preset}">${PRESETS[k].name}</button>`).join('');
  $('#presets').addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;
    applyPreset(b.dataset.p);markPresets();renderInspector();schedule(30);
  });
  $('#res').addEventListener('change',e=>{
    N=+e.target.value;GRAPH.forEach(g=>NODE[g.id].dirty=true);V3.M=0;V3.key='';schedule(30);
  });
  $('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t&&!t.disabled)setView(t.dataset.v)});
  $('#cont').addEventListener('change',e=>{ST.contours=e.target.checked;refreshAll()});
  $('#shd').addEventListener('change',e=>{ST.shadows=e.target.checked;refreshAll()});
  $('#cycle').addEventListener('click',()=>setCycle(!ST.cycle));
  if(!init3D()){['#tab3d','#tabShow'].forEach(q=>{$(q).disabled=true;$(q).title='WebGL недоступен'});ST.view='relief'}
  bindShow();
  const ro=new ResizeObserver(()=>{if(!NODE.out.data||ST.view==='show')return;if(ST.view==='3d')draw3D();else draw2D()});ro.observe(stage);
  renderInspector();refreshStage();refreshGraph();
  schedule(30);
}
init();
})();
</script>

</body></html>
